<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1118" media="(prefers-color-scheme: dark)">
<title>Notfall Kompass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F1EF; --surface:#FFFFFF; --surface2:#F7F5F3; --ink:#1E1715; --muted:#6B5E59; --line:#E0D9D5;
  --accent:#B3261E; --accent-soft:#FBE4E1; --accent-ink:#FFFFFF;
  --ok:#2C7A3F; --ok-soft:#E1F2E5; --warn:#A8620A; --warn-soft:#FBEFD9; --info:#1F5F8B; --info-soft:#E1EEF7;
  --shadow:0 1px 2px rgba(30,23,21,.06),0 4px 14px rgba(30,23,21,.05);
  --f-display:"Barlow Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tabh:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141010; --surface:#1E1817; --surface2:#261F1E; --ink:#F0E9E6; --muted:#A99C97; --line:#35292A;
    --accent:#FF6F66; --accent-soft:#3A1B19; --accent-ink:#2A0907;
    --ok:#79D08E; --ok-soft:#15301D; --warn:#F2B35A; --warn-soft:#352813; --info:#7DBDEB; --info-soft:#14293A;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#141010; --surface:#1E1817; --surface2:#261F1E; --ink:#F0E9E6; --muted:#A99C97; --line:#35292A;
  --accent:#FF6F66; --accent-soft:#3A1B19; --accent-ink:#2A0907;
  --ok:#79D08E; --ok-soft:#15301D; --warn:#F2B35A; --warn-soft:#352813; --info:#7DBDEB; --info-soft:#14293A;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:var(--toph,110px);overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input,select{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:900px;margin:0 auto;padding-inline:14px}

/* Header */
.top{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;background:none;border:0;padding:0}
.brand svg{width:28px;height:28px}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.brand b span{color:var(--accent)}
.search{flex:1 1 auto;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px 8px 34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.iconbtn{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
@media (max-width:640px){
  .top .wrap{flex-wrap:wrap;row-gap:8px}
  .brand{flex:1 1 0;min-width:0}
  .brand b{font-size:1.1rem;white-space:nowrap}
  .search{order:3;flex-basis:100%}
}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:2px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 8px;color:var(--muted);font-size:11px;font-weight:600;min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--accent)}
main{padding-block:14px calc(var(--tabh) + 34px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .tabs{position:sticky;top:var(--toph,57px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);background:var(--bg)}
  .tabs .wrap{display:flex;gap:4px;padding-inline:14px}
  .tab{flex-direction:row;gap:8px;font-size:15px;padding:10px 14px;border-bottom:2px solid transparent}
  .tab svg{width:20px;height:20px}
  .tab[aria-current="true"]{border-bottom-color:currentColor}
}

/* Generic */
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;color:var(--muted);font-weight:600}
.h1{font-size:1.9rem}
.lead{color:var(--muted);margin:.3rem 0 0;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.back{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disclaimer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item b{font-size:17px}
.item .sub{grid-column:1/-1;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .chev{color:var(--muted)}
.grp-h{font-family:var(--f-display);font-size:1.05rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 2px 6px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

/* Detail boxes */
.box{border-radius:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line)}
.box h3{font-size:1.15rem;margin-bottom:6px}
.box.def{border-left:4px solid var(--accent)}
.box.def h3{color:var(--accent)}
.box.merke{background:var(--ok-soft);border-color:transparent;border-left:4px solid var(--ok)}
.box.merke h3{color:var(--ok)}
.box.cave{background:var(--accent-soft);border-color:transparent;border-left:4px solid var(--accent)}
.box.cave h3{color:var(--accent)}
.box.kids{background:var(--warn-soft);border-color:transparent;border-left:4px solid var(--warn)}
.box.kids h3{color:var(--warn)}
ul.clean{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.fx{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.fx div{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15.5px}
.fx b{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--muted)}
.srclist{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.srclist a{color:var(--accent);overflow-wrap:anywhere}
h1,h2,h3,b{overflow-wrap:anywhere}

/* Learn */
.flash{min-height:270px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.flash .q{font-family:var(--f-display);font-size:1.55rem;font-weight:600;line-height:1.2}
.flash .a{border-top:1px dashed var(--line);padding-top:14px;font-size:17px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate button{border-radius:10px;padding:10px 4px;font-weight:700;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;font-size:15px}
.rate button small{font-weight:400;color:var(--muted);font-size:12px}
.rate .r0{color:var(--accent)}.rate .r1{color:var(--warn)}.rate .r2{color:var(--ok)}.rate .r3{color:var(--info)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--f-display);font-size:1.25rem}
.mode span{font-size:13.5px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .bar{grid-column:1/-1}

/* Tools */
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1 1 auto;border:0;background:none;padding:8px 10px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%;font-family:var(--f-mono);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.timer{font-family:var(--f-mono);font-size:2.4rem;font-weight:600;line-height:1}
.cpr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cpr .big{padding:14px 8px;font-size:17px;font-weight:700;border-radius:12px}
.log{font-family:var(--f-mono);font-size:13.5px;max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.alert{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 12px;font-weight:700;text-align:center}
.hl{background:color-mix(in srgb,var(--warn) 30%,transparent);border-radius:2px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ===== Design: Deutscher Rettungsdienst (Signalfarben, Star of Life, Warnmarkierung) ===== */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#10151C; --muted:#5B6674; --line:#DDE3EA;
  --accent:#D4231C; --accent-soft:#FDE6E4; --accent-ink:#FFFFFF;
  --sig:#F7D600; --blue:#0B5FA5; --blue-soft:#E2EEF9;
  --shadow:0 1px 2px rgba(16,21,28,.06),0 8px 24px rgba(16,21,28,.06);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1118; --surface:#131B25; --surface2:#1A2430; --ink:#EDF2F7; --muted:#9AA8B8; --line:#243140;
  --accent:#FF5A4F; --accent-soft:#3A1A1A; --accent-ink:#2A0907; --sig:#FFD92E; --blue:#5AAEF0; --blue-soft:#12283D;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#0B1118; --surface:#131B25; --surface2:#1A2430; --ink:#EDF2F7; --muted:#9AA8B8; --line:#243140;
  --accent:#FF5A4F; --accent-soft:#3A1A1A; --accent-ink:#2A0907; --sig:#FFD92E; --blue:#5AAEF0; --blue-soft:#12283D;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);}
body{letter-spacing:-.005em}
.top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);box-shadow:none}
.batten{height:7px;background:conic-gradient(var(--accent) 25%,var(--sig) 0 50%,var(--accent) 0 75%,var(--sig) 0) 0 0/14px 14px}
.brand b{font-size:1.35rem;letter-spacing:.03em}
.brand b span{color:var(--accent)}
.search input,.iconbtn{border-radius:12px;min-height:40px}
.card,.list,.box,.tbl,.stat,.mode{border-radius:var(--r)}
.card{box-shadow:var(--shadow);border:1px solid var(--line)}
.list{box-shadow:var(--shadow)}
.item{padding:14px 16px;min-height:56px}
.item b{font-weight:600}
.btn{min-height:46px;border-radius:12px;padding:10px 16px}
.btn.primary{background:var(--accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.chip{padding:7px 14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{position:relative;padding:9px 0 8px}
.tab[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab[aria-current="true"]{color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px;flex:0 0 auto}
.grp-h{display:flex;align-items:center}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;color:#fff;background:linear-gradient(135deg,#B3160F 0%,#D4231C 55%,#E8502A 100%);box-shadow:0 12px 30px color-mix(in srgb,#D4231C 35%,transparent)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;opacity:.16;background:
 conic-gradient(from 0deg,#fff 0 8%,transparent 0 17%,#fff 0 25%,transparent 0 33%,#fff 0 42%,transparent 0 50%,#fff 0 58%,transparent 0 67%,#fff 0 75%,transparent 0 83%,#fff 0 92%,transparent 0);border-radius:50%}
.hero .eyebrow{color:rgba(255,255,255,.8)}
.hero h1{font-size:2rem;margin-top:2px}
.hero p{margin:6px 0 0;color:rgba(255,255,255,.9);max-width:46ch;font-size:15px}
.hero .cd{display:inline-flex;align-items:baseline;gap:8px;margin-top:12px;background:rgba(0,0,0,.22);border-radius:12px;padding:8px 14px;font-weight:600}
.hero .cd b{font-family:var(--f-display);font-size:1.9rem;color:var(--sig)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.qt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 14px 14px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-height:76px}
.qt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--accent))}
.qt b{font-family:var(--f-display);font-size:1.25rem;line-height:1.1}
.qt span{font-size:13px;color:var(--muted)}
.box.def{border-left-color:var(--blue)}
.box.def h3{color:var(--blue)}
.pill{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.flash{border-radius:20px;box-shadow:var(--shadow)}
.rate button{min-height:60px;border-radius:14px}
.stat b{color:var(--ink)}
.stat:first-child b{color:var(--accent)}
.alert{background:var(--accent)}
.timer{letter-spacing:-.02em}
.seg{border-radius:12px}
.seg button[aria-selected="true"]{background:var(--blue);color:#fff}
th{background:var(--blue-soft);color:var(--blue)}
.bar i{background:linear-gradient(90deg,var(--accent),#E8502A)}
@media (max-width:640px){.hero h1{font-size:1.7rem}}

/* Spritzen-Aufkleber ISO 26825 */
.syr{--lab:#fff;position:relative;display:inline-flex;align-items:center;background:var(--lab);font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:2px 9px;font-size:.92rem;line-height:1.25;border:1px solid rgba(0,0,0,.22);white-space:nowrap;overflow:hidden}
.syr.stripe{padding-inline:20px}
.syr.stripe::before,.syr.stripe::after{content:"";position:absolute;top:0;bottom:0;width:13px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.95) 0 3px,transparent 3px 7px)}
.syr.stripe::before{left:0}.syr.stripe::after{right:0}
.syr.big{font-size:1.7rem;padding:6px 16px;border-radius:6px;white-space:normal}
.syr.big.stripe{padding-inline:34px}
.syr.big.stripe::before,.syr.big.stripe::after{width:22px}
.labbox{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.item .chev.lab{display:flex;gap:4px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--lab);border:1px solid rgba(128,128,128,.5);margin-right:7px;vertical-align:-2px}
.sw.sws{background:repeating-linear-gradient(-45deg,var(--lab) 0 3px,#fff 3px 5px)}
.chip[aria-pressed="true"] .sw{border-color:#fff}

.ecg{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;width:100%;font-weight:600;min-height:50px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:1;color:var(--ink)}

/* ===== Liquid Glass + iPhone 14 Pro ===== */
:root{
 --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.74);--glass-brd:rgba(255,255,255,.8);
 --gshadow:0 10px 30px rgba(20,30,60,.10),0 1px 2px rgba(20,30,60,.06);
 --gspec:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.3);
 --b1:rgba(212,35,28,.20);--b2:rgba(11,95,165,.22);--b3:rgba(247,214,0,.24);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

<script>
// Notfall Kompass – Themen Teil 1 (Reanimation, Kardiovaskulär, Atemwege/Atmung)
window.TOPICS = window.TOPICS || [];
window.TOPICS.push(
{id:'als',cat:'Reanimation',t:'Erwachsenen-ALS (ERC 2025)',s:'Algorithmus, Defibrillation, Medikamente, Abbruch',
 def:'Kreislaufstillstand = bewusstlos + keine normale Atmung (Schnappatmung zählt nicht). ERC-Leitlinien 2025 (Okt. 2025; deutsche Fassung über den GRC). Kern: hochwertige Kompressionen, frühe Defibrillation, reversible Ursachen behandeln.',
 dx:['Ansprechen, Atemwege öffnen, höchstens 10 s Atmung prüfen (sehen, hören, fühlen)','Notruf / Reanimationsteam, Defibrillator holen','Rhythmusanalyse: **schockbar** (VF / pulslose VT) vs. **nicht schockbar** (Asystolie / PEA)'],
 tx:['**Kompressionen:** Mitte Brustkorb, 5–6 cm tief, 100–120/min, volle Entlastung, 30:2 bis zum gesicherten Atemweg, danach durchgehend + ca. 10 Beatmungen/min','**Schockbar:** 1 Schock → sofort 2 min CPR → Rhythmuscheck','**Nach 3. Schock:** Adrenalin 1 mg + Amiodaron 300 mg (nach 5. Schock Amiodaron 150 mg); Adrenalin danach alle 3–5 min (jeder 2. Zyklus). Alternative zu Amiodaron: Lidocain 1–1,5 mg/kg','**Nicht schockbar:** Adrenalin 1 mg so früh wie möglich, dann alle 3–5 min','**Refraktäres VF:** Pad-Position ändern (anterior-posterior), reversible Ursachen suchen, ggf. ECPR (zentrumsabhängig)','**Atemweg:** Beutel-Maske / supraglottischer Atemweg; Intubation nur durch sehr erfahrene Anwender ohne längere Kompressionspause; Kapnographie zur Lagekontrolle','**Ultraschall** (Tamponade, Pneumothorax, RV-Dilatation) nur ohne Verlängerung der Kompressionspausen','**4H/4T** systematisch abarbeiten (siehe Thema „Spezielle Reanimationssituationen“)'],
 meds:['Adrenalin: 1 mg (1 Amp. = 1 mg/ml) auf 10 ml NaCl 0,9 % = 0,1 mg/ml, i.v./i.o., anschließend 20 ml Flush','Amiodaron: 300 mg i.v./i.o. (in 20 ml Glukose 5 %), dann 150 mg','Lidocain: 100 mg (1–1,5 mg/kg) falls Amiodaron nicht verfügbar'],
 cave:['Kompressionspausen so kurz wie möglich (Prä-Schock-Pause <5 s)','Hyperventilation vermeiden (senkt koronaren und zerebralen Fluss)','Kein routinemäßiges Natriumbikarbonat oder Kalzium – nur bei spezifischer Indikation (Hyperkaliämie, Intoxikation)','Defibrillationsenergie: biphasisch laut Herstellerangabe (meist 150–200 J), monophasisch 360 J'],
 merke:['Überlebensrelevant sind Kompressionsqualität und frühe Defibrillation; Medikamente sind nachrangig','Adrenalin: nicht schockbar sofort, schockbar erst nach dem 3. Schock','Terminierung: Teamentscheidung nach Ausschöpfen reversibler Ursachen; persistierend sehr niedriges etCO2 (<10 mmHg nach 20 min) spricht unterstützend für Abbruch'],
 ll:[['ERC Guidelines 2025 – Adult ALS','https://www.cprguidelines.eu'],['Deutscher Rat für Wiederbelebung (GRC)','https://www.grc-org.de']]},

{id:'spezial',cat:'Reanimation',t:'Spezielle Reanimationssituationen',s:'4H/4T, Hyperkaliämie, Trauma, Schwangerschaft, Ertrinken',

 merke:['Systematisch 4H/4T beim Rhythmuscheck durchgehen','Traumaarrest: Blutung vor Herzdruckmassage'],
 ll:[['ERC Guidelines 2025 – Special Circumstances','https://www.cprguidelines.eu']]},

{id:'postrea',cat:'Reanimation',t:'Postreanimationsbehandlung',s:'ROSC, Zielwerte, Koronarangiographie, Neuroprognose',

{id:'plsrea',cat:'Reanimation',t:'Kinderreanimation (PLS)',s:'ERC 2025 Paediatric Life Support, Dosen nach Gewicht',
 def:'Kinder erleiden meist einen hypoxischen Arrest (Atem-/Kreislaufversagen), selten primär VF. Daher beginnt die Reanimation mit Beatmung.',
 dx:['Ansprechen, Atemwege öffnen, max. 10 s Atmung + Puls (A. brachialis < 1 J, A. carotis/femoralis ≥ 1 J)','Pulsfrequenz <60/min mit Zeichen des Kreislaufversagens = Reanimationsindikation'],
 tx:['**5 initiale Beatmungen** (mit O₂), dann **15:2** (Kompressionsfrequenz 100–120/min)','Kompressionstiefe ca. ⅓ des Thoraxdurchmessers (Säugling ~4 cm, Kind ~5 cm)','Säugling: Zwei-Daumen-Technik (Helfer-Team), Einzelretter: 2 Finger','**Schock:** 4 J/kg (biphasisch), dann 2 min CPR','Adrenalin 10 µg/kg i.v./i.o. alle 3–5 min (nach 3. Schock bei VF/pVT; sofort bei nicht schockbar)','Amiodaron 5 mg/kg nach dem 3. Schock (und nach 5. Schock)','Reversible Ursachen: Hypoxie, Hypovolämie, Hypoglykämie, Elektrolyte, Hypothermie, Tamponade, Toxine, Thrombose, Pneumothorax','Zugang: i.o. früh (Tibia), Volumenbolus 10 ml/kg balancierte Lösung bei Hypovolämie'],
 meds:['Adrenalin 10 µg/kg = 0,1 ml/kg der 1:10.000-Lösung (1 mg auf 10 ml)','Amiodaron 5 mg/kg','Glukose 10 %: 2 ml/kg bei Hypoglykämie','Atropin nicht routinemäßig'],
 kids:['Gewichtsschätzung 1–10 Jahre: (Alter + 4) × 2 kg; Säuglinge 3–12 Monate: (Monate ÷ 2) + 4 kg; Neugeborenes ca. 3,5 kg','Tubus (mit Cuff) ID = Alter ÷ 4 + 3,5; Einführtiefe oral = Tubusgröße × 3 (cm)'],
 cave:['Kompressionstiefe bei Säuglingen oft zu gering','Hyperventilation und zu hohe Beatmungsdrücke vermeiden'],
 merke:['Kind: erst Atemwege und Beatmung, dann Kompression (anders als Erwachsene)','Adrenalin 10 µg/kg (0,1 ml/kg der 1:10.000-Lösung)'],
 ll:[['ERC Guidelines 2025 – Paediatric Life Support','https://www.cprguidelines.eu']]},

{id:'nls',cat:'Reanimation',t:'Neugeborenenversorgung (NLS)',s:'Erstversorgung, Beatmung, 3:1, Adrenalin',
 def:'Etwa 10 % der Neugeborenen benötigen Unterstützung bei der Adaptation, ≤1 % eine Reanimation. Hauptproblem: Atemantrieb/Lungenentfaltung.',
 dx:['Erstbeurteilung: Atmung, Tonus, Herzfrequenz (HF) – Apgar nicht zur Entscheidung nutzen, nur Dokumentation (1/5/10 min)'],
 tx:['Trocknen, Wärmen (Mütze, Folie), stimulieren, Atemweg freimachen (Neutralposition)','Bei Apnoe/Gasping oder HF <100/min: **5 initiale Blähbreaths** (Spitzendruck ~25–30 cmH₂O, 2–3 s) mit Raumluft bzw. 21–30 % O₂ (Termin) – danach Thoraxexkursion kontrollieren','Dann Beatmung 30/min; Pulsoxymeter rechte Hand','HF <60/min trotz effektiver Beatmung: Thoraxkompression 3:1 (90 Kompressionen + 30 Beatmungen/min), O₂ auf 100 %','Adrenalin 10–30 µg/kg i.v. (Nabelvene) bzw. 0,1 ml/kg der 1:10.000-Lösung; Volumen 10 ml/kg bei Hypovolämie','Wärmeerhalt auch bei Reanimation (Hypothermie vermeiden, Zieltemp. 36,5–37,5 °C)'],
 meds:['Adrenalin 10–30 µg/kg i.v.','Glukose 10 %: 2.5 ml/kg bei Hypoglykämie (nach Leitlinie/SOP)'],
 kids:['Zielsättigung preduktal: 1 min ~60 %, 5 min ~80–85 %, 10 min ~90 %'],
 cave:['Nicht zu hoher Beatmungsdruck (Pneumothorax)','Absaugen nur bei sichtbarer Verlegung (Mekonium: nicht routinemäßig)'],
 merke:['Beatmung ist die wichtigste Maßnahme – 90 % der Probleme sind pulmonal','Kompression erst, wenn die Beatmung effektiv ist'],
 ll:[['ERC Guidelines 2025 – Newborn Life Support','https://www.cprguidelines.eu']]},

{id:'acs',cat:'Kardiovaskulär',t:'Akutes Koronarsyndrom (STEMI / NSTE-ACS)',s:'EKG-Kriterien, Erstversorgung, Reperfusion',
 def:'ACS umfasst instabile Angina, NSTEMI und STEMI. Der STEMI ist durch ST-Hebungen und akuten Koronarverschluss gekennzeichnet – Reperfusionszeit ist entscheidend.',
 dx:['Symptome: Retrosternaler Schmerz/Druck, Ausstrahlung Arm/Kiefer, Dyspnoe, Übelkeit, atypisch bei Frauen, Diabetikern, Älteren','12-Kanal-EKG innerhalb von 10 min nach Erstkontakt; ST-Hebung ≥0,1 mV in ≥2 benachbarten Ableitungen (V2–V3: ≥0,25 mV Männer <40 J, ≥0,2 mV Männer ≥40 J, ≥0,15 mV Frauen)','Äquivalente: neuer Linksschenkelblock mit Klinik, posteriorer Infarkt (ST-Senkung V1–V3, Ableitungen V7–V9), Hochrisiko-Muster (Wellens, De-Winter)','Rechtsherzinfarkt: bei inferiorem Infarkt Ableitung V4R'],
 tx:['Monitoring, i.v.-Zugang, Oberkörper hoch lagern, ruhig stellen','Sauerstoff nur bei SpO₂ <90 %','**ASS** 150–300 mg p.o. (alternativ 75–250 mg i.v.)','**Heparin** (UFH) 70–100 IE/kg i.v. (bei STEMI mit geplanter PCI)','Analgesie: Fentanyl 25–50 µg i.v. titriert (ggf. Morphin)','Nitroglycerin 0,4–0,8 mg sublingual bei Hypertonie/Lungenstauung, nicht bei RR <90–100 mmHg, RV-Infarkt, PDE-5-Hemmer','P2Y12-Hemmer: Vorbehandlung bei NSTE-ACS nicht routinemäßig (ESC 2023); bei STEMI nach Absprache mit dem Katheterlabor','Zielklinik: PCI-Zentrum mit Anmeldung; **STEMI: First-Medical-Contact → Draht ≤120 min**, sonst Fibrinolyse (innerhalb 10 min nach Diagnose; Tenecteplase gewichtsadaptiert, ≥75 J halbe Dosis) und anschließend Transfer','Rhythmusstörungen (VF, AV-Block, Bradykardie) vorbereiten, Defibrillator Pads kleben'],
 meds:['ASS 150–300 mg p.o. / 250 mg i.v.','Heparin 70–100 IE/kg (max. 5000 IE bei NSTE-ACS ohne PCI üblich 60–70 IE/kg)','Fentanyl 25–50 µg i.v.','Nitroglycerin 0,4–0,8 mg s.l. bzw. 1–6 mg/h','Tenecteplase (Fibrinolyse): <60 kg 30 mg, 60–<70 kg 35 mg, 70–<80 kg 40 mg, 80–<90 kg 45 mg, ≥90 kg 50 mg; ≥75 J: halbe Dosis'],
 cave:['Nitrat kontraindiziert bei Rechtsherzinfarkt, Hypotonie, PDE-5-Hemmern (24–48 h)','Keine i.m.-Injektionen vor Lyse','ASS bei Dissektionsverdacht nicht blind geben: Schmerz, Pulsdifferenz, Mediastinalverbreiterung beachten'],
 merke:['Bei Hinterwandinfarkt immer V4R ableiten','Zeitziel: FMC → Draht ≤120 min; sonst Lyse','O₂ nur bei Hypoxie (<90 %)'],
 ll:[['ESC Guidelines ACS 2023','https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Acute-Coronary-Syndromes-ACS-Guidelines'],['NVL Chronische KHK','https://www.leitlinien.de/themen/khk']]},

{id:'akutHI',cat:'Kardiovaskulär',t:'Akute Herzinsuffizienz, Lungenödem, kardiogener Schock',s:'Nitrat, Diuretika, NIV, Vasopressoren',
 def:'Akute Dekompensation mit Dyspnoe (Lungenödem) oder Hypoperfusion (kardiogener Schock: SBP <90 mmHg, Laktat ↑, Oligurie, kalte Peripherie trotz Volumen).',
 dx:['Klinik: Orthopnoe, Rasselgeräusche, Halsvenenstauung, Schaum vor dem Mund','EKG, SpO₂, RR, Rhythmus, Ultraschall (B-Linien), Ursache suchen: ACS, Arrhythmie, hypertensive Krise, Klappenvitium, Lungenembolie, Myokarditis'],
 tx:['Sitzende Lagerung, Beine herab','Sauerstoff nur bei SpO₂ <90 %; **CPAP/NIV** (PEEP 5–10 cmH₂O) bei respiratorischer Insuffizienz','**Nitroglycerin** 0,4–0,8 mg s.l. oder 1–6 mg/h i.v. bei SBP >100–110 mmHg','**Furosemid** 20–40 mg i.v. (bei Dauertherapie höher dosieren)','Opiate nicht routinemäßig (Atemdepression, ESC)','**Kardiogener Schock:** Noradrenalin (Mittel der Wahl bei Hypotonie), Dobutamin 2–10 µg/kg/min bei niedrigem HZV; Ursache (z. B. Infarkt) → Katheterlabor/Intensivstation','Rhythmusstörungen behandeln (Kardioversion bei instabiler Tachyarrhythmie)'],
 meds:['Nitroglycerin s.l. oder Perfusor','Furosemid 20–40 mg i.v.','Noradrenalin 0,05–0,5 µg/kg/min','Dobutamin 2–10 µg/kg/min'],
 cave:['Keine Nitrate bei Hypotension, Aortenstenose (relativ), RV-Infarkt','Furosemid nicht bei Hypovolämie/Schock','Volumengabe bei kardiogenem Schock nicht routinemäßig (nur bei klarer Hypovolämie)'],
 merke:['Nitrat + CPAP sind beim hypertensiven Lungenödem wirksamer als Diuretika allein','Kardiogener Schock: Ursache des Pumpversagens beseitigen (PCI)'],
 ll:[['ESC Guidelines Herzinsuffizienz 2021','https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Acute-and-Chronic-Heart-Failure'],['NVL Chronische Herzinsuffizienz','https://www.leitlinien.de/themen/herzinsuffizienz']]},

{id:'tachy',cat:'Kardiovaskulär',t:'Tachykarde Rhythmusstörungen',s:'Instabil → Kardioversion; stabil → Medikamente',
 def:'Tachykardie >100/min. Entscheidend: **Instabilitätszeichen** (Schock, Synkope, Myokardischämie, akute Herzinsuffizienz) und QRS-Breite.',
 dx:['12-Kanal-EKG: schmal vs. breit; regelmäßig vs. unregelmäßig','Breitkomplex-Tachykardie = ventrikulär, bis das Gegenteil bewiesen ist'],
 tx:['**Instabil:** sofortige synchronisierte Kardioversion (Analgosedierung): breit/VHF 120–150 J biphasisch, schmal regelmäßig 70–120 J; bei Pulslosigkeit → Reanimation','Schmal regelmäßig (SVT): vagale Manöver (modifizierter Valsalva mit passiver Beinhebung), dann **Adenosin** 6 mg → 12 mg → 12 mg schnell i.v. mit Flush','Vorhofflimmern, stabil: Frequenzkontrolle (Metoprolol 5 mg i.v. / Verapamil 5 mg), Rhythmuskontrolle in der Klinik (Amiodaron 300 mg wenn Herzinsuffizienz)','Stabile VT: Amiodaron 300 mg über 10–60 min; Torsade de pointes: Magnesium 2 g i.v. und Überdrehstimulation, Kardioversion/Defi bei Instabilität','Elektrolyte (K⁺, Mg²⁺), Ursachen (Intox, ACS, Hyperthyreose) berücksichtigen'],
 meds:['Adenosin 6/12/12 mg (Kinder 0,1/0,2 mg/kg)','Amiodaron 300 mg','Metoprolol 5 mg (Wiederholung bis 15 mg)','Verapamil 5 mg langsam','Magnesium 2 g'],
 cave:['Verapamil/Betablocker nicht bei Breitkomplex-Tachykardie, WPW mit VHF, Herzinsuffizienz','Adenosin: Asthma (relativ), AV-Block II–III, Herztransplantierte (Dosis halbieren), Theophyllin schwächt','WPW + VHF: Kardioversion oder Ajmalin/Procainamid, keine AV-Knoten-Blocker'],
 merke:['Instabil = elektrisch, stabil = medikamentös','Breit = VT bis zum Beweis des Gegenteils'],
 ll:[['ERC Guidelines 2025 – ALS (Peri-Arrest)','https://www.cprguidelines.eu'],['ESC Guidelines SVT / Vorhofflimmern','https://www.escardio.org/Guidelines']]},

{id:'brady',cat:'Kardiovaskulär',t:'Bradykarde Rhythmusstörungen',s:'Atropin, Adrenalin, Pacing',
 def:'Bradykardie <50/min mit **Zeichen der Instabilität** (Schock, Synkope, Ischämie, Herzinsuffizienz) erfordert Therapie.',
 dx:['EKG: Sinusbradykardie, AV-Block I–III (Mobitz 2 und III-Grad: gefährlich), Asystolierisiko','Ursachen: Inferiorer Infarkt, Medikamente (β-Blocker, Digitalis, Ca-Antagonisten), Hyperkaliämie, Hypothermie, Vagusreiz, erhöhter ICP'],
 tx:['O₂ bei Hypoxie, Zugang, Monitoring, Pads','**Atropin** 0,5 mg i.v., Wiederholung alle 3–5 min bis max. 3 mg','Bei Versagen: **Adrenalin-Infusion** 2–10 µg/min oder Dopamin 5–20 µg/kg/min; **transkutaner Schrittmacher** (Sedierung)','Bei Hochrisikozeichen (Asystolie ≤3 s, AV-Block Mobitz 2/III): Pacing primär','Ursachen therapieren (Hyperkaliämie → Calcium, β-Blocker → Glukagon)'],
 meds:['Atropin 0,5 mg i.v.','Adrenalin-Perfusor 2–10 µg/min','Glukagon 1–5 mg bei β-Blocker-Intox.'],
 cave:['Atropin kann bei infranodalem AV-Block paradox wirken','Pacing sedieren (Analgosedierung)'],
 merke:['Atropin 0,5 mg – nicht 0,1 mg (Dosen <0,5 mg können paradoxe Bradykardie auslösen)'],
 ll:[['ERC Guidelines – Periarrest-Arrhythmien','https://www.cprguidelines.eu']]},

{id:'hypert',cat:'Kardiovaskulär',t:'Hypertensive Notfälle & Aortendissektion',s:'Urapidil, Drucksenkung, Dissektion',
 def:'Hypertensive Krise: RR meist >180/120 mmHg. **Notfall** nur bei Endorganschaden (Enzephalopathie, Lungenödem, ACS, Dissektion, Eklampsie, intrazerebrale Blutung).',
 dx:['Symptome des Endorganschadens suchen; Aortendissektion: plötzlicher reißender Schmerz (Thorax/Rücken), Pulsdifferenz, RR-Seitendifferenz >20 mmHg, neurologische Ausfälle','Schweres hypertensives Notfall ohne Endorganschaden = „Dringlichkeit“ (oral, langsam)'],
 tx:['Hypertensiver Notfall: **Urapidil** 10–25 mg i.v. fraktioniert, dann 9–30 mg/h; Ziel: MAP-Senkung max. 20–25 % in der 1. Stunde','Lungenödem: Nitroglycerin + CPAP','Aortendissektion: Schmerztherapie (Fentanyl), **Sofort-Drucksenkung**: SBP <120 mmHg und HF <60/min (β-Blocker, Esmolol/Metoprolol, ggf. Urapidil) – sofortiger Transport in Zentrum mit Herzchirurgie; **kein Heparin, keine Lyse**','Zerebrale Blutung/Schlaganfall: individuelle RR-Ziele (siehe Schlaganfall)'],
 meds:['Urapidil 10–25 mg i.v.','Nitroglycerin 1–6 mg/h','Metoprolol 5 mg i.v. oder Esmolol','Fentanyl 25–50 µg'],
 cave:['Urapidil: Aortenisthmusstenose / AV-Shunts','Zu rasche Blutdrucksenkung → zerebrale/koronare Minderperfusion','Dissektion: nie ASS/Heparin, bevor Differenzialdiagnose ACS geklärt ist'],
 merke:['Hypertensive Dringlichkeit nicht zu schnell senken','Dissektion: Schmerz + Druck + Frequenz senken, nicht lysieren'],
 ll:[['ESC/ESH Leitlinie Hypertonie','https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Arterial-Hypertension-Management-of'],['ESC Guidelines Aortenerkrankungen 2024','https://www.escardio.org/Guidelines']]},

{id:'lae',cat:'Kardiovaskulär',t:'Lungenembolie',s:'Risikostratifizierung, Lyse, Antikoagulation',
 def:'Akuter Verschluss von Pulmonalarterien durch Thromben, meist aus tiefer Beinvenenthrombose. Hochrisiko-LE = Schock/Hypotonie (SBP <90 mmHg) oder Reanimation.',
 dx:['Dyspnoe, Thoraxschmerz, Synkope, Tachykardie, Hypoxie; Hinweise auf TVT','Wells-Score / revidierter Genf-Score; EKG: S1Q3T3, Rechtsherzbelastung, neuer RSB, Sinustachykardie','Echo: RV-Dilatation, Septumabflachung, D-Zeichen','D-Dimere nur bei niedriger/mittlerer Wahrscheinlichkeit sinnvoll'],
 tx:['O₂, Lagerung, venösen Zugang, Monitoring','**Heparin** 80 IE/kg Bolus (UFH) bei hoher klinischer Wahrscheinlichkeit, bevor die Diagnostik abgeschlossen ist','**Hochrisiko:** systemische Thrombolyse – Alteplase 100 mg über 2 h oder 0,6 mg/kg über 15 min (max. 50 mg); Tenecteplase gewichtsadaptiert; chirurgische oder kathetergestützte Embolektomie / ECMO bei Kontraindikation','Hypotonie: Noradrenalin, vorsichtige Volumenlast (≤500 ml) bei RV-Insuffizienz','Intubation/PPV vermeiden (RV-Versagen); wenn nötig: hämodynamisch stabile Induktion (Ketamin/Etomidat), niedrige PEEP'],
 meds:['UFH 80 IE/kg Bolus, dann 18 IE/kg/h','Alteplase 100 mg/2 h oder 0,6 mg/kg/15 min','Noradrenalin 0,05–0,5 µg/kg/min'],
 cave:['Absolute KI Lyse: Blutung, Schlaganfall <6 Monate, ZNS-Neoplasie, Trauma/OP <3 Wochen – bei Reanimation/Hochrisiko-LE relativiert','Positive-Druck-Beatmung kann RV-Versagen auslösen'],
 merke:['Hochrisiko-LE = Lyse (oder Embolektomie), nicht nur Antikoagulation','Bei Reanimation und LE-Verdacht: Lyse, CPR 60–90 min'],
 ll:[['ESC Guidelines Lungenembolie 2019 (Update ausstehend prüfen)','https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Acute-Pulmonary-Embolism-Diagnosis-and-Management-of']]},

{id:'asthmacopd',cat:'Atemwege & Atmung',t:'Asthma & COPD-Exazerbation',s:'Bronchodilatation, Steroide, NIV',
 def:'Akute Verschlechterung obstruktiver Atemwegserkrankungen. Lebensbedrohlich: stille Lunge, Zyanose, Erschöpfung, Bewusstseinsstörung, SpO₂ <92 %.',
 dx:['Atemfrequenz, SpO₂, Sprechdyspnoe, Peak-Flow (Asthma: <33 % Soll = lebensbedrohlich)','Auskultation: Giemen vs. stille Lunge; Ausschluss Pneumothorax, LE, kardiale Ursache','COPD: Sputumänderung, Infekt, Rechtsherzbelastung'],
 tx:['Sitzend, Lippenbremse, **O₂**: Asthma SpO₂ 94–98 %; **COPD Ziel 88–92 %** (S3 O₂: Hyperkapnie vermeiden)','**Salbutamol** 2,5–5 mg per Vernebler (wiederholt) oder 4–8 Hübe DA via Spacer','**Ipratropiumbromid** 0,5 mg zusätzlich (v. a. schwere Exazerbation)','**Prednisolon** 50–100 mg i.v./p.o. (COPD 40 mg für 5 Tage, NVL)','Schweres Asthma: **Magnesiumsulfat** 2 g i.v. über 20 min, Adrenalin i.m. 0,3–0,5 mg oder Terbutalin 0,25–0,5 mg s.c.; **Esketamin** zur Sedierung/Intubation','COPD-Hyperkapnie: **NIV** bei pH <7,35 und pCO₂ >45 mmHg; Antibiotika bei purulentem Sputum','Intubation/Beatmung: lange Exspirationszeit, niedrige Frequenz (6–10/min), Vermeidung von Auto-PEEP'],
 meds:['Salbutamol 2,5–5 mg inhal. / 4–8 Hübe','Ipratropium 0,5 mg inhal.','Prednisolon 50–100 mg','Magnesium 2 g über 20 min','Adrenalin 0,3–0,5 mg i.m. (Status asthmaticus)','Esketamin 0,5–1 mg/kg zur Narkose'],
 kids:['Salbutamol 2,5 mg (bei <20 kg) bzw. 2–4 Hübe DA mit Spacer','Prednisolon 1–2 mg/kg (max. 50–100 mg)','Magnesium 25–50 mg/kg (max. 2 g)'],
 cave:['β-Blocker beim Asthma absolut kontraindiziert','Sedativa bei Hyperkapnie vorsichtig','Intubation: Auto-PEEP, Pneumothorax-Risiko'],
 merke:['COPD: SpO₂-Ziel 88–92 %, Asthma: 94–98 %','Stille Lunge = Alarmzeichen'],
 ll:[['NVL Asthma','https://www.leitlinien.de/themen/asthma'],['NVL COPD','https://www.leitlinien.de/themen/copd'],['S3-Leitlinie Sauerstoff in der Akuttherapie (AWMF 020-021)','https://register.awmf.org/de/leitlinien/detail/020-021']]},

{id:'anaphylaxie',cat:'Atemwege & Atmung',t:'Anaphylaxie',s:'Adrenalin i.m. als erste Wahl (S2k 2021)',
 def:'Akute, lebensbedrohliche, systemische Überempfindlichkeitsreaktion. Schweregrade I–IV nach Ring & Messmer: I Haut, II Haut + leichte Organbeteiligung, III Schock/Bronchospasmus/Larynxödem, IV Atem-/Kreislaufstillstand.',
 dx:['Haut/Schleimhaut (Urtikaria, Flush, Angioödem) + Atemwege (Stridor, Bronchospasmus) und/oder Kreislauf (Hypotonie, Synkope) und/oder Gastrointestinal','Auslöser: Nahrungsmittel, Insektengift, Medikamente (Antibiotika, NSAR, Kontrastmittel, Muskelrelaxanzien)'],
 tx:['Auslöser stoppen, Beine hoch / stabile Seitenlage, O₂','**Adrenalin i.m. 0,3–0,5 mg (0,01 mg/kg)**, laterale Oberschenkel; ggf. nach 5–10 min wiederholen','Bei Kreislaufschock/Atemversagen: **Adrenalin i.v. titriert** (1 mg auf 10 ml = 0,1 mg/ml; 0,05–0,1 mg-Schritte)','Larynxödem/Bronchospasmus: **Adrenalin inhalativ** (3–5 mg per Vernebler) zusätzlich; Bronchodilatator','Volumen: 500–1000 ml balancierte Vollelektrolytlösung rasch (Erw.), Kinder 10–20 ml/kg','H1-Antihistaminikum i.v. (z. B. Dimetinden 0,1 mg/kg), **Glukokortikoid** (Prednisolon 250–1000 mg i.v.; verzögerter Wirkeintritt)','Bei β-Blocker-Therapie und Katecholamin-Resistenz: Glukagon 1–2 mg','Beobachtung/Transport: Überwachung (bei schweren Reaktionen bis 24 h), Serumtryptase 1–3 h nach Beginn; Notfallset + allergologische Abklärung'],
 meds:['Adrenalin i.m. 0,3–0,5 mg','Adrenalin i.v. 0,05–0,1 mg-Boli','Dimetinden 4–8 mg i.v.','Prednisolon 250–1000 mg','Glukagon 1–2 mg bei β-Blockade'],
 kids:['Adrenalin i.m. 0,01 mg/kg (Autoinjektor: 15–30 kg: 150 µg; >30 kg: 300 µg)','Prednisolon bei <15 kg nur nach Rücksprache; rektal 100 mg ab 15 kg'],
 cave:['Adrenalin nie verzögern – Steroide/Antihistaminika wirken nicht lebensrettend','Bei Kindern altersgerechtes Gewicht schätzen','Biphasische Verläufe möglich'],
 merke:['Erste Wahl bei Anaphylaxie ist Adrenalin i.m.','Inhalatives Adrenalin zusätzlich bei Larynxödem'],
 ll:[['S2k-Leitlinie Akuttherapie und Management der Anaphylaxie (AWMF 061-025)','https://register.awmf.org/de/leitlinien/detail/061-025']]},

{id:'dyspnoe',cat:'Atemwege & Atmung',t:'Akute Dyspnoe – Differenzialdiagnose',s:'Systematischer Zugang nach ABCDE',

 tx:['Sitzende Haltung, SpO₂ messen, O₂ nach Zielsättigung (92–96 %; COPD 88–92 %)','Gezielt: Bronchodilatator, Nitro/Diuretikum, Entlastung Pneumothorax, Adrenalin, etc.','NIV bei Lungenödem/COPD','Frühe Atemwegssicherung bei Erschöpfung/Bewusstseinsstörung'],

 ll:[['S3-Leitlinie Sauerstoff in der Akuttherapie (AWMF 020-021)','https://register.awmf.org/de/leitlinien/detail/020-021']]}

{id:'stroke',cat:'Neurologie',t:'Schlaganfall',s:'Prähospital: FAST, Zeitfenster, Stroke Unit, Thrombektomie',
 def:'Akutes fokales neurologisches Defizit. ~85 % ischämisch, ~15 % hämorrhagisch. „Time is brain“: Lyse bis 4,5 h, Thrombektomie bis 24 h mit Bildgebung.',
 dx:['BE-FAST: Balance, Eyes, Face, Arm, Speech, Time','**Zeitpunkt des Symptombeginns bzw. „last seen well“** dokumentieren','BZ messen (Hypoglykämie als Mimic!), RR, EKG (Vorhofflimmern)','LVO-Scores (RACE, LAMS, VAN) zur Selektion für Thrombektomiezentrum','Differenzialdiagnosen: Hypoglykämie, Krampf (Todd), Migräne, Intoxikation'],
 tx:['Stroke-Unit/ Thrombektomiezentrum mit **Voranmeldung** („Stroke-Alarm“), Zeitverlust vermeiden','Zugang kontralateral, Glukose normalisieren (BZ <60 mg/dl → G40 %)','O₂ nur bei SpO₂ <94 %','RR: nicht routinemäßig senken; Grenzen: bei Lyse <185/110 mmHg, ohne Lyse bis ≈220/120 mmHg tolerieren (Urapidil bei Überschreiten)','Normothermie, Fieber senken; keine Kopftieflage','Nüchtern lassen (Schluckstörung)','Klinik: CT/CTA, Lyse mit **Alteplase 0,9 mg/kg** (max. 90 mg, 10 % als Bolus) oder **Tenecteplase 0,25 mg/kg** (max. 25 mg) gemäß aktueller DGN-Leitlinie; mechanische Thrombektomie bei Großgefäßverschluss'],
 meds:['Urapidil 10–25 mg bei Überschreiten der RR-Grenzen','Glukose 40 % 8–16 g bei Hypoglykämie','Alteplase 0,9 mg/kg (Klinik)','Tenecteplase 0,25 mg/kg (Klinik)'],
 cave:['Kein ASS/Heparin präklinisch','Keine aggressive RR-Senkung','Kein Zeitverlust durch Zusatzdiagnostik prähospital'],
 merke:['Lysefenster 4,5 h, Thrombektomie bis 24 h bei geeigneter Bildgebung','„Last known well“ ist der Zeitpunkt, nicht die Entdeckung'],
 ll:[['S2e-Leitlinie Akuttherapie des ischämischen Schlaganfalls (AWMF 030-046)','https://register.awmf.org/de/leitlinien/detail/030-046']]},

{id:'krampf',cat:'Neurologie',t:'Krampfanfall & Status epilepticus',s:'Benzodiazepine, Levetiracetam/Valproat, Narkose',
 def:'Status epilepticus: Anfall >5 min oder ≥2 Anfälle ohne Erholung. Mortalität steigt mit der Dauer; Benzodiazepine früh und ausreichend dosieren (häufigster Fehler: Unterdosierung).',
 dx:['BZ messen, Anamnese (Epilepsie, Alkohol, Entzug, Trauma, Fieber, Schwangerschaft/Eklampsie)','Atmung/Oxygenierung sichern, Atemweg frei','Differenzialdiagnosen: Synkope, psychogene Anfälle, Hypoglykämie, Eklampsie'],
 tx:['Atemweg, O₂, BZ, Zugang, Monitoring, Schutz vor Verletzungen','**1. Stufe (S2k DGN):** Lorazepam 0,1 mg/kg i.v. (max. 4 mg/Bolus, 1× wiederholen) **oder** Midazolam i.m. 10 mg (bis 40 kg: 5 mg) **oder** Clonazepam 0,015 mg/kg (max. 1 mg)','Kein Zugang: Midazolam i.m./bukkal/nasal, Diazepam rektal','**2. Stufe (Benzodiazepin-refraktär):** Levetiracetam 60 mg/kg (max. 4500 mg) in 10 min **oder** Valproat 40 mg/kg (max. 3000 mg) in 10 min; Alternativen: Phenytoin 20 mg/kg, Lacosamid, Phenobarbital','**Refraktärer SE:** Intubationsnarkose (Midazolam / Propofol / Thiopental) auf Intensivstation','Ursache behandeln: Hypoglykämie → Glukose; Eklampsie → Magnesium; Entzug → Benzodiazepine; Trauma/ICB → Bildgebung','Transport in Klinik mit Neurologie/Intensivstation'],
 meds:['Lorazepam 0,1 mg/kg i.v. (max. 4 mg)','Midazolam i.m. 10 mg (5 mg bei <40 kg)','Clonazepam 0,015 mg/kg','Levetiracetam 60 mg/kg (max. 4500 mg)','Valproat 40 mg/kg (max. 3000 mg)'],
 kids:['Midazolam bukkal (Buccolam): 2,5 mg (3–<6 Mon.), 2,5 mg (6 Mon.–<1 J), 5 mg (1–<5 J), 7,5 mg (5–<10 J), 10 mg (10–<18 J)','Diazepam rektal: 5 mg (<15 kg), 10 mg (≥15 kg)','Levetiracetam 40–60 mg/kg'],
 cave:['Valproat: Frauen im gebärfähigen Alter vermeiden (teratogen)','Benzodiazepine: Atemdepression, Intubationsbereitschaft','Keine Phenytoin-Bolusgabe zu schnell (Hypotonie, Rhythmusstörung)'],
 merke:['Lorazepam oft unterdosiert (2 mg statt 4 mg)','Benzodiazepine zuerst – dann sofort 2. Stufe vorbereiten'],
 ll:[['S2k-Leitlinie Status epilepticus im Erwachsenenalter (AWMF 030-079)','https://register.awmf.org/de/leitlinien/detail/030-079']]},

{id:'sht',cat:'Neurologie',t:'Schädel-Hirn-Trauma',s:'GCS, Hypotonie/Hypoxie vermeiden, Einklemmung',
 def:'SHT-Schweregrade nach GCS: leicht 13–15, mittel 9–12, schwer ≤8. Sekundärschäden (Hypoxie, Hypotension, Hypo-/Hyperkapnie, Hyperthermie) sind vermeidbar.',
 dx:['GCS, Pupillen (Größe, Lichtreaktion), Seitenzeichen, Cushing-Trias (Bradykardie, Hypertonie, Atemstörung)','Begleitverletzungen suchen (HWS, Thorax, Abdomen, Becken)','Antikoagulation? Sturz bei Älteren, Alkohol?'],
 tx:['O₂, SpO₂ >95 %; Hypoxie vermeiden','Systolischer RR ≥100–110 mmHg (Erw.) / MAP ≥80; aggressive Volumentherapie/Katecholamine nach Bedarf','Intubation bei GCS ≤8, Atemwegsverlegung, Aspirationsgefahr; Normoventilation etCO₂ 35–40 mmHg','Oberkörper 30° hoch bei SHT ohne Wirbelsäulenverletzung, Kopf in Neutralstellung','Einklemmung (Anisokorie, Streckkrämpfe): kurzzeitig Hyperventilation etCO₂ 30–35 mmHg, Mannit 0,5–1 g/kg oder hypertone NaCl-Lösung, Neurochirurgie anmelden','**Tranexamsäure** 1 g i.v. innerhalb 3 h bei Blutungen/Polytrauma-SHT (CRASH-3)','Analgesie/Sedierung; Krampf behandeln','Zielklinik mit Neurochirurgie/CT'],
 meds:['Tranexamsäure 1 g über 10 min','Hypertone NaCl-Lösung 7,5 % 2 ml/kg oder Mannit 0,5–1 g/kg (bei Einklemmung)','Esketamin/Fentanyl/Midazolam zur Narkose'],
 cave:['Einzelne Hypotension (<90 mmHg) verdoppelt Mortalität','Hyperventilation nur bei akuter Einklemmung','Bei Kindern: Hypotonie früher beachten, Dosen nach Gewicht'],
 merke:['Keine Hypoxie und keine Hypotension','Hirndruck: Kopfposition, Normoventilation, hyperosmolare Therapie'],
 ll:[['S2e-Leitlinie Schädel-Hirn-Trauma im Erwachsenenalter (AWMF 008-001)','https://register.awmf.org/de/leitlinien/detail/008-001']]},

{id:'bewusstlos',cat:'Neurologie',t:'Bewusstseinsstörung & Synkope',s:'AEIOU-TIPS, Differenzialdiagnosen',
 def:'Quantitative Bewusstseinsstörung (Somnolenz, Sopor, Koma) vs. kurze, selbstlimitierte Synkope. Immer ABCDE und BZ.',
 dx:['AEIOU-TIPS: Alkohol, Epilepsie/Endokrin, Insulin, Opiate/Overdose, Urämie, Trauma/Temperatur, Infektion/Intoxikation, Psychiatrisch, Schlaganfall/Sepsis/Schock/Subarachnoidalblutung','Synkope: orthostatisch, kardial (Rhythmus, AS, LE), reflektorisch; rote Flaggen: Belastung, Palpitationen, Familienanamnese plötzlicher Tod, pathologisches EKG','GCS, Pupillen, BZ, Temperatur, EKG, SpO₂, Auskultation, Zeichen eines Traumas'],
 tx:['ABCDE, stabile Seitenlage, O₂','BZ: Hypoglykämie → Glukose 8–16 g i.v.','Opiat-Intoxikation → Naloxon fraktioniert; Benzodiazepin-Intox → nur selten Flumazenil','Krampf, Schlaganfall, ACS, Rhythmus, Sepsis gezielt behandeln','Atemwegssicherung bei GCS ≤8 oder fehlenden Schutzreflexen'],
 cave:['Zu rasches Anheben des BZ bei chron. Alkoholikern: Thiamin parallel','Flumazenil nicht bei Mischintoxikation / Epilepsie / TCA'],
 merke:['Immer BZ messen','Synkope mit kardialen roten Flaggen: Monitoring und Klinik'],
 ll:[['ESC Guidelines Synkope 2018','https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Syncope-Guidelines-on-Diagnosis-and-Management-of']]},

{id:'polytrauma',cat:'Trauma',t:'Polytrauma & Schockraum',s:'xABCDE, Blutstillung, TXA, Traumanetzwerk',
 def:'Schwerverletzte werden nach dem xABCDE-Schema versorgt: **x** = kritische äußere Blutung. S3-Leitlinie Polytrauma/Schwerverletzten-Behandlung (DGU, Version 4.0/2022; Update 5.0 im AWMF-Register prüfen).',
 dx:['Trauma-Mechanismus, Schockraumkriterien (SBP <90, GCS <9, Atemstörung, instabiler Thorax, Beckeninstabilität, penetrierende Verletzung, Amputation proximal)','Körperliche Untersuchung nach xABCDE, Schockindex (HF/SBP >0,9 verdächtig)','Eingeschränkte Hinweise bei älteren Patienten und Antikoagulation'],
 tx:['**x:** Kritische Blutung sofort stillen – Druckverband, Tourniquet (Extremität), Wundpacking, Beckengurt','**A:** Atemweg frei, HWS in Neutralstellung; bei Bedarf Notfallnarkose / SGA / Koniotomie','**B:** O₂, Thorax untersuchen, Spannungspneu entlasten (Minithorakotomie), 3-Seiten-Okklusivverband','**C:** 2 großlumige Zugänge / i.o.; permissive Hypotonie (SBP 80–90 mmHg, MAP ~50–60, **nicht bei SHT**), balancierte Vollelektrolytlösung restriktiv, Blutprodukte (wenn verfügbar); Wärmeerhalt','**Tranexamsäure** 1 g i.v. über 10 min (innerhalb 3 h)','**D:** GCS, Pupillen, BZ; **E:** Entkleiden, Wärmeerhalt','Analgesie (Esketamin/Fentanyl), Immobilisation (Vakuummatratze, Schaufeltrage), Beckenschlinge','Zeitmanagement: **Stay-and-Play vs. Load-and-Go** – Plateau am Unfallort möglichst ≤10 min','Zielklinik: Traumazentrum (regional/überregional) mit Voranmeldung; Schockraum: Teamleader, Ganzkörper-CT (Trauma-Spirale), Gerinnungsmanagement (Fibrinogen, Calcium, PPSB, Massivtransfusion)'],
 meds:['Tranexamsäure 1 g','Esketamin 0,125–0,25 mg/kg analgetisch','Fentanyl 25–50 µg-Schritte','Fibrinogen 2–4 g, Calcium 1–2 g (Klinik)'],
 cave:['Kein Volumen bis zur Normotonie bei unkontrollierter Blutung','Hypothermie, Azidose, Koagulopathie = „tödliche Trias“','SHT: höhere RR-Ziele'],
 merke:['Erst Blutungskontrolle, dann Volumen','Wärmeerhalt von Anfang an'],
 ll:[['S3-Leitlinie Polytrauma/Schwerverletzten-Behandlung (AWMF 187-023)','https://register.awmf.org/de/leitlinien/detail/187-023'],['TraumaNetzwerk DGU','https://www.dgu-traumanetzwerk.de']]},

{id:'thorax',cat:'Trauma',t:'Thoraxtrauma & Spannungspneumothorax',s:'Entlastung, Hämatothorax, Rippenserienfraktur',
 def:'Thoraxtrauma ist an 25 % der Traumatodesfälle beteiligt. Lebensbedrohlich sind Spannungspneumothorax, offener Pneumothorax, Hämatothorax, Herzbeuteltamponade, instabiler Thorax.',
 dx:['Klinik Spannungspneu: Dyspnoe, einseitig aufgehobenes Atemgeräusch, Halsvenenstauung, Schock, Trachealverlagerung (spät)','Perkussion hypersonor (Pneu) / gedämpft (Hämatothorax); Ultraschall (E-FAST): fehlendes Gleiten'],
 tx:['O₂, Lagerung (Oberkörper hoch bei Stabilität)','Spannungspneu: sofortige **Entlastung** – Minithorakotomie 4./5. ICR zwischen vorderer und mittlerer Axillarlinie (bei Beatmung); Nadeldekompression nur, wenn nicht anders möglich (Fehlerquote hoch)','Offener Pneumothorax: Okklusivverband mit Ventil (3-Seiten)','Hämatothorax: Thoraxdrainage (Klinik), Blutersatz','Rippenserienfraktur: Analgesie (Regionalanästhesie), NIV/CPAP, ggf. Intubation bei Respirationsversagen'],
 cave:['Thoraxdrainage-Neuanlage in Prähospitalphase nur durch Geübte','Beim Beatmeten steigt der Spannungspneu-Risiko stark'],
 merke:['Spannungspneu ist eine klinische Diagnose – nicht auf Röntgen warten','Entlastung 4./5. ICR zwischen vorderer und mittlerer Axillarlinie'],
 ll:[['S3-Leitlinie Polytrauma (AWMF 187-023)','https://register.awmf.org/de/leitlinien/detail/187-023']]},

{id:'verbrennung',cat:'Trauma',t:'Verbrennungen & Inhalationstrauma',s:'Kühlung, Flüssigkeit, Zentrumskriterien, CO/Zyanid',
 def:'Verbrennungen werden nach Tiefe (Grad 1–3) und Ausdehnung (% VKOF, Neunerregel; Handfläche inkl. Finger ≈1 %) beurteilt. Hochrisiko: Inhalationstrauma, Hände/Gesicht/Genitale, Kinder, Strom, chemisch.',
 dx:['Neunerregel Erw.: Kopf 9 %, Arme je 9 %, Rumpf vorne 18 % / hinten 18 %, Beine je 18 %, Genitale 1 %; Kinder: Kopf proportional größer','Inhalationstrauma: Ruß im Mund, Heiserkeit, Stridor, versengte Nasenhaare, Verbrennungen im Gesicht'],
 tx:['Brandquelle entfernen, Kleidung entfernen (nicht verklebte), **Kühlung** 10–20 min mit 15–20 °C Wasser nur bei kleinen Flächen (Erwachsene <10–15 % VKOF, Kinder <5–10 %) – Hypothermie vermeiden','Analgesie (Esketamin/Fentanyl), steriler/ trockener Verband oder Brandwundenverbandsmaterial; keine Salben','Flüssigkeit: balancierte Vollelektrolytlösung; präklinisch moderat (z. B. 500 ml/h beim Erwachsenen, lokale SOP), klinisch Parkland (4 ml/kg/%VKOF in 24 h, halbe Menge in 8 h)','**Inhalationstrauma:** frühe Intubation bei Stridor, Heiserkeit, ausgedehntem Gesichtsbrand; 100 % O₂','**CO-Intoxikation:** 100 % O₂; SpO₂ unzuverlässig → CO-Oxymetrie','**Zyanid** (Brandrauch, Bewusstseinsstörung, Laktat ↑): Hydroxocobalamin 5 g (70 mg/kg) über 15 min','Zentrum: Verbrennungszentrum bei ≥20 % VKOF (Erw.), ≥10 % (Kinder), 3° Verbrennung, Gesicht/Hände/Genital, Inhalationstrauma, Strom/chemisch'],
 meds:['Esketamin 0,125–0,25 mg/kg','Fentanyl 25–50 µg-Schritte','Hydroxocobalamin 5 g über 15 min','Kristalloid (Ringer-Acetat/-Laktat)'],
 cave:['Ausgedehnte Kühlung führt zur Hypothermie','Succinylcholin nach 24–48 h nach Verbrennung kontraindiziert (Hyperkaliämie)'],
 merke:['Kühlen: kleine Flächen, kurz','Inhalationstrauma → früh Atemweg sichern, bevor Ödem zunimmt'],
 ll:[['S2k-Leitlinie Behandlung thermischer Verletzungen (AWMF 044-001)','https://register.awmf.org/de/leitlinien/detail/044-001']]},

{id:'sepsis',cat:'Internistische Notfälle',t:'Sepsis & septischer Schock',s:'qSOFA, Volumen, Noradrenalin, Antibiose < 1 h',
 def:'Sepsis (Sepsis-3): lebensbedrohliche Organdysfunktion durch dysregulierte Wirtsantwort auf Infektion (SOFA ≥2). Septischer Schock: Vasopressorbedarf für MAP ≥65 mmHg und Laktat >2 mmol/l trotz Volumen.',
 dx:['qSOFA: AF ≥22/min, SBP ≤100 mmHg, Bewusstseinsstörung (GCS <15) – ≥2 Punkte = Hochrisiko','Fokus suchen (Pneumonie, Harnwege, Abdomen, Haut/Weichteil, Meningitis); Laktat, Temperatur, Petechien (Meningokokken)'],
 tx:['O₂, Zugang, Monitoring, Voranmeldung „Sepsis“','**Volumen**: 30 ml/kg balancierte Vollelektrolytlösung bei Hypotonie/Laktat >4','**Noradrenalin** bei Hypotonie trotz Volumen, Ziel MAP ≥65 mmHg','Blutkulturen vor Antibiose (ohne Zeitverlust), **Antibiotikum innerhalb 1 h** bei Schock/hoher Wahrscheinlichkeit','Meningokokken-Verdacht (Purpura): Ceftriaxon 2 g i.v. präklinisch erwägen; Dexamethason 10 mg vor/mit erster Antibiose in der Klinik','Fokussanierung früh (Klinik)'],
 meds:['Balancierte Kristalloide 30 ml/kg','Noradrenalin 0,05–0,5 µg/kg/min','Ceftriaxon 2 g (Erw.) / 100 mg/kg (Kinder)'],
 kids:['Kinder: Bolus 10–20 ml/kg, Reevaluation; Hypoglykämie ausschließen; früh Adrenalin bei Kaltschock'],
 cave:['Überinfusion bei kardiogener Genese','Steroide bei septischem Schock nur bei persistierendem Vasopressorbedarf (Hydrocortison 200 mg/d, Klinik)'],
 merke:['Sepsis ist ein Notfall wie ein Infarkt: Zeit zur Antibiose zählt','qSOFA ≥2 = Hochrisiko'],
 ll:[['S3-Leitlinie Sepsis – Prävention, Diagnose, Therapie und Nachsorge (AWMF 079-001)','https://register.awmf.org/de/leitlinien/detail/079-001'],['Surviving Sepsis Campaign','https://www.sccm.org/survivingsepsiscampaign/guidelines-and-resources']]},

{id:'diabetes',cat:'Internistische Notfälle',t:'Hypoglykämie & hyperglykämische Entgleisung',s:'Glukose, Glukagon, DKA/HHS',
 def:'Hypoglykämie: BZ <50–70 mg/dl mit Symptomen; bei Bewusstseinsstörung immer BZ messen. Hyperglykämische Krise: DKA (Azidose, Ketose) und HHS (Hyperosmolarität).',
 dx:['Hypoglykämie: Schwitzen, Tachykardie, Verwirrtheit, Krampf, Koma','DKA: Kussmaul-Atmung, Azeton-Geruch, Dehydratation, Bauchschmerz, BZ meist >250 mg/dl','HHS: ältere Typ-2-Diabetiker, BZ >600 mg/dl, ausgeprägte Exsikkose'],
 tx:['**Hypoglykämie:** bewusstseinsklar → 15–20 g Glukose oral; Bewusstlosigkeit → Glukose 40 % 8–16 g i.v. (z. B. 20–40 ml G40 % langsam, Kinder 2 ml/kg G10 %), alternativ Glukagon 1 mg i.m./s.c. (nasal 3 mg)','Sulfonylharnstoff-Hypoglykämie: lange Wirkdauer, Überwachung/Klinik','**DKA/HHS:** Volumen 1 l NaCl 0,9 %/balancierte Lösung in der 1. Stunde, Insulin erst in der Klinik (K⁺ ≥3,3 mmol/l), Elektrolyte, Ursache (Infekt, ACS)','Bei Alkoholikern: Thiamin 100 mg vor/mit Glukose'],
 meds:['Glukose 40 %: 8–16 g i.v.','Glukagon 1 mg i.m./s.c.','NaCl 0,9 % / balancierte Lösung 1 l'],
 kids:['Glukose 10 %: 2 ml/kg i.v.; Neugeborene 2,5 ml/kg G10 %'],
 cave:['Glukagon wirkt nicht bei leeren Glykogenspeichern (Alkohol, Mangelernährung)','Insulin präklinisch bei DKA nicht beginnen'],
 merke:['BZ bei jeder Bewusstseinsstörung','Hypoglykämie imitiert Schlaganfall, Krampf, Intoxikation'],
 ll:[['NVL Typ-2-Diabetes','https://www.leitlinien.de/themen/diabetes']]},

{id:'tox',cat:'Toxikologie',t:'Intoxikationen – Antidot-Übersicht',s:'Opioide, Benzodiazepine, CO, Zyanid, Alkylphosphate, TCA …',
 def:'Bei Verdacht auf Intoxikation: ABCDE, Eigenschutz, Substanz/Menge/Zeitpunkt klären, **Giftinformationszentrum** kontaktieren (Notrufnummer: Vorwahl + 19240; z. B. Bonn 0228 19240, Göttingen 0551 19240).',
 dx:['Toxidrome: cholinerg (Miosis, Bradykardie, Hypersalivation), anticholinerg (Mydriasis, trockene Haut, Tachykardie, Delir), sympathomimetisch (Hyperthermie, Hypertonie), Opioid (Miosis, Atemdepression), sedativ-hypnotisch','EKG (QRS, QTc), BZ, Temperatur, Urinstix'],
 tx:['**Opioide** → Naloxon 0,04–0,4 mg i.v. fraktioniert (Kurze HWZ, Rebound)','**Benzodiazepine** → Flumazenil 0,2 mg i.v. (nur gezielt)','**Paracetamol** → Acetylcystein 150 mg/kg in 1 h','**Kohlenmonoxid** → 100 % O₂; **Zyanid** → Hydroxocobalamin 5 g','**Alkylphosphate** → Atropin 2–5 mg wiederholt bis Bronchorrhoe sistiert, Obidoxim','**Anticholinerg** → Physostigmin 2 mg langsam (Bradykardie beachten)','**TCA** → Natriumbikarbonat 1–2 mmol/kg bei QRS >100 ms; **β-Blocker** → Glukagon 5–10 mg, Calcium, Adrenalin; **Ca-Antagonisten** → Calcium, Insulin-Hochdosis','**Digitalis** → Digitalis-Antitoxin; **Methämoglobin** → Methylenblau 1–2 mg/kg','**Methanol/Ethylenglykol** → Fomepizol (alternativ Ethanol)','**Antikoagulanzien:** Dabigatran → Idarucizumab 5 g; Xa-Hemmer → Andexanet / PPSB; Heparin → Protamin; VKA → Vitamin K + PPSB','Aktivkohle 1 g/kg nur bei erhaltenem Schutzreflex und innerhalb ~1 h, nie bei Säuren/Laugen, Alkoholen, Kohlenwasserstoffen'],
 cave:['Kein induziertes Erbrechen','Flumazenil: Krampf bei Mischintoxikation mit TCA','Naloxon: Entzugssyndrom, Lungenödem'],
 merke:['Giftinformationszentrum früh anrufen','Antidot nicht vor Symptomatik bei unklarer Substanz'],
 ll:[['Giftinformationszentren – Übersicht (BfR)','https://www.bfr.bund.de/de/giftnotrufnummern_und_giftinformationszentren-198403.html']]},

{id:'hypotherm',cat:'Umwelt & Thermisch',t:'Unterkühlung & Lawinenunfall',s:'Swiss Staging, Bergung, Wiedererwärmung, ECLS',
 def:'Hypothermie = Körperkerntemperatur <35 °C. Swiss Staging: HT I (32–35 °C, wach, Kältezittern), HT II (28–32 °C, Bewusstseinsstörung, kein Zittern), HT III (24–28 °C, bewusstlos, Vitalzeichen vorhanden), HT IV (<24 °C, scheinbar tot/Kreislaufstillstand).',
 dx:['Kerntemperatur (tympanal oder ösophageal), EKG: Osborn-Welle, Bradykardie, VF','Lawine: Verschüttungsdauer, Atemhöhle, Schneetiefe, Vitalzeichen'],
 tx:['**Horizontal und schonend** bergen (Bergungstod/Afterdrop), Kälteexposition beenden, isolieren (Hypothermiepack)','HT I: aktiv bewegen, warme Getränke, trockene Kleidung','HT II/III: Transport in Klinik, warme Infusionen (38–42 °C), Heizpads am Rumpf, kein Reiben','HT III/IV: ECLS-fähige Klinik direkt anfahren','Reanimation bei HT IV: CPR bis zur Wiedererwärmung; bei <30 °C maximal 3 Schocks, Adrenalin erst >30 °C; K⁺ >12 mmol/l bei Lawinenverschütteten als Abbruchkriterium','ERC 2025: Herzfrequenz <45/min als neues Hochrisikokriterium für hypothermie-induzierten Kreislaufstillstand (HOPE-Score berücksichtigen)'],
 cave:['Aggressive Mobilisation löst VF aus','„Nobody is dead until warm and dead“ (Ausnahmen beachten)'],
 merke:['Horizontal, schonend, isolieren','HT IV → ECLS-Zentrum'],
 ll:[['ERC Guidelines 2025 – Special Circumstances','https://www.cprguidelines.eu']]},

{id:'hitze',cat:'Umwelt & Thermisch',t:'Hitzeschäden (Hitzschlag)',s:'Kühlung, Volumen, Abgrenzung',
 def:'Hitzeerschöpfung (Kerntemp. <40 °C, Volumenmangel) vs. **Hitzschlag** (Kerntemp. >40 °C + ZNS-Störung, lebensbedrohlich).',
 dx:['Kerntemperatur messen; ZNS-Symptome (Verwirrung, Krampf, Koma)','Differenzialdiagnosen: Sepsis, Intoxikation (Amphetamine), malignes Neuroleptika-Syndrom, maligne Hyperthermie'],
 tx:['**Aktive Kühlung**: kaltes Wasser (Immersion, besprühen + Ventilator), Eispacks an Hals/Axilla/Leiste','Volumen: kühle balancierte Infusion (500–1000 ml), keine Antipyretika','Benzodiazepine bei Krampf/Schüttelfrost, Intubation bei GCS ≤8','Zielkerntemperatur <39 °C, dann Kühlung beenden (Rebound/Hypothermie vermeiden)'],
 cave:['Antipyretika (Paracetamol, NSAR) sind unwirksam','Rhabdomyolyse, Nierenversagen, DIC beachten'],
 merke:['Hitzschlag = Kühlen, Kühlen, Kühlen – Transport parallel'],
 ll:[['ERC Guidelines 2025 – Special Circumstances','https://www.cprguidelines.eu']]},

{id:'manv',cat:'Organisation',t:'MANV, Sichtung & Einsatzstellenorganisation',s:'LNA/OrgL, mSTaRT, Sichtungskategorien, Gefahrenlagen',
