<style>
:root{
  --bg:#F3F1EF; --surface:#FFFFFF; --surface2:#F7F5F3; --ink:#1E1715; --muted:#6B5E59; --line:#E0D9D5;
  --accent:#B3261E; --accent-soft:#FBE4E1; --accent-ink:#FFFFFF;
  --ok:#2C7A3F; --ok-soft:#E1F2E5; --warn:#A8620A; --warn-soft:#FBEFD9; --info:#1F5F8B; --info-soft:#E1EEF7;
  --shadow:0 1px 2px rgba(30,23,21,.06),0 4px 14px rgba(30,23,21,.05);
  --f-display:"Barlow Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tabh:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141010; --surface:#1E1817; --surface2:#261F1E; --ink:#F0E9E6; --muted:#A99C97; --line:#35292A;
    --accent:#FF6F66; --accent-soft:#3A1B19; --accent-ink:#2A0907;
    --ok:#79D08E; --ok-soft:#15301D; --warn:#F2B35A; --warn-soft:#352813; --info:#7DBDEB; --info-soft:#14293A;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#141010; --surface:#1E1817; --surface2:#261F1E; --ink:#F0E9E6; --muted:#A99C97; --line:#35292A;
  --accent:#FF6F66; --accent-soft:#3A1B19; --accent-ink:#2A0907;
  --ok:#79D08E; --ok-soft:#15301D; --warn:#F2B35A; --warn-soft:#352813; --info:#7DBDEB; --info-soft:#14293A;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:var(--toph,110px);overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input,select{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:900px;margin:0 auto;padding-inline:14px}

/* Header */
.top{position:fixed;left:0;right:0;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;background:none;border:0;padding:0}
.brand svg{width:28px;height:28px}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.brand b span{color:var(--accent)}
.search{flex:1 1 auto;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px 8px 34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.iconbtn{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
@media (max-width:640px){
  .top .wrap{flex-wrap:wrap;row-gap:8px}
  .brand{flex:1 1 0;min-width:0}
  .brand b{font-size:1.1rem;white-space:nowrap}
  .search{order:3;flex-basis:100%}
}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:2px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 8px;color:var(--muted);font-size:11px;font-weight:600;min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--accent)}
main{padding-block:14px calc(var(--tabh) + 34px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .tabs{position:sticky;top:var(--toph,57px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);background:var(--bg)}
  .tabs .wrap{display:flex;gap:4px;padding-inline:14px}
  .tab{flex-direction:row;gap:8px;font-size:15px;padding:10px 14px;border-bottom:2px solid transparent}
  .tab svg{width:20px;height:20px}
  .tab[aria-current="true"]{border-bottom-color:currentColor}
}

/* Generic */
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;color:var(--muted);font-weight:600}
.h1{font-size:1.9rem}
.lead{color:var(--muted);margin:.3rem 0 0;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.back{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.disclaimer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item b{font-size:17px}
.item .sub{grid-column:1/-1;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .chev{color:var(--muted)}
.grp-h{font-family:var(--f-display);font-size:1.05rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 2px 6px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

/* Detail boxes */
.box{border-radius:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line)}
.box h3{font-size:1.15rem;margin-bottom:6px}
.box.def{border-left:4px solid var(--accent)}
.box.def h3{color:var(--accent)}
.box.merke{background:var(--ok-soft);border-color:transparent;border-left:4px solid var(--ok)}
.box.merke h3{color:var(--ok)}
.box.cave{background:var(--accent-soft);border-color:transparent;border-left:4px solid var(--accent)}
.box.cave h3{color:var(--accent)}
.box.kids{background:var(--warn-soft);border-color:transparent;border-left:4px solid var(--warn)}
.box.kids h3{color:var(--warn)}
ul.clean{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:5px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.fx{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.fx div{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15.5px}
.fx b{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--muted)}
.srclist{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.srclist a{color:var(--accent);overflow-wrap:anywhere}
h1,h2,h3,b{overflow-wrap:anywhere}

/* Learn */
.flash{min-height:270px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.flash .q{font-family:var(--f-display);font-size:1.55rem;font-weight:600;line-height:1.2}
.flash .a{border-top:1px dashed var(--line);padding-top:14px;font-size:17px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate button{border-radius:10px;padding:10px 4px;font-weight:700;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;font-size:15px}
.rate button small{font-weight:400;color:var(--muted);font-size:12px}
.rate .r0{color:var(--accent)}.rate .r1{color:var(--warn)}.rate .r2{color:var(--ok)}.rate .r3{color:var(--info)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--f-display);font-size:1.25rem}
.mode span{font-size:13.5px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .bar{grid-column:1/-1}

/* Tools */
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1 1 auto;border:0;background:none;padding:8px 10px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%;font-family:var(--f-mono);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.timer{font-family:var(--f-mono);font-size:2.4rem;font-weight:600;line-height:1}
.cpr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cpr .big,.cpr1 .big{padding:14px 8px;font-size:17px;font-weight:700;border-radius:12px}
.log{font-family:var(--f-mono);font-size:13.5px;max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.alert{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 12px;font-weight:700;text-align:center}
.hl{background:color-mix(in srgb,var(--warn) 30%,transparent);border-radius:2px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ===== Design: Deutscher Rettungsdienst (Signalfarben, Star of Life, Warnmarkierung) ===== */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#10151C; --muted:#5B6674; --line:#DDE3EA;
  --accent:#D4231C; --accent-soft:#FDE6E4; --accent-ink:#FFFFFF;
  --sig:#F7D600; --blue:#0B5FA5; --blue-soft:#E2EEF9;
  --shadow:0 1px 2px rgba(16,21,28,.06),0 8px 24px rgba(16,21,28,.06);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1118; --surface:#131B25; --surface2:#1A2430; --ink:#EDF2F7; --muted:#9AA8B8; --line:#243140;
  --accent:#FF5A4F; --accent-soft:#3A1A1A; --accent-ink:#2A0907; --sig:#FFD92E; --blue:#5AAEF0; --blue-soft:#12283D;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#0B1118; --surface:#131B25; --surface2:#1A2430; --ink:#EDF2F7; --muted:#9AA8B8; --line:#243140;
  --accent:#FF5A4F; --accent-soft:#3A1A1A; --accent-ink:#2A0907; --sig:#FFD92E; --blue:#5AAEF0; --blue-soft:#12283D;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);}
body{letter-spacing:-.005em}
.top{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);box-shadow:none}
.batten{height:7px;background:conic-gradient(var(--accent) 25%,var(--sig) 0 50%,var(--accent) 0 75%,var(--sig) 0) 0 0/14px 14px}
.brand b{font-size:1.35rem;letter-spacing:.03em}
.brand b span{color:var(--accent)}
.search input,.iconbtn{border-radius:12px;min-height:40px}
.card,.list,.box,.tbl,.stat,.mode{border-radius:var(--r)}
.card{box-shadow:var(--shadow);border:1px solid var(--line)}
.list{box-shadow:var(--shadow)}
.item{padding:14px 16px;min-height:56px}
.item b{font-weight:600}
.btn{min-height:46px;border-radius:12px;padding:10px 16px}
.btn.primary{background:var(--accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.chip{padding:7px 14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tab{position:relative;padding:9px 0 8px}
.tab[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab[aria-current="true"]{color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px;flex:0 0 auto}
.grp-h{display:flex;align-items:center}
.btn.go{background:#2E9E4F;border-color:#2E9E4F;color:#fff}
.btn.stop{background:#D4231C;border-color:#D4231C;color:#fff}
.tst{margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em}
.tst.on{background:#2E9E4F;color:#fff}
.tst.off{background:var(--line);color:var(--muted)}
.grp-link{background:none;border:0;width:100%;text-align:left;cursor:pointer;gap:6px}
.grpbox{display:grid;gap:10px}
.grpbox th,.grpbox td{padding:8px 10px;text-align:left;vertical-align:top;font-size:14px;border-bottom:1px solid var(--line)}
.grpbox thead th{white-space:nowrap;background:var(--surface)}
.grpbox tbody th{white-space:nowrap}
.ul{margin:0;padding-left:20px;display:grid;gap:4px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 20px 18px;color:#fff;background:linear-gradient(135deg,#B3160F 0%,#D4231C 55%,#E8502A 100%);box-shadow:0 12px 30px color-mix(in srgb,#D4231C 35%,transparent)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;opacity:.16;background:
 conic-gradient(from 0deg,#fff 0 8%,transparent 0 17%,#fff 0 25%,transparent 0 33%,#fff 0 42%,transparent 0 50%,#fff 0 58%,transparent 0 67%,#fff 0 75%,transparent 0 83%,#fff 0 92%,transparent 0);border-radius:50%}
.hero .eyebrow{color:rgba(255,255,255,.8)}

.hero .cd{display:inline-flex;align-items:baseline;gap:8px;margin-top:12px;background:rgba(0,0,0,.22);border-radius:12px;padding:8px 14px;font-weight:600}
.hero .cd b{font-family:var(--f-display);font-size:1.9rem;color:var(--sig)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.qt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 14px 14px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-height:76px}
.qt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--accent))}

.box.def{border-left-color:var(--blue)}

.pill{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.flash{border-radius:20px;box-shadow:var(--shadow)}
.rate button{min-height:60px;border-radius:14px}

.stat:first-child b{color:var(--accent)}
.alert{background:var(--accent)}
.timer{letter-spacing:-.02em}
.seg{border-radius:12px}
.seg button[aria-selected="true"]{background:var(--blue);color:#fff}
th{background:var(--blue-soft);color:var(--blue)}
.bar i{background:linear-gradient(90deg,var(--accent),#E8502A)}
@media (max-width:640px){.hero h1{font-size:1.7rem}}

/* Spritzen-Aufkleber ISO 26825 */
.syr{--lab:#fff;position:relative;display:inline-flex;align-items:center;background:var(--lab);font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:2px 9px;font-size:.92rem;line-height:1.25;border:1px solid rgba(0,0,0,.22);white-space:nowrap;overflow:hidden}
.syr.stripe{padding-inline:20px}
.syr.stripe::before,.syr.stripe::after{content:"";position:absolute;top:0;bottom:0;width:13px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.95) 0 3px,transparent 3px 7px)}
.syr.stripe::before{left:0}.syr.stripe::after{right:0}
.syr.big{font-size:1.7rem;padding:6px 16px;border-radius:6px;white-space:normal}
.syr.big.stripe{padding-inline:34px}
.syr.big.stripe::before,.syr.big.stripe::after{width:22px}
.labbox{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.item .chev.lab{display:flex;gap:4px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--lab);border:1px solid rgba(128,128,128,.5);margin-right:7px;vertical-align:-2px}
.sw.sws{background:repeating-linear-gradient(-45deg,var(--lab) 0 3px,#fff 3px 5px)}
.chip[aria-pressed="true"] .sw{border-color:#fff}

.ecg{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;width:100%;font-weight:600;min-height:50px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{opacity:1;color:var(--ink)}

/* ===== Liquid Glass + iPhone 14 Pro ===== */
:root{
 --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.74);--glass-brd:rgba(255,255,255,.8);
 --gshadow:0 10px 30px rgba(20,30,60,.10),0 1px 2px rgba(20,30,60,.06);
 --gspec:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.3);
 --b1:rgba(212,35,28,.20);--b2:rgba(11,95,165,.22);--b3:rgba(247,214,0,.24);
}

 --glass:rgba(32,44,62,.46);--glass-strong:rgba(26,36,52,.7);--glass-brd:rgba(255,255,255,.14);
 --gshadow:0 12px 34px rgba(0,0,0,.45);--gspec:inset 0 1px 0 rgba(255,255,255,.2);
 --b1:rgba(255,90,79,.20);--b2:rgba(90,174,240,.18);--b3:rgba(255,217,46,.10);}}

 --b1:rgba(255,90,79,.20);--b2:rgba(90,174,240,.18);--b3:rgba(255,217,46,.10);}
html{-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(60% 38% at 8% 2%,var(--b1),transparent 70%),
 radial-gradient(55% 40% at 100% 28%,var(--b2),transparent 70%),
 radial-gradient(65% 42% at 20% 100%,var(--b3),transparent 70%),var(--bg)}
.wrap{padding-inline:max(14px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-right))}
button,.tab,.chip,.item,.opt{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card,.list,.box,.stat,.mode,.qt,.tbl,.opt,.flash,.btn:not(.primary):not(.ok),.chip,.search input,.iconbtn,.seg{
 background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
 border:1px solid var(--glass-brd);box-shadow:var(--gshadow),var(--gspec)}
.btn:not(.primary):not(.ok),.chip,.search input,.iconbtn{box-shadow:0 4px 14px rgba(20,30,60,.08),var(--gspec)}
.card,.list,.box,.stat,.mode,.qt,.tbl{border-radius:22px}
.flash{border-radius:28px}
.item{border-bottom:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.box.def{border-left:4px solid var(--blue)}
.box.merke{background:color-mix(in srgb,var(--ok) 15%,var(--glass));border-left:4px solid var(--ok)}
.box.cave{background:color-mix(in srgb,var(--accent) 13%,var(--glass));border-left:4px solid var(--accent)}
.box.kids{background:color-mix(in srgb,var(--warn) 16%,var(--glass));border-left:4px solid var(--warn)}
.fx div{background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:14px}
.opt.right{background:color-mix(in srgb,var(--ok) 22%,var(--glass))}
.opt.wrong{background:color-mix(in srgb,var(--accent) 20%,var(--glass))}
.btn.primary{background:linear-gradient(180deg,#EC4A39,#C81E17);border:1px solid rgba(255,255,255,.35);box-shadow:0 8px 20px color-mix(in srgb,#D4231C 38%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}

{id:'als',cat:'Reanimation',t:'Erwachsenen-ALS (ERC 2025)',s:'Algorithmus, Defibrillation, Medikamente, Abbruch',

 dx:['Ansprechen, Atemwege öffnen, höchstens 10 s Atmung prüfen (sehen, hören, fühlen)','Notruf / Reanimationsteam, Defibrillator holen','Rhythmusanalyse: **schockbar** (VF / pulslose VT) vs. **nicht schockbar** (Asystolie / PEA)'],
 tx:['**Kompressionen:** Mitte Brustkorb, 5–6 cm tief, 100–120/min, volle Entlastung, 30:2 bis zum gesicherten Atemweg, danach durchgehend + ca. 10 Beatmungen/min','**Schockbar:** 1 Schock → sofort 2 min CPR → Rhythmuscheck','**Nach 3. Schock:** Adrenalin 1 mg + Amiodaron 300 mg (nach 5. Schock Amiodaron 150 mg); Adrenalin danach alle 3–5 min (jeder 2. Zyklus). Alternative zu Amiodaron: Lidocain 1–1,5 mg/kg','**Nicht schockbar:** Adrenalin 1 mg so früh wie möglich, dann alle 3–5 min','**Refraktäres VF:** Pad-Position ändern (anterior-posterior), reversible Ursachen suchen, ggf. ECPR (zentrumsabhängig)','**Atemweg:** Beutel-Maske / supraglottischer Atemweg; Intubation nur durch sehr erfahrene Anwender ohne längere Kompressionspause; Kapnographie zur Lagekontrolle','**Ultraschall** (Tamponade, Pneumothorax, RV-Dilatation) nur ohne Verlängerung der Kompressionspausen','**4H/4T** systematisch abarbeiten (siehe Thema „Spezielle Reanimationssituationen“)'],

 dx:['**4H:** Hypoxie, Hypovolämie, Hyper-/Hypokaliämie (metabolisch), Hypo-/Hyperthermie','**4T:** Thrombose (Koronar/Lunge), Tamponade, Toxine, Tension-Pneumothorax'],
 tx:['**Hyperkaliämie:** Calciumchlorid 10 % 10 ml (oder Ca-Glukonat 10 % 30 ml) i.v.; Glukose 25 g + Insulin 10 IE; ggf. Natriumbikarbonat bei Azidose; Salbutamol inhalativ; Dialyse','**Lungenembolie (Verdacht):** Thrombolyse während laufender CPR erwägen, CPR danach 60–90 min fortführen; Schema gemäß ERC 2025 (Alteplase / Tenecteplase)','**Spannungspneumothorax:** Entlastung per Minithorakotomie / Thoraxdrainage (Nadel unsicher)','**Tamponade:** Echo, Perikardiozentese bzw. Notfallthorakotomie (Trauma)','**Traumatischer Kreislaufstillstand („HOTT“):** Hypovolämie (Blutung stillen, Blut), Oxygenierung, Tension-Pneumothorax, Tamponade; Kompressionen nachrangig gegenüber Blutungskontrolle','**Hypothermie:** siehe eigenes Thema; <30 °C: max. 3 Schocks, Adrenalin zurückhaltend, Wiedererwärmung mit ECLS im Zentrum','**Schwangerschaft:** manuelle Linksverlagerung des Uterus (ab ca. 20. SSW), Hochqualitätsreanimation, bei fehlendem ROSC innerhalb weniger Minuten Notfallsectio (resuscitative hysterotomy) erwägen','**Ertrinken:** zuerst 5 Beatmungen mit Sauerstoff, dann Standard-CPR; Hypoxie ist die Ursache','**Anaphylaxie:** Adrenalin i.m. (bzw. i.v.), Volumen','**Intoxikation:** Antidot, frühzeitig Giftinformationszentrum'],
 cave:['Hypothermie-Patienten sind nicht tot, bevor sie warm und tot sind (Ausnahme: sichere Todeszeichen, K⁺ >12 mmol/l bei Lawinenverschütteten)','Bei Lungenembolie-Verdacht Lyse nicht zurückhalten – Reanimation verlängern'],
 merke:['Systematisch 4H/4T beim Rhythmuscheck durchgehen','Traumaarrest: Blutung vor Herzdruckmassage'],
 ll:[['ERC Guidelines 2025 – Special Circumstances','https://cprguidelines.eu']]},

{id:'postrea',cat:'Reanimation',t:'Postreanimationsbehandlung',s:'ROSC, Zielwerte, Koronarangiographie, Neuroprognose',
 def:'Nach ROSC beginnt die Post-Cardiac-Arrest-Behandlung. Ziele: Zweitschäden (Hypoxie, Hypotonie, Fieber, Hypo-/Hyperglykämie) vermeiden, Ursache finden.',
 dx:['12-Kanal-EKG sofort; bei ST-Hebung sofortige Koronarangiographie','Bei fehlender ST-Hebung und unklarer Ursache: CT (Kopf/Thorax) erwägen, Echo'],
 tx:['SpO₂ 94–98 %, PaCO₂ im Normbereich (35–45 mmHg)','MAP ≥65 mmHg (ggf. höher), Noradrenalin als Vasopressor','Temperaturkontrolle: Fieber konsequent vermeiden (≤37,5 °C), Zieltemperaturmanagement','Glukose ca. 140–180 mg/dl; Hypoglykämie vermeiden','Krampfanfälle behandeln (Levetiracetam, Midazolam)','Transport in Zentrum mit Herzkatheter und Intensivstation (Cardiac Arrest Center)','Neuroprognostik frühestens ≥72 h nach ROSC, multimodal, nie isoliert'],
 meds:['Noradrenalin: 0,05–0,5 µg/kg/min titriert auf MAP','Sedierung/Analgesie: z. B. Propofol + Fentanyl (hämodynamisch angepasst)'],
 cave:['Hyperoxie vermeiden','Keine Prophylaxe mit Steroiden/Antikonvulsiva routinemäßig'],
 merke:['Hypotension und Hypoxie nach ROSC verschlechtern das neurologische Outcome','Prognose nie in den ersten 72 h festlegen'],
 ll:[['ERC Guidelines 2025 – Post-Resuscitation Care','https://cprguidelines.eu']]},

{id:'plsrea',cat:'Reanimation',t:'Kinderreanimation (PLS)',s:'ERC 2025 Paediatric Life Support, Dosen nach Gewicht',
 def:'Kinder erleiden meist einen hypoxischen Arrest (Atem-/Kreislaufversagen), selten primär VF. Daher beginnt die Reanimation mit Beatmung.',
 dx:['Ansprechen, Atemwege öffnen, max. 10 s Atmung + Puls (A. brachialis < 1 J, A. carotis/femoralis ≥ 1 J)','Pulsfrequenz <60/min mit Zeichen des Kreislaufversagens = Reanimationsindikation'],
 tx:['**5 initiale Beatmungen** (mit O₂), dann **15:2** (Kompressionsfrequenz 100–120/min)','Kompressionstiefe ca. ⅓ des Thoraxdurchmessers (Säugling ~4 cm, Kind ~5 cm)','Säugling: Zwei-Daumen-Technik (Helfer-Team), Einzelretter: 2 Finger','**Schock:** 4 J/kg (biphasisch), dann 2 min CPR','Adrenalin 10 µg/kg i.v./i.o. alle 3–5 min (nach 3. Schock bei VF/pVT; sofort bei nicht schockbar)','Amiodaron 5 mg/kg nach dem 3. Schock (und nach 5. Schock)','Reversible Ursachen: Hypoxie, Hypovolämie, Hypoglykämie, Elektrolyte, Hypothermie, Tamponade, Toxine, Thrombose, Pneumothorax','Zugang: i.o. früh (Tibia), Volumenbolus 10 ml/kg balancierte Lösung bei Hypovolämie'],
 meds:['Adrenalin 10 µg/kg = 0,1 ml/kg der 1:10.000-Lösung (1 mg auf 10 ml)','Amiodaron 5 mg/kg','Glukose 10 %: 2 ml/kg bei Hypoglykämie','Atropin nicht routinemäßig'],
 kids:['Gewichtsschätzung 1–10 Jahre: (Alter + 4) × 2 kg; Säuglinge 3–12 Monate: (Monate ÷ 2) + 4 kg; Neugeborenes ca. 3,5 kg','Tubus (mit Cuff) ID = Alter ÷ 4 + 3,5; Einführtiefe oral = Tubusgröße × 3 (cm)'],
 cave:['Kompressionstiefe bei Säuglingen oft zu gering','Hyperventilation und zu hohe Beatmungsdrücke vermeiden'],
 merke:['Kind: erst Atemwege und Beatmung, dann Kompression (anders als Erwachsene)','Adrenalin 10 µg/kg (0,1 ml/kg der 1:10.000-Lösung)'],
 ll:[['ERC Guidelines 2025 – Paediatric Life Support','https://cprguidelines.eu']]},

{id:'nls',cat:'Reanimation',t:'Neugeborenenversorgung (NLS)',s:'Erstversorgung, Beatmung, 3:1, Adrenalin',
 def:'Etwa 10 % der Neugeborenen benötigen Unterstützung bei der Adaptation, ≤1 % eine Reanimation. Hauptproblem: Atemantrieb/Lungenentfaltung.',
 dx:['Erstbeurteilung: Atmung, Tonus, Herzfrequenz (HF) – Apgar nicht zur Entscheidung nutzen, nur Dokumentation (1/5/10 min)'],
 tx:['Trocknen, Wärmen (Mütze, Folie), stimulieren, Atemweg freimachen (Neutralposition)','Bei Apnoe/Gasping oder HF <100/min: **5 initiale Blähbreaths** (Spitzendruck ~25–30 cmH₂O, 2–3 s) mit Raumluft bzw. 21–30 % O₂ (Termin) – danach Thoraxexkursion kontrollieren','Dann Beatmung 30/min; Pulsoxymeter rechte Hand','HF <60/min trotz effektiver Beatmung: Thoraxkompression 3:1 (90 Kompressionen + 30 Beatmungen/min), O₂ auf 100 %','Adrenalin 10–30 µg/kg i.v. (Nabelvene) bzw. 0,1 ml/kg der 1:10.000-Lösung; Volumen 10 ml/kg bei Hypovolämie','Wärmeerhalt auch bei Reanimation (Hypothermie vermeiden, Zieltemp. 36,5–37,5 °C)'],
 meds:['Adrenalin 10–30 µg/kg i.v.','Glukose 10 %: 2.5 ml/kg bei Hypoglykämie (nach Leitlinie/SOP)'],
 kids:['Zielsättigung preduktal: 1 min ~60 %, 5 min ~80–85 %, 10 min ~90 %'],
 cave:['Nicht zu hoher Beatmungsdruck (Pneumothorax)','Absaugen nur bei sichtbarer Verlegung (Mekonium: nicht routinemäßig)'],
 merke:['Beatmung ist die wichtigste Maßnahme – 90 % der Probleme sind pulmonal','Kompression erst, wenn die Beatmung effektiv ist'],
 ll:[['ERC Guidelines 2025 – Newborn Life Support','https://cprguidelines.eu']]},

{id:'acs',cat:'Kardiovaskulär',t:'Akutes Koronarsyndrom (STEMI / NSTE-ACS)',s:'EKG-Kriterien, Erstversorgung, Reperfusion',
 def:'ACS umfasst instabile Angina, NSTEMI und STEMI. Der STEMI ist durch ST-Hebungen und akuten Koronarverschluss gekennzeichnet – Reperfusionszeit ist entscheidend.',
 dx:['Symptome: Retrosternaler Schmerz/Druck, Ausstrahlung Arm/Kiefer, Dyspnoe, Übelkeit, atypisch bei Frauen, Diabetikern, Älteren','12-Kanal-EKG innerhalb von 10 min nach Erstkontakt; ST-Hebung ≥0,1 mV in ≥2 benachbarten Ableitungen (V2–V3: ≥0,25 mV Männer <40 J, ≥0,2 mV Männer ≥40 J, ≥0,15 mV Frauen)','Äquivalente: neuer Linksschenkelblock mit Klinik, posteriorer Infarkt (ST-Senkung V1–V3, Ableitungen V7–V9), Hochrisiko-Muster (Wellens, De-Winter)','Rechtsherzinfarkt: bei inferiorem Infarkt Ableitung V4R'],
 tx:['Monitoring, i.v.-Zugang, Oberkörper hoch lagern, ruhig stellen','Sauerstoff nur bei SpO₂ <90 %','**ASS** 150–300 mg p.o. (alternativ 75–250 mg i.v.)','**Heparin** (UFH) 70–100 IE/kg i.v. (bei STEMI mit geplanter PCI)','Analgesie: Fentanyl 25–50 µg i.v. titriert (ggf. Morphin)','Nitroglycerin 0,4–0,8 mg sublingual bei Hypertonie/Lungenstauung, nicht bei RR <90–100 mmHg, RV-Infarkt, PDE-5-Hemmer','P2Y12-Hemmer: Vorbehandlung bei NSTE-ACS nicht routinemäßig (ESC 2023); bei STEMI nach Absprache mit dem Katheterlabor','Zielklinik: PCI-Zentrum mit Anmeldung; **STEMI: First-Medical-Contact → Draht ≤120 min**, sonst Fibrinolyse (innerhalb 10 min nach Diagnose; Tenecteplase gewichtsadaptiert, ≥75 J halbe Dosis) und anschließend Transfer','Rhythmusstörungen (VF, AV-Block, Bradykardie) vorbereiten, Defibrillator Pads kleben'],
 meds:['ASS 150–300 mg p.o. / 250 mg i.v.','Heparin 70–100 IE/kg (max. 5000 IE bei NSTE-ACS ohne PCI üblich 60–70 IE/kg)','Fentanyl 25–50 µg i.v.','Nitroglycerin 0,4–0,8 mg s.l. bzw. 1–6 mg/h','Tenecteplase (Fibrinolyse): <60 kg 30 mg, 60–<70 kg 35 mg, 70–<80 kg 40 mg, 80–<90 kg 45 mg, ≥90 kg 50 mg; ≥75 J: halbe Dosis'],
 cave:['Nitrat kontraindiziert bei Rechtsherzinfarkt, Hypotonie, PDE-5-Hemmern (24–48 h)','Keine i.m.-Injektionen vor Lyse','ASS bei Dissektionsverdacht nicht blind geben: Schmerz, Pulsdifferenz, Mediastinalverbreiterung beachten'],
 merke:['Bei Hinterwandinfarkt immer V4R ableiten','Zeitziel: FMC → Draht ≤120 min; sonst Lyse','O₂ nur bei Hypoxie (<90 %)'],
 ll:[['ESC Guidelines ACS 2023','https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Acute-Coronary-Syndromes-ACS-Guidelines'],['NVL Chronische KHK','https://www.leitlinien.de/themen/khk']]},

{id:'akutHI',cat:'Kardiovaskulär',t:'Akute Herzinsuffizienz, Lungenödem, kardiogener Schock',s:'Nitrat, Diuretika, NIV, Vasopressoren',
 def:'Akute Dekompensation mit Dyspnoe (Lungenödem) oder Hypoperfusion (kardiogener Schock: SBP <90 mmHg, Laktat ↑, Oligurie, kalte Peripherie trotz Volumen).',
 dx:['Klinik: Orthopnoe, Rasselgeräusche, Halsvenenstauung, Schaum vor dem Mund','EKG, SpO₂, RR, Rhythmus, Ultraschall (B-Linien), Ursache suchen: ACS, Arrhythmie, hypertensive Krise, Klappenvitium, Lungenembolie, Myokarditis'],
 tx:['Sitzende Lagerung, Beine herab','Sauerstoff nur bei SpO₂ <90 %; **CPAP/NIV** (PEEP 5–10 cmH₂O) bei respiratorischer Insuffizienz','**Nitroglycerin** 0,4–0,8 mg s.l. oder 1–6 mg/h i.v. bei SBP >100–110 mmHg','**Furosemid** 20–40 mg i.v. (bei Dauertherapie höher dosieren)','Opiate nicht routinemäßig (Atemdepression, ESC)','**Kardiogener Schock:** Noradrenalin (Mittel der Wahl bei Hypotonie), Dobutamin 2–10 µg/kg/min bei niedrigem HZV; Ursache (z. B. Infarkt) → Katheterlabor/Intensivstation','Rhythmusstörungen behandeln (Kardioversion bei instabiler Tachyarrhythmie)'],
 meds:['Nitroglycerin s.l. oder Perfusor','Furosemid 20–40 mg i.v.','Noradrenalin 0,05–0,5 µg/kg/min','Dobutamin 2–10 µg/kg/min'],
 cave:['Keine Nitrate bei Hypotension, Aortenstenose (relativ), RV-Infarkt','Furosemid nicht bei Hypovolämie/Schock','Volumengabe bei kardiogenem Schock nicht routinemäßig (nur bei klarer Hypovolämie)'],
 merke:['Nitrat + CPAP sind beim hypertensiven Lungenödem wirksamer als Diuretika allein','Kardiogener Schock: Ursache des Pumpversagens beseitigen (PCI)'],
 ll:[['ESC Guidelines Herzinsuffizienz 2021','https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Acute-and-Chronic-Heart-Failure'],['NVL Chronische Herzinsuffizienz','https://www.leitlinien.de/themen/herzinsuffizienz']]},

{id:'tachy',cat:'Kardiovaskulär',t:'Tachykarde Rhythmusstörungen',s:'Instabil → Kardioversion; stabil → Medikamente',
 def:'Tachykardie >100/min. Entscheidend: **Instabilitätszeichen** (Schock, Synkope, Myokardischämie, akute Herzinsuffizienz) und QRS-Breite.',
 dx:['12-Kanal-EKG: schmal vs. breit; regelmäßig vs. unregelmäßig','Breitkomplex-Tachykardie = ventrikulär, bis das Gegenteil bewiesen ist'],
 tx:['**Instabil:** sofortige synchronisierte Kardioversion (Analgosedierung): breit/VHF 120–150 J biphasisch, schmal regelmäßig 70–120 J; bei Pulslosigkeit → Reanimation','Schmal regelmäßig (SVT): vagale Manöver (modifizierter Valsalva mit passiver Beinhebung), dann **Adenosin** 6 mg → 12 mg → 12 mg schnell i.v. mit Flush','Vorhofflimmern, stabil: Frequenzkontrolle (Metoprolol 5 mg i.v. / Verapamil 5 mg), Rhythmuskontrolle in der Klinik (Amiodaron 300 mg wenn Herzinsuffizienz)','Stabile VT: Amiodaron 300 mg über 10–60 min; Torsade de pointes: Magnesium 2 g i.v. und Überdrehstimulation, Kardioversion/Defi bei Instabilität','Elektrolyte (K⁺, Mg²⁺), Ursachen (Intox, ACS, Hyperthyreose) berücksichtigen'],
 meds:['Adenosin 6/12/12 mg (Kinder 0,1/0,2 mg/kg)','Amiodaron 300 mg','Metoprolol 5 mg (Wiederholung bis 15 mg)','Verapamil 5 mg langsam','Magnesium 2 g'],
 cave:['Verapamil/Betablocker nicht bei Breitkomplex-Tachykardie, WPW mit VHF, Herzinsuffizienz','Adenosin: Asthma (relativ), AV-Block II–III, Herztransplantierte (Dosis halbieren), Theophyllin schwächt','WPW + VHF: Kardioversion oder Ajmalin/Procainamid, keine AV-Knoten-Blocker'],
 merke:['Instabil = elektrisch, stabil = medikamentös','Breit = VT bis zum Beweis des Gegenteils'],
 ll:[['ERC Guidelines 2025 – ALS (Peri-Arrest)','https://cprguidelines.eu'],['ESC Guidelines SVT / Vorhofflimmern','https://www.escardio.org/Guidelines']]},

{id:'brady',cat:'Kardiovaskulär',t:'Bradykarde Rhythmusstörungen',s:'Atropin, Adrenalin, Pacing',
 def:'Bradykardie <50/min mit **Zeichen der Instabilität** (Schock, Synkope, Ischämie, Herzinsuffizienz) erfordert Therapie.',
 dx:['EKG: Sinusbradykardie, AV-Block I–III (Mobitz 2 und III-Grad: gefährlich), Asystolierisiko','Ursachen: Inferiorer Infarkt, Medikamente (β-Blocker, Digitalis, Ca-Antagonisten), Hyperkaliämie, Hypothermie, Vagusreiz, erhöhter ICP'],
 tx:['O₂ bei Hypoxie, Zugang, Monitoring, Pads','**Atropin** 0,5 mg i.v., Wiederholung alle 3–5 min bis max. 3 mg','Bei Versagen: **Adrenalin-Infusion** 2–10 µg/min oder Dopamin 5–20 µg/kg/min; **transkutaner Schrittmacher** (Sedierung)','Bei Hochrisikozeichen (Asystolie ≤3 s, AV-Block Mobitz 2/III): Pacing primär','Ursachen therapieren (Hyperkaliämie → Calcium, β-Blocker → Glukagon)'],
 meds:['Atropin 0,5 mg i.v.','Adrenalin-Perfusor 2–10 µg/min','Glukagon 1–5 mg bei β-Blocker-Intox.'],
 cave:['Atropin kann bei infranodalem AV-Block paradox wirken','Pacing sedieren (Analgosedierung)'],
 merke:['Atropin 0,5 mg – nicht 0,1 mg (Dosen <0,5 mg können paradoxe Bradykardie auslösen)'],
 ll:[['ERC Guidelines – Periarrest-Arrhythmien','https://cprguidelines.eu']]},

{id:'hypert',cat:'Kardiovaskulär',t:'Hypertensive Notfälle & Aortendissektion',s:'Urapidil, Drucksenkung, Dissektion',
 def:'Hypertensive Krise: RR meist >180/120 mmHg. **Notfall** nur bei Endorganschaden (Enzephalopathie, Lungenödem, ACS, Dissektion, Eklampsie, intrazerebrale Blutung).',
 dx:['Symptome des Endorganschadens suchen; Aortendissektion: plötzlicher reißender Schmerz (Thorax/Rücken), Pulsdifferenz, RR-Seitendifferenz >20 mmHg, neurologische Ausfälle','Schweres hypertensives Notfall ohne Endorganschaden = „Dringlichkeit“ (oral, langsam)'],
 tx:['Hypertensiver Notfall: **Urapidil** 10–25 mg i.v. fraktioniert, dann 9–30 mg/h; Ziel: MAP-Senkung max. 20–25 % in der 1. Stunde','Lungenödem: Nitroglycerin + CPAP','Aortendissektion: Schmerztherapie (Fentanyl), **Sofort-Drucksenkung**: SBP <120 mmHg und HF <60/min (β-Blocker, Esmolol/Metoprolol, ggf. Urapidil) – sofortiger Transport in Zentrum mit Herzchirurgie; **kein Heparin, keine Lyse**','Zerebrale Blutung/Schlaganfall: individuelle RR-Ziele (siehe Schlaganfall)'],
 meds:['Urapidil 10–25 mg i.v.','Nitroglycerin 1–6 mg/h','Metoprolol 5 mg i.v. oder Esmolol','Fentanyl 25–50 µg'],
 cave:['Urapidil: Aortenisthmusstenose / AV-Shunts','Zu rasche Blutdrucksenkung → zerebrale/koronare Minderperfusion','Dissektion: nie ASS/Heparin, bevor Differenzialdiagnose ACS geklärt ist'],
 merke:['Hypertensive Dringlichkeit nicht zu schnell senken','Dissektion: Schmerz + Druck + Frequenz senken, nicht lysieren'],
 ll:[['ESC/ESH Leitlinie Hypertonie','https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Arterial-Hypertension-Management-of'],['ESC Guidelines Aortenerkrankungen 2024','https://www.escardio.org/Guidelines']]},

{id:'lae',cat:'Kardiovaskulär',t:'Lungenembolie',s:'Risikostratifizierung, Lyse, Antikoagulation',
 def:'Akuter Verschluss von Pulmonalarterien durch Thromben, meist aus tiefer Beinvenenthrombose. Hochrisiko-LE = Schock/Hypotonie (SBP <90 mmHg) oder Reanimation.',
 dx:['Dyspnoe, Thoraxschmerz, Synkope, Tachykardie, Hypoxie; Hinweise auf TVT','Wells-Score / revidierter Genf-Score; EKG: S1Q3T3, Rechtsherzbelastung, neuer RSB, Sinustachykardie','Echo: RV-Dilatation, Septumabflachung, D-Zeichen','D-Dimere nur bei niedriger/mittlerer Wahrscheinlichkeit sinnvoll'],
 tx:['O₂, Lagerung, venösen Zugang, Monitoring','**Heparin** 80 IE/kg Bolus (UFH) bei hoher klinischer Wahrscheinlichkeit, bevor die Diagnostik abgeschlossen ist','**Hochrisiko:** systemische Thrombolyse – Alteplase 100 mg über 2 h oder 0,6 mg/kg über 15 min (max. 50 mg); Tenecteplase gewichtsadaptiert; chirurgische oder kathetergestützte Embolektomie / ECMO bei Kontraindikation','Hypotonie: Noradrenalin, vorsichtige Volumenlast (≤500 ml) bei RV-Insuffizienz','Intubation/PPV vermeiden (RV-Versagen); wenn nötig: hämodynamisch stabile Induktion (Ketamin/Etomidat), niedrige PEEP'],
 meds:['UFH 80 IE/kg Bolus, dann 18 IE/kg/h','Alteplase 100 mg/2 h oder 0,6 mg/kg/15 min','Noradrenalin 0,05–0,5 µg/kg/min'],
 cave:['Absolute KI Lyse: Blutung, Schlaganfall <6 Monate, ZNS-Neoplasie, Trauma/OP <3 Wochen – bei Reanimation/Hochrisiko-LE relativiert','Positive-Druck-Beatmung kann RV-Versagen auslösen'],
 merke:['Hochrisiko-LE = Lyse (oder Embolektomie), nicht nur Antikoagulation','Bei Reanimation und LE-Verdacht: Lyse, CPR 60–90 min'],
 ll:[['ESC Guidelines Lungenembolie 2019 (Update ausstehend prüfen)','https://www.escardio.org/Guidelines/Clinical-Practice-Guidelines/Acute-Pulmonary-Embolism-Diagnosis-and-Management-of']]},

{id:'asthmacopd',cat:'Atemwege & Atmung',t:'Asthma & COPD-Exazerbation',s:'Bronchodilatation, Steroide, NIV',
 def:'Akute Verschlechterung obstruktiver Atemwegserkrankungen. Lebensbedrohlich: stille Lunge, Zyanose, Erschöpfung, Bewusstseinsstörung, SpO₂ <92 %.',
 dx:['Atemfrequenz, SpO₂, Sprechdyspnoe, Peak-Flow (Asthma: <33 % Soll = lebensbedrohlich)','Auskultation: Giemen vs. stille Lunge; Ausschluss Pneumothorax, LE, kardiale Ursache','COPD: Sputumänderung, Infekt, Rechtsherzbelastung'],
 tx:['Sitzend, Lippenbremse, **O₂**: Asthma SpO₂ 94–98 %; **COPD Ziel 88–92 %** (S3 O₂: Hyperkapnie vermeiden)','**Salbutamol** 2,5–5 mg per Vernebler (wiederholt) oder 4–8 Hübe DA via Spacer','**Ipratropiumbromid** 0,5 mg zusätzlich (v. a. schwere Exazerbation)','**Prednisolon** 50–100 mg i.v./p.o. (COPD 40 mg für 5 Tage, NVL)','Schweres Asthma: **Magnesiumsulfat** 2 g i.v. über 20 min, Adrenalin i.m. 0,3–0,5 mg oder Terbutalin 0,25–0,5 mg s.c.; **Esketamin** zur Sedierung/Intubation','COPD-Hyperkapnie: **NIV** bei pH <7,35 und pCO₂ >45 mmHg; Antibiotika bei purulentem Sputum','Intubation/Beatmung: lange Exspirationszeit, niedrige Frequenz (6–10/min), Vermeidung von Auto-PEEP'],
 meds:['Salbutamol 2,5–5 mg inhal. / 4–8 Hübe','Ipratropium 0,5 mg inhal.','Prednisolon 50–100 mg','Magnesium 2 g über 20 min','Adrenalin 0,3–0,5 mg i.m. (Status asthmaticus)','Esketamin 0,5–1 mg/kg zur Narkose'],
 kids:['Salbutamol 2,5 mg (bei <20 kg) bzw. 2–4 Hübe DA mit Spacer','Prednisolon 1–2 mg/kg (max. 50–100 mg)','Magnesium 25–50 mg/kg (max. 2 g)'],
 cave:['β-Blocker beim Asthma absolut kontraindiziert','Sedativa bei Hyperkapnie vorsichtig','Intubation: Auto-PEEP, Pneumothorax-Risiko'],
 merke:['COPD: SpO₂-Ziel 88–92 %, Asthma: 94–98 %','Stille Lunge = Alarmzeichen'],
 ll:[['NVL Asthma','https://www.leitlinien.de/themen/asthma'],['NVL COPD','https://www.leitlinien.de/themen/copd'],['S3-Leitlinie Sauerstoff in der Akuttherapie (AWMF 020-021)','https://register.awmf.org/de/leitlinien/detail/020-021']]},

{id:'anaphylaxie',cat:'Atemwege & Atmung',t:'Anaphylaxie',s:'Adrenalin i.m. als erste Wahl (S2k 2021)',
 def:'Akute, lebensbedrohliche, systemische Überempfindlichkeitsreaktion. Schweregrade I–IV nach Ring & Messmer: I Haut, II Haut + leichte Organbeteiligung, III Schock/Bronchospasmus/Larynxödem, IV Atem-/Kreislaufstillstand.',
 dx:['Haut/Schleimhaut (Urtikaria, Flush, Angioödem) + Atemwege (Stridor, Bronchospasmus) und/oder Kreislauf (Hypotonie, Synkope) und/oder Gastrointestinal','Auslöser: Nahrungsmittel, Insektengift, Medikamente (Antibiotika, NSAR, Kontrastmittel, Muskelrelaxanzien)'],

 tx:['**Opioide** → Naloxon 0,04–0,4 mg i.v. fraktioniert (Kurze HWZ, Rebound)','**Benzodiazepine** → Flumazenil 0,2 mg i.v. (nur gezielt)','**Paracetamol** → Acetylcystein 150 mg/kg in 1 h','**Kohlenmonoxid** → 100 % O₂; **Zyanid** → Hydroxocobalamin 5 g','**Alkylphosphate** → Atropin 2–5 mg wiederholt bis Bronchorrhoe sistiert, Obidoxim','**Anticholinerg** → Physostigmin 2 mg langsam (Bradykardie beachten)','**TCA** → Natriumbikarbonat 1–2 mmol/kg bei QRS >100 ms; **β-Blocker** → Glukagon 5–10 mg, Calcium, Adrenalin; **Ca-Antagonisten** → Calcium, Insulin-Hochdosis','**Digitalis** → Digitalis-Antitoxin; **Methämoglobin** → Methylenblau 1–2 mg/kg','**Methanol/Ethylenglykol** → Fomepizol (alternativ Ethanol)','**Antikoagulanzien:** Dabigatran → Idarucizumab 5 g; Xa-Hemmer → Andexanet / PPSB; Heparin → Protamin; VKA → Vitamin K + PPSB','Aktivkohle 1 g/kg nur bei erhaltenem Schutzreflex und innerhalb ~1 h, nie bei Säuren/Laugen, Alkoholen, Kohlenwasserstoffen'],
 cave:['Kein induziertes Erbrechen','Flumazenil: Krampf bei Mischintoxikation mit TCA','Naloxon: Entzugssyndrom, Lungenödem'],
 merke:['Giftinformationszentrum früh anrufen','Antidot nicht vor Symptomatik bei unklarer Substanz'],
 ll:[['Giftinformationszentren – Übersicht (BfR)','https://www.bfr.bund.de/de/giftnotrufnummern_und_giftinformationszentren-198403.html']]},

{id:'hypotherm',cat:'Umwelt & Thermisch',t:'Unterkühlung & Lawinenunfall',s:'Swiss Staging, Bergung, Wiedererwärmung, ECLS',
 def:'Hypothermie = Körperkerntemperatur <35 °C. Swiss Staging: HT I (32–35 °C, wach, Kältezittern), HT II (28–32 °C, Bewusstseinsstörung, kein Zittern), HT III (24–28 °C, bewusstlos, Vitalzeichen vorhanden), HT IV (<24 °C, scheinbar tot/Kreislaufstillstand).',
 dx:['Kerntemperatur (tympanal oder ösophageal), EKG: Osborn-Welle, Bradykardie, VF','Lawine: Verschüttungsdauer, Atemhöhle, Schneetiefe, Vitalzeichen'],
 tx:['**Horizontal und schonend** bergen (Bergungstod/Afterdrop), Kälteexposition beenden, isolieren (Hypothermiepack)','HT I: aktiv bewegen, warme Getränke, trockene Kleidung','HT II/III: Transport in Klinik, warme Infusionen (38–42 °C), Heizpads am Rumpf, kein Reiben','HT III/IV: ECLS-fähige Klinik direkt anfahren','Reanimation bei HT IV: CPR bis zur Wiedererwärmung; bei <30 °C maximal 3 Schocks, Adrenalin erst >30 °C; K⁺ >12 mmol/l bei Lawinenverschütteten als Abbruchkriterium','ERC 2025: Herzfrequenz <45/min als neues Hochrisikokriterium für hypothermie-induzierten Kreislaufstillstand (HOPE-Score berücksichtigen)'],
 cave:['Aggressive Mobilisation löst VF aus','„Nobody is dead until warm and dead“ (Ausnahmen beachten)'],
 merke:['Horizontal, schonend, isolieren','HT IV → ECLS-Zentrum'],
 ll:[['ERC Guidelines 2025 – Special Circumstances','https://cprguidelines.eu']]},

{id:'hitze',cat:'Umwelt & Thermisch',t:'Hitzeschäden (Hitzschlag)',s:'Kühlung, Volumen, Abgrenzung',

 dx:['Kerntemperatur messen; ZNS-Symptome (Verwirrung, Krampf, Koma)','Differenzialdiagnosen: Sepsis, Intoxikation (Amphetamine), malignes Neuroleptika-Syndrom, maligne Hyperthermie'],
 tx:['**Aktive Kühlung**: kaltes Wasser (Immersion, besprühen + Ventilator), Eispacks an Hals/Axilla/Leiste','Volumen: kühle balancierte Infusion (500–1000 ml), keine Antipyretika','Benzodiazepine bei Krampf/Schüttelfrost, Intubation bei GCS ≤8','Zielkerntemperatur <39 °C, dann Kühlung beenden (Rebound/Hypothermie vermeiden)'],
 cave:['Antipyretika (Paracetamol, NSAR) sind unwirksam','Rhabdomyolyse, Nierenversagen, DIC beachten'],
 merke:['Hitzschlag = Kühlen, Kühlen, Kühlen – Transport parallel'],
 ll:[['ERC Guidelines 2025 – Special Circumstances','https://cprguidelines.eu']]},

{id:'ertrinken',cat:'Umwelt & Thermisch',t:'Ertrinken, Tauchunfall & Elektrounfall',s:'Hypoxie, 5 Beatmungen, DCI, Strom',
 def:'Ertrinken führt über Hypoxie zum Kreislaufstillstand. Tauchunfälle: Dekompressionserkrankung (DCI) und arterielle Gasembolie. Stromunfälle: Niederspannung (<1000 V) vs. Hochspannung, Blitz.',

 tx:['**Ertrinken:** zuerst 5 Beatmungen mit O₂, dann CPR; Aufwärmen, auch bei Hypothermie; Oberkörperhoch bei Atmung; Klinik bei jeder Symptomatik','**Tauchunfall:** 100 % O₂ (Gesichtsmaske mit Reservoir), Flüssigkeit, horizontale Lagerung, schnellstmögliche Rekompression (Druckkammer), Tauch-Notruf (DAN Europe)','**Strom:** Eigenschutz (Abschalten), 12-Kanal-EKG & Monitoring, bei Kardiale Auffälligkeiten Klinik; bei Reanimation Standard-ALS; Blitz: Reverse Triage (Stillstände zuerst)'],
 cave:['Kein Heimlich-Manöver beim Ertrinkenden','Strom: HWS-Trauma durch Sturz beachten'],
 merke:['Ertrinken: zuerst Beatmung','Tauchunfall: 100 % O₂ + Druckkammer'],
 ll:[['ERC Guidelines 2025 – Special Circumstances','https://cprguidelines.eu']]}
);

{id:'eklampsie',cat:'Geburtshilfe',t:'Präeklampsie, Eklampsie, HELLP',s:'Magnesium, Blutdrucksenkung, Entbindung',

{id:'geburt',cat:'Geburtshilfe',t:'Geburt außerhalb der Klinik & postpartale Blutung',s:'Notfallgeburt, Nabelschnurvorfall, Schulterdystokie, PPH',
 def:'Notfallgeburt: ruhig bleiben, Mutter schützen, Neugeborenes warm halten. Postpartale Hämorrhagie (PPH): >500 ml (vaginal) bzw. >1000 ml (Sectio) oder Kreislaufwirkung.',
 dx:['Presswehen, Kopf sichtbar → Geburt in Kürze; Nabelschnurvorfall (Schnur vor dem Kopf); Schulterdystokie (Turtle Sign)','PPH: Uterusatonie, Geburtsverletzung, Plazentaretention, Gerinnungsstörung'],
 tx:['Geburt: Dammschutz, Kopf entwickeln, Schulter, Neugeborenes abtrocknen, wärmen; zwei Klemmen, nach 1–3 min abnabeln','Neugeborenes: Atmung, HF, Tonus → NLS bei Bedarf; Apgar 1/5/10 min','**Nabelschnurvorfall:** Knie-Ellenbogen-Lage / Beckenhochlage, Kopf zurückschieben (manuell), Tokolyse, rasche Sectio','**Schulterdystokie:** McRoberts-Manöver (Beine anwinkeln), suprasymphysärer Druck, Rubin','**PPH:** Uterusmassage, Oxytocin 3–5 IE langsam i.v. (dann 10–30 IE/500 ml), Tranexamsäure 1 g, Kristalloide/Blut, Sulproston (Klinik), Plazenta prüfen, Transport','Plazentalösung nicht erzwingen; Plazenta in Klinik mitnehmen'],
 meds:['Oxytocin 3–5 IE langsam i.v.','Tranexamsäure 1 g i.v. (innerhalb 3 h)','Magnesium bei Eklampsie','Tokolyse bei Nabelschnurvorfall nach Vorgabe'],

{id:'psych',cat:'Psychiatrie & Recht',t:'Akute Erregung, Suizidalität, Zwang',s:'Deeskalation, Medikamente, PsychKG NRW',
 def:'Psychiatrische Notfälle verlangen zuerst somatische Ausschlussdiagnostik (Hypoglykämie, Hypoxie, SHT, Intoxikation, Delir). Eigen- und Fremdgefährdung beurteilen.',

 tx:['Eigenschutz, Deeskalation, ruhige Kommunikation, Polizei bei Fremdgefährdung','Medikation (S3 „Verhinderung von Zwang“): **Lorazepam** 1–2 mg p.o./i.v., **Midazolam** 5 mg i.m./i.n., **Haloperidol** 5 mg i.m./i.v. (QTc beachten; nicht bei Parkinson/Demenz), ggf. Esketamin bei schwerer Agitation','Fixierung nur im Notfall, richterlicher Beschluss nötig','**Unterbringung:** PsychKG NRW – Ordnungsamt/Polizei beantragen ärztliches Zeugnis; Betreuungsgericht (§ 1831 BGB) bei Betreuten','Suizidalität: nicht allein lassen, Gefahrenquelle entfernen, Transport in Klinik'],

 merke:['Erst Somatik, dann Psychiatrie','Zwang: Verhältnismäßigkeit, Dokumentation, Rechtsgrundlage'],

{id:'kinder',cat:'Pädiatrie',t:'Kindernotfälle im Überblick',s:'Krupp, Asthma, Krampf, Sepsis, Dosierung',
 def:'Kinder sind keine kleinen Erwachsenen: höhere Atemfrequenz, kleinere Reserven, Dosierungen nach Gewicht (ERC/APLS-Formel). PAT (Pediatric Assessment Triangle): Aussehen, Atemarbeit, Hautkolorit.',

 tx:['**Pseudokrupp (Laryngitis subglottica):** Dexamethason 0,15–0,6 mg/kg oral/i.v. oder Prednisolon 100 mg rektal; bei Stridor in Ruhe **Adrenalin inhalativ** (3–5 ml 1:1000 unverdünnt = 3–5 mg)','**Epiglottitis** (selten): Kind ruhig lassen, nicht untersuchen, Anästhesie/HNO, Intubation im OP','**Asthma:** Salbutamol 2,5 mg inhalativ / 2–4 Hübe, Ipratropium 0,25 mg, Prednisolon 1–2 mg/kg, Magnesium 25–50 mg/kg','**Fieberkrampf:** meist selbstlimitierend; bei >5 min Midazolam bukkal/nasal, Diazepam rektal 5 mg (<15 kg) / 10 mg','**Sepsis:** Volumenbolus 10–20 ml/kg, früh Antibiose (Ceftriaxon 100 mg/kg), Glukose prüfen','**Hypoglykämie:** Glukose 10 % 2 ml/kg','**Dehydratation:** Kristalloid 10–20 ml/kg, Reevaluation','**Fremdkörperaspiration:** 5 Rückenschläge, dann 5 Thoraxkompressionen (Säugling) bzw. Heimlich ab 1 J','Dosierung: immer Gewicht schätzen/Broselow, Doppelcheck'],
 meds:['Adrenalin inhal. 3–5 mg','Dexamethason 0,15–0,6 mg/kg','Prednisolon 1–2 mg/kg','Salbutamol 2,5 mg','Glukose 10 %: 2 ml/kg'],
 cave:['Kein Ibuprofen bei Dehydratation','Metoclopramid <1 Jahr nicht anwenden (EMA)','Atropin-Mindestdosis: 0,1 mg'],
 merke:['Krupp: Dexamethason + Adrenalin inhalativ','Epiglottitis: nicht untersuchen, Intubation im OP'],
 ll:[['ERC Paediatric Life Support 2025','https://cprguidelines.eu']]},

{id:'atemweg',cat:'Atemweg, Narkose, Analgesie',t:'Prähospitales Atemwegsmanagement',s:'Stufenplan, SGA, Videolaryngoskop, Koniotomie',

 ll:[['S1-Leitlinie Prähospitales Atemwegsmanagement (AWMF 001-040)','https://register.awmf.org/de/leitlinien/detail/001-040']]},

{id:'rsi',cat:'Atemweg, Narkose, Analgesie',t:'Prähospitale Notfallnarkose (RSI)',s:'Indikation, Ablauf, Medikamente, Komplikationen',
 def:'Die Notfallnarkose ist ein Hochrisikoverfahren. Indikation kritisch stellen: respiratorische Insuffizienz, Schutzreflexverlust, schweres SHT/Polytrauma, Schmerztherapie nicht anders möglich, Transportfähigkeit.',
 dx:['Checkliste: Monitoring (EKG, SpO₂, RR, Kapnographie), Vorbereitung (Absaugung, Beutel, Tubus, Videolaryngoskop, SGA, Koniotomie), Medikamente aufgezogen, Team-Briefing'],
 tx:['**Präoxygenierung** 3 min 100 % O₂ (Maske mit Reservoir/PEEP), ggf. 20–30° Oberkörperhochlagerung','**RSI-Medikamente (Beispiel):** Opioid (Fentanyl 1–3 µg/kg) + Hypnotikum (Esketamin 0,5–1 mg/kg bzw. Etomidat 0,2–0,3 mg/kg bzw. Propofol 1–2 mg/kg) + Relaxans (Succinylcholin 1–1,5 mg/kg oder Rocuronium 1 mg/kg)','Schock/Instabilität: Dosisreduktion (Hypnotika), Volumen/Noradrenalin vor Induktion','Intubation, Kapnographie bestätigt, Cuff, Fixierung, Beatmung (Tidalvolumen 6–8 ml/kg IBW, PEEP 5 cmH₂O, etCO₂ 35–40 mmHg)','Postintubationssedierung/Analgesie (Fentanyl + Midazolam/Propofol/Esketamin)'],
 meds:['Fentanyl 1–3 µg/kg','Esketamin 0,5–1 mg/kg','Etomidat 0,2–0,3 mg/kg','Propofol 1–2 mg/kg (Instabilität reduzieren)','Succinylcholin 1–1,5 mg/kg','Rocuronium 1 mg/kg; Sugammadex 16 mg/kg'],
 cave:['Succinylcholin kontraindiziert: Hyperkaliämie, Verbrennung >24–48 h, Muskeldystrophie, maligne Hyperthermie','Hypotension bei Induktion → Bolus Noradrenalin (5–10 µg) bereit','Nie ohne Kapnographie intubieren/Lagekontrolle'],
 merke:['Präoxygenierung, Vorbereitung, Kapnographie','„Shock-Index“ vor Narkose beachten'],
 ll:[['S1-Handlungsempfehlung Prähospitale Notfallnarkose beim Erwachsenen (AWMF 001-030)','https://register.awmf.org/de/leitlinien/detail/001-030']]},

{id:'analgesie',cat:'Atemweg, Narkose, Analgesie',t:'Analgesie & Sedierung in der Notfallmedizin',s:'NRS, Stufenschema, Opioide, Esketamin, Metamizol',

 merke:['Titrieren statt Bolus','Wirkung und Atmung engmaschig überwachen'],

{id:'manv',cat:'Organisation',t:'MANV, Sichtung & Einsatzstellenorganisation',s:'LNA/OrgL, mSTaRT, Sichtungskategorien, Gefahrenlagen',
 def:'MANV = Massenanfall von Verletzten/Erkrankten, bei dem die Ressourcen vor Ort nicht ausreichen. Ziel: das Beste für die größte Zahl. Rollen: LNA (Leitender Notarzt), OrgL (Organisatorischer Leiter Rettungsdienst), Einsatzleiter Feuerwehr.',
 dx:['Erkundung: Gefahren, Anzahl Verletzte (Verdacht), nachzufordernde Ressourcen','Gefahrenlagen: **GAMS** (Gefahr erkennen, Absperren, Menschenrettung, Spezialkräfte) bei Gefahrstoffen; bei Amok/Terror: Tactical Emergency Casualty Care (TECC), Zonen (heiß/warm/kalt)'],
 tx:['**Sichtung nach mSTaRT**: Gehfähig? → III (grün); Atmung? keine → ggf. Atemwege öffnen → keine Atmung = tot (schwarz/blau); AF >30/min → I; Radialispuls fehlt/Rekap >2 s → I; keine Befolgung einfacher Aufforderungen → I; sonst II','Kategorien: **SK I (rot) sofort**, **SK II (gelb) dringlich**, **SK III (grün) leicht**, **SK IV (blau) abwartend/betreuend**, tot (schwarz)','Behandlungsplatz, Patientenablage, Transport nach Dringlichkeit; Dokumentation (Patientenanhängekarte)','Dynamische Re-Sichtung; Kommunikation (Funk), Absprache mit Leitstelle'],
 cave:['Individualmedizinische Maßstäbe weichen den Katastrophenmaßstäben – Ressourcenzuteilung nach Sichtung','Eigenschutz vor Patientenversorgung'],
 merke:['Erst Sichten, dann Behandeln','SK I = rot'],
 ll:[['Handlungsempfehlungen MANV / Sichtung (DGAI/ Bund)','https://www.bbk.bund.de']]},

{id:'recht',cat:'Psychiatrie & Recht',t:'Rechtliches in der Notfallmedizin',s:'Einwilligung, Notstand, Leichenschau, Patientenverfügung',
 def:'Rechtsgrundlagen im Rettungsdienst: Hilfeleistungspflicht, Einwilligung, Notkompetenz, Dokumentation, Todesfeststellung. Rettungsdienst ist Landesrecht (RettG NRW).',
 dx:['Hilfeleistungspflicht: § 323c StGB (unterlassene Hilfeleistung)','Einwilligung: Aufklärung, Einwilligungsfähigkeit; **mutmaßlicher Wille** bei Bewusstlosigkeit (Geschäftsführung ohne Auftrag, § 34 StGB rechtfertigender Notstand)','Patientenverfügung (§ 1827 BGB) und Vorsorgevollmacht; Betreuung (§ 1814 ff. BGB)','Notfallsanitäter: Heilkundeausübung im Rahmen des § 2a NotSanG (Notkompetenz) und Standardarbeitsanweisungen (SAA)','Todesfeststellung: sichere Todeszeichen (Totenflecke, Totenstarre, Fäulnis, mit dem Leben nicht vereinbare Verletzungen); Leichenschau gemäß Bestattungsgesetz NRW: Todesart natürlich / nicht natürlich / ungeklärt (Polizei bei nicht natürlich)'],
 tx:['Dokumentation: DIVI-Notarztprotokoll, Zeiten, Maßnahmen, Medikamente, Einverständnis/Ablehnung','Behandlungsverweigerung: Einwilligungsfähigkeit prüfen, Aufklärung über Risiken, Dokumentation (Verweigerungsprotokoll, Zeugen)','Reanimation: bei gültiger Patientenverfügung/DNAR prüfen; im Zweifel Reanimation beginnen und Gespräch mit Angehörigen/Hausarzt','Kindeswohlgefährdung: KKG § 4 (Hinweis an Jugendamt, Beratung nach SGB VIII)','Schweigepflicht (§ 203 StGB) – Weitergabe nur mit Einwilligung oder Rechtfertigung'],
 cave:['Bei Unsicherheit und Zeitdruck: Handeln im Sinne des Patienten (mutmaßlicher Wille)','Freiheitsentziehende Maßnahmen benötigen Rechtsgrundlage und Dokumentation'],
 merke:['Unterlassen ist strafbar, wenn Hilfe erforderlich und zumutbar','Todesart nicht natürlich/ungeklärt → Polizei'],

<script>/* Ergänzende Themen (Teil 4a) */
window.TOPICS=(window.TOPICS||[]).concat([
{id:'abdomen',cat:'Internistische Notfälle',t:'Akutes Abdomen & gastrointestinale Blutung',s:'Peritonitis, Ileus, Mesenterialischämie, Varizenblutung',def:'Akut einsetzende Bauchschmerzen mit möglicher Peritonitis oder Kreislaufbeteiligung; zeitkritisch bei Perforation, Ischämie, rupturiertem Aortenaneurysma und Blutung.',dx:['Anamnese: Schmerzbeginn (plötzlich = Perforation/Ischämie/Ruptur), Erbrechen, Stuhlgang, Teerstuhl, Hämatemesis, Antikoagulation, Alkohol, Vor-OPs','Befund: Abwehrspannung/Loslassschmerz (Peritonitis), Darmgeräusche, Schock?','**Frauen im gebärfähigen Alter:** immer Extrauteringravidität bedenken','Plötzlicher Vernichtungsschmerz + Schock → rupturiertes Bauchaortenaneurysma; absolute Arrhythmie + Schmerz → Mesenterialischämie','Differenzial: Herzinfarkt (Hinterwand), Lungenembolie, diabetische Ketoazidose, Basale Pneumonie'],tx:['ABCDE, 2 großlumige Zugänge, O₂ bei Hypoxie, Monitoring','Kristalloide **zurückhaltend** bei Blutung (permissive Hypotension bis OP/Endoskopie), bei Sepsis/Hypovolämie gezielt','Frühe Analgesie nach Bedarf (Metamizol, Paracetamol, Opioid titriert) – verschleiert den Befund nach aktueller Evidenz nicht','Nüchtern lassen; bei Ileus/Erbrechen Antiemetikum, Aspirationsrisiko beachten','Obere GI-Blutung: Pantoprazol 80 mg i.v.; Varizenblutung: Terlipressin 2 mg i.v., Antibiotikaprophylaxe (Ceftriaxon 1–2 g); Endoskopie < 24 h, bei Varizen < 12 h','Zielklinik mit Chirurgie, Endoskopie, Intensivstation (ggf. Voranmeldung)'],meds:['Metamizol 1–2 g Kurzinfusion (Hypotonie bei schneller Gabe)','Butylscopolamin 20 mg i.v. bei Koliken (nicht bei Ileus-Verdacht mit Tachykardie)','Pantoprazol 80 mg i.v.','Terlipressin 2 mg i.v. (Varizenblutung)'],cave:['Kein Dehnen/Abtasten bei Perforationsverdacht wiederholen','Antikoagulierte Patienten: Blutungsrisiko, Antagonisierung klären','Hohe Letalität bei Mesenterialischämie – frühe Bildgebung/Chirurgie'],merke:['Plötzlicher Schmerz + Schock = Gefäßkatastrophe, bis zum Beweis des Gegenteils','Frau im gebärfähigen Alter + Bauchschmerz = Schwangerschaftstest/Extrauteringravidität bedenken','Varizenblutung: Terlipressin + Antibiose + Endoskopie < 12 h'],ll:[['S2k-Leitlinie Gastrointestinale Blutung (AWMF 021-028)','https://register.awmf.org/de/leitlinien/detail/021-028']]},
{id:'elektrolyte',cat:'Internistische Notfälle',t:'Elektrolytentgleisungen (Hyperkaliämie, Hyponatriämie)',s:'Hyperkaliämie-EKG und Therapie, symptomatische Hyponatriämie',def:'Lebensbedrohliche Störungen von Kalium und Natrium, häufig bei Niereninsuffizienz, Dialyse, Diuretika oder Rhabdomyolyse.',dx:['**Hyperkaliämie:** hohe zeltförmige T-Wellen → verbreiterter QRS → PQ-Verlängerung/P-Verlust → Sinuswelle → Kammerflimmern/Asystolie','Symptome: Schwäche, Parästhesien, Bradykardie, Hypotonie; Auslöser: Niereninsuffizienz, Dialyseversäumnis, ACE-Hemmer, K⁺-sparende Diuretika, Rhabdomyolyse','**Hyponatriämie:** Kopfschmerz, Übelkeit, Verwirrtheit, Krampfanfall, Koma (Hirnödem)','Blutgasanalyse mit Elektrolyten prähospital/klinisch bestimmen, Blutzucker prüfen'],tx:['**Hyperkaliämie mit EKG-Veränderungen:** Calciumgluconat 10 % 10–20 ml i.v. über 2–3 min (Kardioprotektion), Wiederholung nach 5–10 min möglich','Shift: 10 IE Normalinsulin + 25 g Glukose (50 ml G50 %) über 15–30 min; Salbutamol 10–20 mg inhalativ; Bicarbonat 50–100 mmol bei Azidose','Elimination: Furosemid bei erhaltener Diurese, Hämodialyse bei Refraktärität/Anurie','Reanimation bei Hyperkaliämie: Calcium, Bicarbonat, Insulin/Glukose zusätzlich zur Standard-CPR (ERC)','**Symptomatische Hyponatriämie (Krampf, Koma):** 150 ml NaCl 3 % über 20 min, ggf. 1–2× wiederholen; Ziel +5 mmol/l, **max. +10 mmol/l in 24 h**','Asymptomatische/chronische Hyponatriämie: langsame Korrektur, Klinikaufnahme'],meds:['Calciumgluconat 10 % 10–20 ml i.v. langsam','Normalinsulin 10 IE + Glukose 25 g','Salbutamol 10–20 mg vernebelt','NaCl 3 % 150 ml über 20 min','Natriumbicarbonat 8,4 % 50–100 ml'],cave:['Calcium nicht in dieselbe Leitung wie Bicarbonat','Hypoglykämie nach Insulin: BZ-Kontrolle über 4–6 h','Zu schnelle Natrium-Korrektur → osmotische Demyelinisierung (zentrale pontine Myelinolyse)'],merke:['Hyperkaliämie mit EKG-Zeichen: zuerst Calcium','Kalium senken ≠ Kalium entfernen: Insulin/Glukose verschiebt nur, Dialyse entfernt','Hyponatriämie: bei Krampf/Koma NaCl 3 % Bolus, sonst langsam korrigieren'],ll:[['ERC Guidelines 2025 – Besondere Umstände','https://cprguidelines.eu']]},
{id:'blutung',cat:'Trauma',t:'Blutungsschock & Antikoagulanzien-Notfälle',s:'Hämorrhagischer Schock, Tranexamsäure, Antagonisierung',def:'Akuter Blutverlust mit Gewebehypoperfusion; Letalität steigt mit Blutverlust und Gerinnungsstörung. Antikoagulierte Patienten bluten stärker und länger.',dx:['Schockzeichen: Tachykardie, Hypotonie (spät!), Blässe, kalte Haut, verlängerte Rekap-Zeit, Bewusstseinsstörung','Klassen I–IV (ATLS): < 15 %, 15–30 %, 30–40 %, > 40 % Volumenverlust','Blutungsquelle suchen: extern, Thorax, Abdomen, Becken, Oberschenkel, retroperitoneal','Antikoagulanzien erfragen (Marcumar, DOAK, Heparin, Thrombozytenhemmer)'],tx:['**Kontrolle der Blutungsquelle zuerst:** Druckverband, Tourniquet, Beckenschlinge, Hämostyptika','2 große Zugänge/i.o., **permissive Hypotension** (systolisch ca. 80–90 mmHg, bei SHT höher) bis zur Blutstillung','**Tranexamsäure 1 g i.v. über 10 min** (möglichst < 3 h nach Verletzung), dann 1 g über 8 h','Wärmeerhalt; Kalzium bei Massivtransfusion; Fibrinogen früh (2–4 g), frühe Blutprodukte (Erythrozyten, Plasma)','Zielklinik: Schockraum/Traumazentrum, Voranmeldung, Massivtransfusionsprotokoll','**Antagonisierung:** Phenprocoumon → PPSB 25–50 IE/kg + Vitamin K 10 mg i.v.; Dabigatran → Idarucizumab 5 g; Faktor-Xa-Hemmer → Andexanet alfa oder PPSB 25–50 IE/kg; Heparin → Protamin (1 IE pro 1 IE Heparin)'],meds:['Tranexamsäure 1 g über 10 min, dann 1 g über 8 h','Fibrinogenkonzentrat 2–4 g','PPSB 25–50 IE/kg','Vitamin K 10 mg i.v.','Idarucizumab 5 g (Dabigatran)','Calcium 1–2 g bei Massivtransfusion'],cave:['Hypothermie, Azidose, Hypokalzämie = tödliche Trias, aktiv gegensteuern','Viel Kristalloid verdünnt Gerinnung → zurückhaltend','Tranexamsäure nicht überdosieren (Krampfrisiko bei hohen Dosen), Indikation: Blutung, nicht prophylaktisch'],merke:['Blutung stillen vor Volumen geben','TXA früh (< 3 h), nicht „nachträglich bei Gelegenheit“','Marcumar: PPSB + Vit K; Dabigatran: Idarucizumab'],ll:[['S3-Leitlinie Polytrauma/Schwerverletzten-Behandlung (AWMF 187-023)','https://register.awmf.org/de/leitlinien/detail/187-023']]},
{id:'niere',cat:'Internistische Notfälle',t:'Akutes Nierenversagen & Dialysepatient',s:'Prärenal, renal, postrenal; Hyperkaliämie, Überwässerung',def:'Akuter Abfall der glomerulären Filtration mit Anstieg der Retentionswerte; im Notfall relevant durch Hyperkaliämie, Überwässerung/Lungenödem und Azidose.',dx:['Prärenal (Volumenmangel, Sepsis, Herzinsuffizienz), renal (Tubulusnekrose, Rhabdomyolyse, Kontrastmittel, NSAR), postrenal (Harnverhalt, Steine)','Dialysepatient: Shuntarm schonen (kein Blutdruck/Zugang), Dialyseversäumnis → Hyperkaliämie/Lungenödem','Klinik: Oligo-/Anurie, Ödeme, Dyspnoe, Übelkeit, Verwirrtheit, Bradykardie','EKG und Kalium (BGA) sofort bei Verdacht'],tx:['Hyperkaliämie nach Standard (Calcium, Insulin/Glukose, Salbutamol, Bicarbonat)','Lungenödem bei Anurie: Nitro, CPAP; Furosemid nur bei erhaltener Diurese; Dialyse/Ultrafiltration ist kausal','Postrenal: Blasenkatheter/suprapubische Ableitung','Volumenmangel: Kristalloide gezielt; Nephrotoxine absetzen (NSAR, ACE-Hemmer)','Zielklinik mit Dialyse/Nephrologie'],meds:['Calciumgluconat 10 % 10–20 ml bei EKG-Veränderungen','Furosemid 40–80 mg i.v. (nur bei Restdiurese)','Nitro-Spray 0,4–0,8 mg bei Lungenödem und RR > 100 mmHg'],cave:['Kein Zugang/Blutdruck am Shuntarm','Keine NSAR, Vorsicht bei Gadolinium/Kontrastmittel','Dialysepatient ohne Dialyse > 3 Tage = Hyperkaliämie-Risiko'],merke:['Anurie + Lungenödem: Dialyse, nicht noch mehr Furosemid','Immer EKG und Kalium bei Nierenversagen','Postrenal = Katheter'],ll:[['KDIGO Clinical Practice Guideline Acute Kidney Injury','https://kdigo.org/guidelines/acute-kidney-injury/']]},
{id:'tamponade',cat:'Kardiovaskulär',t:'Herzbeuteltamponade, Schrittmacher- und ICD-Probleme',s:'Beck-Trias, Perikardpunktion, Magnet-Funktion',def:'Obstruktiver Schock durch Perikarderguss; außerdem Fehlfunktionen implantierter Geräte (Schrittmacher, ICD).',dx:['**Beck-Trias:** Hypotonie, Halsvenenstauung, leise Herztöne; Tachykardie, Pulsus paradoxus','Ursachen: Trauma (stumpf/penetrierend), Aortendissektion, Infarktruptur, Tumor, Urämie, Perikarditis','Sono: Perikarderguss, Kompression des rechten Ventrikels','**ICD:** Schockabgabe, „elektrischer Sturm“ (≥ 3 Schocks/24 h); **Schrittmacher:** Synkope, Bradykardie bei Fehlfunktion, Schrittmacherspikes im EKG'],tx:['Tamponade: Volumen überbrücken, Katecholamine; Perikardpunktion (sonografisch, subxiphoidal) oder Notfallthorakotomie bei Trauma; Zielklinik herzchirurgisch','Reanimation Tamponade: Perikardiozentese/Thorakotomie als reversible Ursache (4H/4T)','**ICD-Magnet** auf das Gerät unterdrückt Schockabgabe (Therapie-Pause, keine Änderung des Pacing); Magnet **entfernen** = Therapie wieder aktiv','Schrittmacher-Magnet: asynchrone Stimulation (VOO/AOO) – Fixfrequenz, kann bei Eigenrhythmus konkurrieren','Elektrischer Sturm: Sedierung, Amiodaron, Betablocker, Klinik mit EP-Labor','Defibrillation bei Gerätepatient: Pads ≥ 8 cm vom Aggregat, anterior-posterior'],meds:['Amiodaron 150–300 mg i.v. bei elektrischem Sturm','Noradrenalin zur Kreislaufstabilisierung bei Tamponade','Midazolam zur Sedierung bei wiederholten Schocks'],cave:['Diuretika und Vasodilatatoren verschlimmern die Tamponade (Vorlast!)','Magnet am ICD nicht dauerhaft liegen lassen','Elektrokauter/MRT: Gerät vorher prüfen/umprogrammieren'],merke:['Hypotonie + Halsvenenstau + leise Herztöne = Tamponade','ICD-Magnet stoppt Schocks, aber nicht das Pacing','Vorlast bei Tamponade erhalten, nicht senken'],ll:[['ESC Perikarderkrankungen','https://www.escardio.org']]},
{id:'co_rauch',cat:'Toxikologie',t:'CO- und Rauchgasvergiftung (Zyanid)',s:'CO-Hb, 100 % O₂, Hydroxocobalamin',def:'Inhalation von Kohlenmonoxid und weiteren Rauchgasen (Zyanidwasserstoff); häufig bei Wohnungsbränden, defekten Heizungen und Grillgeräten.',dx:['Symptome: Kopfschmerz, Schwindel, Übelkeit, Verwirrtheit, Synkope, Krampf, Myokardischämie','**Pulsoxymeter falsch normal** (CO-Hb wird als O₂-Hb gelesen) → CO-Oximetrie/BGA (CO-Hb)','Raucher können CO-Hb bis ca. 10 % haben','Zyanidverdacht bei Rauchgas + Koma/Kreislaufstillstand + Laktat > 8 mmol/l','Begleitend: Inhalationstrauma (Ruß, Stridor, Heiserkeit)'],tx:['Eigenschutz, Brandort verlassen, Frischluft','**100 % O₂** über Reservoirmaske (HWZ CO ca. 4–5 h unter Raumluft, ca. 60–90 min unter 100 % O₂)','Intubation bei Bewusstlosigkeit/Inhalationstrauma; Beatmung mit FiO₂ 1,0','**Hydroxocobalamin 5 g i.v.** über 15 min bei Zyanid-Verdacht (Kinder 70 mg/kg), ggf. wiederholen','Hyperbare Oxygenierung (HBO) erwägen bei Bewusstlosigkeit, neurologischen Symptomen, Schwangerschaft, CO-Hb > 25 %','Giftnotruf einbeziehen; Zielklinik mit ggf. HBO-Zugang'],meds:['Sauerstoff 100 %, 10–15 l/min','Hydroxocobalamin 5 g (70 mg/kg bei Kindern)','Beatmung FiO₂ 1,0'],cave:['SpO₂ nicht vertrauen, Zyanose fehlt (kirschrote Haut ist selten)','Verzögerte neurologische Spätschäden bis 4 Wochen','Natriumnitrit/4-DMAP als Zyanid-Antidot verschlechtern den O₂-Transport (Met-Hb) – bei Rauchgas Hydroxocobalamin bevorzugen'],merke:['CO: Pulsoxymeter lügt, 100 % O₂ sofort','Rauchgas + Schock/Koma = Zyanid denken → Hydroxocobalamin','HBO bei neurologischen Zeichen, Schwangeren, hohem CO-Hb'],ll:[['Giftinformationszentrum Nord','https://www.giz-nord.de']]},
{id:'alkohol_drogen',cat:'Toxikologie',t:'Alkohol, Drogen & Opioid-Intoxikation',s:'Toxidrome, Naloxon, Entzugsdelir, Wernicke',def:'Intoxikationen und Entzugssyndrome durch Alkohol, Opioide, Stimulanzien (Kokain, Amphetamine), Cannabinoide, GHB und Benzodiazepine.',dx:['**Opioid-Toxidrom:** Miosis, Atemdepression, Koma; **sympathomimetisch:** Mydriasis, Tachykardie, Hypertonie, Hyperthermie, Schwitzen; **anticholinerg:** Mydriasis, trockene Haut, Delir; **cholinerg:** Miosis, Bronchorrhoe, Speichelfluss','Immer Blutzucker, EKG (QRS, QTc), Temperatur, Trauma ausschließen','Alkohol: Ethanol-Menge klinisch unzuverlässig, Hypoglykämie und Wernicke-Enzephalopathie beachten','Entzugsdelir: Tremor, Halluzinationen, Tachykardie, Krampf (2–4 Tage nach letztem Konsum)'],tx:['ABCDE; Atemwegssicherung bei GCS ≤ 8','**Naloxon** fraktioniert 0,04–0,1 mg i.v. titrieren bis Atmung ausreichend (nicht bis Wachheit), alternativ 0,4 mg i.m./nasal; Wirkdauer kürzer als Opioid → Überwachung','Stimulanzien: Benzodiazepine (Midazolam, Lorazepam) für Erregung, Krampf, Hypertonie; Kühlung','Alkoholentzug/-delir: Benzodiazepine, Flüssigkeit, **Thiamin 100–200 mg i.v. vor Glukose**','Methanol/Ethylenglykol: Fomepizol oder Ethanol als Antidot, Dialyse (Giftnotruf)','GHB: Atemwegsschutz, keine spezifische Antidotgabe','Giftinformationszentrum kontaktieren'],meds:['Naloxon 0,04–0,1 mg i.v. fraktioniert','Midazolam 2–5 mg i.v. / Lorazepam 1–2 mg i.v.','Thiamin 100–200 mg i.v.','Glukose 40 % 20–40 ml bei Hypoglykämie'],cave:['Naloxon-Überdosierung löst akuten Entzug, Lungenödem, Erregung aus','Kein Flumazenil bei Mischintoxikation mit Krampfneigung (Trizyklika)','Wernicke: Thiamin vor Glukose'],merke:['Naloxon titrieren auf Atmung, nicht auf Bewusstsein','Entzugsdelir ist lebensbedrohlich: Benzodiazepine + Thiamin','Immer BZ und EKG bei Intoxikation'],ll:[['Giftinformationszentrum Nord','https://www.giz-nord.de']]},
{id:'paracetamol_pilze',cat:'Toxikologie',t:'Paracetamol-, Pilz- und Medikamentenintoxikation',s:'Acetylcystein, Knollenblätterpilz, Betablocker, Trizyklika',def:'Häufige Vergiftungen mit spezifischer Therapie; Giftinformationszentren (GIZ) beraten rund um die Uhr (z. B. GIZ-Nord Göttingen 0551 19240, Bonn 0228 19240, Berlin 030 19240).',dx:['**Paracetamol:** anfangs symptomlos oder Übelkeit; Leberschaden nach 24–72 h; Rumack-Matthew-Nomogramm ab 4 h nach Ingestion; ab ca. 7,5 g (Erwachsene) / 150 mg/kg toxisch','**Knollenblätterpilz:** Latenz 6–24 h, dann Brechdurchfall, danach Leberversagen','**Betablocker/Ca-Antagonisten:** Bradykardie, Hypotonie, Hypoglykämie (Betablocker)','**Trizyklika:** QRS-Verbreiterung, Krampf, anticholinerges Syndrom','Digitalis: Bradykardie, Rhythmusstörungen, Sehstörungen (Gelbsehen)'],tx:['Aktivkohle 1 g/kg innerhalb 1–2 h bei Ingestion toxischer Dosen und erhaltenen Schutzreflexen','**Paracetamol:** Acetylcystein i.v. 150 mg/kg über 1 h, dann 50 mg/kg über 4 h, dann 100 mg/kg über 16 h','Knollenblätterpilz: Aktivkohle, Silibinin, Intensivstation, Lebertransplant-Zentrum; Pilzreste sichern','Betablocker: Glukagon 3–10 mg i.v., Katecholamine, Insulin-Hochdosis; Calciumantagonisten: Calcium, Insulin','Trizyklika: Natriumbicarbonat 1–2 mmol/kg bei QRS-Verbreiterung; Benzodiazepine bei Krampf','Digitalis: Digitalis-Antidot (Fab-Fragmente), Magnesium','Monitoring, Zugang, Klinikaufnahme zur Überwachung'],meds:['Aktivkohle 1 g/kg','Acetylcystein 150 mg/kg über 1 h','Glukagon 3–10 mg i.v.','Natriumbicarbonat 8,4 % 1–2 mmol/kg','Silibinin 20 mg/kg/Tag (Knollenblätterpilz)'],cave:['Keine induzierte Emesis, kein Salzwasser','Aktivkohle bei Bewusstseinsstörung/Ileus/ätzenden Substanzen kontraindiziert','Paracetamolspiegel nicht vor 4 h sinnvoll interpretierbar'],merke:['Paracetamol: Acetylcystein, je früher desto besser (≤ 8 h nach Einnahme)','Knollenblätterpilz: symptomfreies Intervall täuscht','Giftnotruf anrufen, Verpackung/Reste sichern'],ll:[['Giftinformationszentrum Nord','https://www.giz-nord.de']]},
{id:'wirbelsaeule',cat:'Trauma',t:'Wirbelsäulen-, Becken- und Extremitätentrauma',s:'Immobilisation, neurogener Schock, Beckenschlinge, Amputation',def:'Verletzungen des Stütz- und Bewegungsapparates mit Risiko für Rückenmarksschaden, Blutverlust und Gliedmaßenverlust.',dx:['Wirbelsäule: Schmerz, Fehlstellung, neurologische Ausfälle (Sensibilität, Motorik, Priapismus), **neurogener Schock** (Hypotonie + Bradykardie, warme Haut)','Becken: Instabilität nur **einmal** prüfen; Blutungsquelle (bis > 2 l)','Extremität: **DMS** (Durchblutung, Motorik, Sensibilität) vor und nach Maßnahmen; offene Frakturen; Kompartment-Zeichen (Schmerz, Spannung, Parästhesie)','Amputation: komplett/subtotal'],tx:['Immobilisation: Vakuummatratze, Schaufeltrage, HWS-Immobilisation nach Kriterien (NEXUS/Canadian C-Spine); **Log-Roll**','Becken: **Beckenschlinge** in Höhe der Trochanteren; Blutung kontrollieren, TXA','Grobe Fehlstellung mit fehlender Durchblutung: achsengerechte Reposition, Schienung, DMS-Kontrolle','Offene Fraktur: steriler Verband, Antibiotika (z. B. Cefuroxim 1,5 g), Analgesie','Amputation: Stumpf steril mit Druckverband, ggf. Tourniquet; **Amputat** in steriles Tuch, trockener Beutel, dieser in Eiswasser (nicht direkt auf Eis); Replantationszentrum','Analgesie: Esketamin/Fentanyl titriert; Neurogener Schock: Volumen, Noradrenalin','Zielklinik: Traumazentrum (überregional/regional/lokal nach TraumaNetzwerk DGU)'],meds:['Esketamin 0,125–0,25 mg/kg i.v. (Analgesie)','Fentanyl 0,05–0,1 mg i.v. titriert','Noradrenalin bei neurogenem Schock','Cefuroxim 1,5 g i.v. bei offener Fraktur'],cave:['Methylprednisolon beim Rückenmarkstrauma nicht mehr empfohlen','Becken nicht wiederholt komprimieren („Beckenwackeln“)','Amputat nie direkt auf Eis oder in Flüssigkeit legen','Kompartmentsyndrom: Fasziotomie, kein Hochlagern'],merke:['Neurogener Schock = Hypotonie + Bradykardie + warme Haut','Beckenschlinge auf Trochanterhöhe, nicht auf Beckenkamm','DMS vor und nach jeder Manipulation'],ll:[['S3-Leitlinie Polytrauma (AWMF 187-023)','https://register.awmf.org/de/leitlinien/detail/187-023'],['TraumaNetzwerk DGU','https://www.dgu-online.de']]}
