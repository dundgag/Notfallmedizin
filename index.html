{id:'urologie',cat:'Urologie, HNO & Augen',t:'Urologische Notfälle (Skrotum, Nierenkolik, Harnverhalt)',s:'Hodentorsion, Urosepsis, suprapubischer Katheter',def:'Akute Schmerz- und Obstruktionsnotfälle des Urogenitaltrakts; Hodentorsion ist ein zeitkritischer Notfall.',dx:['**Akutes Skrotum:** Hodentorsion (plötzlicher Schmerz, Hochstand, Kremasterreflex fehlt, Prehn-Zeichen negativ), Epididymitis (langsamer Beginn, Fieber, Prehn positiv)','Nierenkolik: wellenförmiger Flankenschmerz, Hämaturie, Erbrechen','**Fieber + Stein/Obstruktion = Urosepsis-Risiko**, urologischer Notfall','Harnverhalt: Schmerz, Unruhe, tastbare Blase'],tx:['Hodentorsion: sofortige Klinikzuweisung, Rettungsfenster ca. **6 h**; manuelle Detorsion nur als Überbrückung (Rotation nach außen, „Buch öffnen“)','Nierenkolik: NSAR (z. B. Diclofenac) oder Metamizol, ggf. Opioid; Butylscopolamin hat geringen Stellenwert','Obstruktion mit Infektion/Fieber: Antibiose (Ceftriaxon 2 g) und Entlastung (Stent/Nephrostomie) in der Klinik','Harnverhalt: transurethraler oder suprapubischer Katheter, bei Schwierigkeiten Klinik','Analgesie, Antiemese, Flüssigkeit'],meds:['Diclofenac 50–75 mg (NSAR) oder Metamizol 1–2 g i.v.','Fentanyl 0,05–0,1 mg i.v. bei starkem Schmerz','Ceftriaxon 2 g i.v. bei Fieber/Sepsis'],cave:['Hodenschmerz bei Kindern/Jugendlichen = Torsion bis zum Beweis des Gegenteils','Keine NSAR bei Niereninsuffizienz, Schwangerschaft','Kein Katheter bei V.a. Harnröhrenverletzung (Blut am Meatus nach Trauma)'],merke:['Skrotum akut + junger Patient: sofort Klinik, 6-Stunden-Fenster','Fieber + Kolik = Notfall (Urosepsis)'],ll:[['S2k-Leitlinie Urolithiasis (AWMF 043-025)','https://register.awmf.org/de/leitlinien/detail/043-025']]},
{id:'hno_auge',cat:'Urologie, HNO & Augen',t:'HNO-, Augen- und Zahnnotfälle',s:'Epistaxis, Fremdkörper, Verätzung, Zahntrauma',def:'Häufige Notfälle mit Blutung, Atemwegsgefährdung oder Seh-/Funktionsverlust.',dx:['Epistaxis: anterior (Locus Kiesselbach) meist harmlos; posterior mit Blutung in den Rachen','Nachblutung nach Tonsillektomie: kann akut lebensbedrohlich sein (Aspiration, Schock)','Auge: Verätzung/Verbrennung, Perforationsverdacht, Zentralarterienverschluss (schmerzloser Visusverlust), akutes Winkelblockglaukom (rotes, hartes Auge, Übelkeit)','Zahnunfall: Avulsion, Kieferfraktur'],tx:['Epistaxis: Kopf nach vorn, Nasenflügel 10–15 min komprimieren, Kühlung Nacken, ggf. TXA topisch/Nasentampon; posterior → Klinik','Tonsillen-Nachblutung: Atemweg sichern, absaugen, Volumen, Zugang, HNO-Klinik; Tranexamsäure bei Blutung','Ätzmittel-Auge: **sofort spülen** (Wasser/Ringer, 15–30 min), pH kontrollieren, Augenklinik; Kein Druckverband bei Perforation, steriler Schutzverband','Zentralarterienverschluss/Akutes Glaukom: sofort Augenklinik (Zeitfenster Stunden)','Avulsierter Zahn: nicht abwaschen, an der Krone halten, in Zahnrettungsbox/H-Milch, ≤ 30 min replantieren (zahnärztlich)','Fremdkörper Ohr/Nase: Klinik, keine Manipulation im Einsatz'],meds:['Tranexamsäure 1 g i.v. bei starker Blutung','Ringer-Lösung/NaCl 0,9 % zur Augenspülung','Analgesie: Paracetamol, Metamizol'],cave:['Bei Blutung aus dem Mund/Rachen: Atemweg zuerst, Aspirationsgefahr','Kein Druck auf perforiertes Auge','Epistaxis + Antikoagulation: Pausieren/Antagonisierung klären'],merke:['Augenverätzung: spülen, spülen, spülen','Zahn nicht abwaschen, nicht trocken lagern','Nachblutung nach Tonsillektomie = Atemwegsnotfall'],ll:[['Leitlinien im AWMF-Register suchen (HNO)','https://register.awmf.org']]},
{id:'meningitis',cat:'Neurologie',t:'Meningitis, Enzephalitis & ZNS-Infektionen',s:'Trias, Dexamethason, Ceftriaxon, Isolation',def:'Bakterielle Meningitis ist ein hochzeitkritischer Notfall (Letalität unbehandelt nahezu 100 %); Enzephalitis (v. a. HSV) braucht sofortiges Aciclovir.',dx:['Klassische Trias: Fieber, Nackensteifigkeit, Bewusstseinsstörung (nicht immer vollständig)','Kopfschmerz, Photophobie, Krampf, fokale Ausfälle; **Petechien** = Meningokokken-Sepsis (Waterhouse-Friderichsen)','Erwachsene: Pneumokokken, Meningokokken; ältere/immunsupprimierte: Listerien; Neugeborene: B-Streptokokken, E. coli','Liquorpunktion in der Klinik; **Antibiose nicht verzögern**, CT vor LP nur bei Fokal-/Bewusstseinsstörung'],tx:['**Ceftriaxon 2 g i.v.** prähospital/sofort bei Verdacht (Kinder 100 mg/kg)','**Dexamethason 10 mg i.v.** (vor oder mit der ersten Antibiotikagabe) bei bakterieller Meningitis','> 60 Jahre/immunsupprimiert: zusätzlich Ampicillin 2 g (Listerien)','V. a. Enzephalitis: Aciclovir 10 mg/kg i.v.','Sepsis-Therapie (Volumen, Noradrenalin), Krampftherapie','**Isolation** (Tröpfchen) 24 h nach Antibiotikastart bei Meningokokken; Postexpositionsprophylaxe Kontaktpersonen; Meldepflicht (IfSG)'],meds:['Ceftriaxon 2 g i.v. (Kinder 100 mg/kg)','Dexamethason 10 mg i.v.','Ampicillin 2 g i.v. (> 60 J)','Aciclovir 10 mg/kg i.v.'],cave:['Keine Verzögerung für CT/LP','Kind: Fontanelle gespannt, Berührungsempfindlichkeit, Trinkschwäche, Petechien','Eigenschutz: Mundschutz bei Meningokokken-Verdacht'],merke:['Antibiotikum vor Liquor, wenn LP verzögert','Petechien + Fieber = Meningokokken, sofort Ceftriaxon','Dexamethason zeitgleich zur ersten Antibiotikagabe'],ll:[['S2k-Leitlinie Ambulant erworbene bakterielle Meningoenzephalitis (AWMF 030-089)','https://register.awmf.org/de/leitlinien/detail/030-089']]},
{id:'neuromusk',cat:'Neurologie',t:'Guillain-Barré-Syndrom & myasthene Krise',s:'Atemversagen, Succinylcholin, Medikamente vermeiden',def:'Neuromuskuläre Notfälle mit drohendem Atemversagen.',dx:['**Guillain-Barré:** aufsteigende schlaffe Lähmung, Areflexie, nach Infekt; autonome Instabilität (Rhythmusstörungen, RR-Schwankungen)','**Myasthene Krise:** belastungsabhängige Schwäche, Ptosis, Dysphagie, Atemmuskelschwäche; Auslöser: Infekt, Medikamente, OP','Atemfunktion: Vitalkapazität < 20 ml/kg oder Abfall ≥ 30 % = Intubationsschwelle; Schluckstörung; Aspiration','Differenzial cholinerge Krise (Überdosierung Cholinesterasehemmer): Miosis, Hypersalivation, Bradykardie'],tx:['Atemwegssicherung frühzeitig (Intubation bei respiratorischer Insuffizienz, nicht abwarten bis Hyperkapnie)','**Succinylcholin kontraindiziert** (Hyperkaliämie bei Denervierung); bei myasthener Krise Rocuronium **sehr niedrig dosieren** (hohe Empfindlichkeit)','GBS: Immunglobuline i.v. oder Plasmapherese in der Klinik; Intensivstation','Myasthene Krise: Auslöser beseitigen, Immunglobuline oder Plasmapherese, Neurologie/Intensiv','Beobachtung der Atmung, Monitoring EKG (autonome Dysregulation)'],meds:['Rocuronium reduziert dosiert bei MG','Immunglobuline 0,4 g/kg/Tag über 5 Tage (Klinik)'],cave:['Medikamente, die eine MG verschlechtern: Aminoglykoside, Makrolide, Fluorchinolone, Magnesium, Betablocker, Muskelrelaxanzien','Succinylcholin bei GBS: Hyperkaliämie, Herzstillstand','Pulsoxymetrie spät – Atemmuskelschwäche früher klinisch erfassen'],merke:['GBS: aufsteigend + Areflexie + Atemkontrolle','Kein Succinylcholin bei neuromuskulären Erkrankungen','MG-Krise: Intubationsschwelle früh, Relaxanzien vorsichtig'],ll:[['S2e-Leitlinie Therapie immunvermittelter Neuropathien, u. a. GBS (AWMF 030-130)','https://register.awmf.org/de/leitlinien/detail/030-130']]},
{id:'kinder_atemweg',cat:'Pädiatrie',t:'Pseudokrupp, Epiglottitis & Fremdkörperaspiration',s:'Stridor, Steroid, Adrenalin inhalativ, Rückenschläge',def:'Häufigste obere Atemwegsnotfälle im Kindesalter.',dx:['**Pseudokrupp (Laryngotracheitis):** bellender Husten, inspiratorischer Stridor, Heiserkeit, 6 Monate–5 Jahre, nachts; Schweregrad nach Westley (Stridor in Ruhe, Einziehungen)','**Epiglottitis** (selten, Hib-Impfung): hohes Fieber, Speichelfluss, kloßige Sprache, Kind sitzt vornübergebeugt, kein Husten','**Fremdkörperaspiration:** plötzlicher Husten/Würgen beim Essen oder Spielen; Stridor oder Aphonie','Pulsoxymetrie, Atemarbeit, Vigilanz'],tx:['Pseudokrupp: ruhig lassen (Eltern), **Prednison/Prednisolon 100 mg rektal** (oder Dexamethason 0,15 mg/kg p.o./i.v.); bei Stridor in Ruhe **Adrenalin inhalativ** 4–5 ml unverdünnt (Epinephrin 1 mg/ml); O₂','Epiglottitis: **keine Racheninspektion, kein Hinlegen, keine Belastung**; Sauerstoff-Vorlage, Intubation durch erfahrenen Anästhesisten/HNO in Intubationsbereitschaft; Ceftriaxon','Fremdkörper (Kind > 1 Jahr): Husten fördern; bei insuffizientem Husten 5 Rückenschläge, dann Heimlich/Oberbauchkompression; Säugling: 5 Rückenschläge + 5 Thoraxkompressionen','Bewusstlos: CPR, Atemwegsinspektion, Fremdkörper unter Sicht entfernen (Magill-Zange)','Zielklinik mit Kinderintensiv/Bronchoskopie'],meds:['Prednisolon 100 mg rektal oder Dexamethason 0,15 mg/kg','Adrenalin 1 mg/ml inhalativ 4–5 ml','Ceftriaxon 50–100 mg/kg (Epiglottitis)'],cave:['Keine Racheninspektion bei Epiglottitis-Verdacht','Kein Blindes Auswischen des Fremdkörpers','Keine Sedierung bei drohender Atemwegsobstruktion ohne Intubationsbereitschaft'],merke:['Pseudokrupp: Kortikoid + Adrenalin inhalativ bei Ruhestridor','Epiglottitis: Kind nicht anfassen, Atemweg in Bereitschaft','Säugling: 5 Rückenschläge + 5 Thoraxkompressionen'],ll:[['ERC Guidelines 2025 – Paediatric Life Support','https://cprguidelines.eu']]},
{id:'fieberkrampf',cat:'Pädiatrie',t:'Fieberkrampf & Säuglingsnotfälle',s:'Midazolam bukkal, Diazepam rektal, SIDS/BRUE',def:'Fieberkrampf: epileptischer Anfall im Rahmen eines Infekts bei Kindern zwischen 6 Monaten und 5 Jahren ohne ZNS-Infektion.',dx:['**Einfacher Fieberkrampf:** generalisiert, < 15 min, einmalig in 24 h','Komplizierter Fieberkrampf: fokal, > 15 min oder Wiederholung → Klinik','Differenzial: Meningitis, Hypoglykämie, Elektrolytstörung, Intoxikation','BRUE (kurzzeitige Atemstörung, Zyanose, Hypotonie) und Fieber < 3 Monate: immer Klinikabklärung'],tx:['Meist selbstlimitierend < 5 min: Schutz vor Verletzung, Seitenlage, Temperatur messen','**Krampf > 5 min:** Midazolam bukkal 0,3–0,5 mg/kg (max. 10 mg) oder nasal 0,2 mg/kg; Diazepam rektal 5 mg (< 15 kg), 10 mg (> 15 kg); i.v.: Midazolam 0,1 mg/kg oder Lorazepam 0,1 mg/kg','Blutzucker kontrollieren, Glukose 10 % 2–4 ml/kg bei Hypoglykämie','Fiebersenkung nicht zur Krampfprophylaxe nötig','Klinik: Alter < 12 Monate, komplizierter Verlauf, V. a. Meningitis, Nackensteife'],meds:['Midazolam bukkal 0,3–0,5 mg/kg','Diazepam rektal 5/10 mg','Lorazepam 0,1 mg/kg i.v.','Glukose 10 % 2–4 ml/kg'],cave:['Atemdepression nach Benzodiazepinen – Monitoring','Fieber < 3 Monate: kein „einfaches“ Fieber, immer Sepsis/Meningitis ausschließen','Elternberatung: Wiederholungsrisiko ca. 30 %'],merke:['Krampf > 5 min = Benzodiazepin','Immer BZ messen','Säugling < 3 Monate mit Fieber = Klinik'],ll:[['S1-Leitlinie Fieberkrämpfe im Kindesalter (AWMF 022-005, in Überarbeitung)','https://register.awmf.org/de/leitlinien/detail/022-005']]},
{id:'gewalt',cat:'Psychiatrie & Recht',t:'Kindesmisshandlung & häusliche Gewalt',s:'Warnzeichen, Dokumentation, KKG, Hilfetelefone',def:'Verdacht auf Gewalt erfordert sensible Beobachtung, sorgfältige Dokumentation und Weiterleitung an geeignete Stellen.',dx:['Kind: Inkonsistente Anamnese, verzögerte Vorstellung, Verletzungen an untypischen Stellen (Rücken, Ohr, Oberarm, Genital), Hämatome verschiedenen Alters, Schütteltrauma','Häusliche Gewalt: wiederholte Verletzungen, Angst, Kontrolle durch Partner, Begründungen passen nicht','Vernachlässigung: Hygiene, Ernährung, Aufsicht','Rechtsmedizinische Dokumentation: Verletzungen, Fotos (mit Einwilligung), Zeitpunkt, Zitate'],tx:['Sicherheit des Patienten zuerst; Kind nicht allein bei Gefahr lassen; wertfrei fragen','**Dokumentation objektiv und detailliert** (Lokalisation, Größe, Farbe, Aussage in Zitaten)','Weitergabe: **KKG § 4** (Befugnis zur Information des Jugendamts); Medizinische Kinderschutzhotline 0800 19 210 00','Hilfetelefon „Gewalt gegen Frauen“ 116 016, Frauenhäuser; Gewaltschutzgesetz; vertrauliche Spurensicherung','Transport in geeignete Klinik (Kinderschutzgruppe); Polizei bei akuter Gefährdung'],meds:[],cave:['Eigene Interpretationen vermeiden, Tatbestände nicht ermitteln','Schweigepflicht nur mit Rechtfertigung durchbrechen (KKG, Notstand)','Schütteltrauma: Atemstörungen, Krampf, Erbrechen bei Säuglingen – bildgebend abklären'],merke:['Beobachten, dokumentieren, weiterleiten – nicht ermitteln','KKG § 4: stufenweises Vorgehen, im Notfall sofort Jugendamt/Polizei','Kinderschutzhotline 0800 19 210 00'],ll:[['Medizinische Kinderschutzhotline','https://www.kinderschutzhotline.de'],['Hilfetelefon Gewalt gegen Frauen','https://www.hilfetelefon.de']]},
{id:'schwanger_trauma',cat:'Geburtshilfe',t:'Trauma und Reanimation in der Schwangerschaft',s:'Linksseitenlage, Uterusverlagerung, Notsectio',def:'Mütterliche Stabilisierung sichert das Überleben des Fetus; ab ca. 20. SSW komprimiert der Uterus die V. cava.',dx:['Vena-cava-Kompressionssyndrom ab ca. 20 SSW: Hypotonie in Rückenlage','Trauma: Plazentaablösung (Schmerz, vaginale Blutung, harter Uterus), Uterusruptur, fetomaternale Transfusion','Hypotonie, Tachykardie erst spät (Blutvolumen +40 %)','Reanimation: reversible Ursachen (Blutung, Eklampsie, Lungenembolie, Fruchtwasserembolie, Anästhesiekomplikationen)'],tx:['**Manuelle Uterusverlagerung nach links** oder 15–30° Linksseitenlage (Keil)','Stabilisierung der Mutter: O₂, Volumen, TXA bei Blutung','**Reanimation:** Standard-CPR, Defibrillation unverändert, Uterusverlagerung; **Notsectio** ab 4 min ohne ROSC (Entbindung ca. 5 min nach Stillstand, Ziel < 5 min)','Rh-negativ: Anti-D-Prophylaxe nach Trauma','Zielklinik mit Geburtshilfe/Neonatologie, frühe Voranmeldung','Neonatale Reanimation vorbereiten (NLS)'],meds:['Tranexamsäure 1 g i.v. bei Blutung','Anti-D-Immunglobulin 300 µg (Rh-neg.)','Magnesium 4–6 g i.v. bei Eklampsie'],cave:['Medikamente und Strahlung: Mutter-Nutzen vor Fetusrisiko','Keine Verzögerung der Reanimation wegen Schwangerschaft','Bauchtrauma: Plazentaablösung auch bei geringem Trauma möglich'],merke:['Mutter zuerst stabilisieren, Uterus nach links','Notsectio nach 4 min ohne ROSC','Anti-D bei Rh-negativen Frauen nach Trauma'],ll:[['ERC Guidelines 2025 – Besondere Umstände','https://cprguidelines.eu']]},
{id:'palliativ',cat:'Psychiatrie & Recht',t:'Palliative Notfälle & Therapiezieländerung',s:'Atemnot, Schmerz, terminale Unruhe, Notfallbogen',def:'Krisen bei Patienten mit fortgeschrittener, nicht heilbarer Erkrankung; Ziel ist Symptomkontrolle und Orientierung am Patientenwillen.',dx:['Häufige Krisen: Dyspnoe, Schmerz, Delir, Übelkeit, Blutung, terminales Rasseln','Therapieziel klären: Patientenverfügung, Vorsorgevollmacht, Notfallbogen/ReSPECT, behandelnder Arzt, SAPV-Team','Prognose, Wille, Umfeld (Angehörige) erfassen'],tx:['Dyspnoe: Oberkörper hoch, O₂ nur bei Hypoxie, **Morphin 2,5–5 mg i.v.** (oder s.c.), ggf. Midazolam 2,5 mg','Schmerz: Opioid titriert, Begleitmedikation','Terminales Rasseln: Butylscopolamin 20 mg s.c./i.v., Lagerung','Delir/Unruhe: Haloperidol 0,5–2 mg, Midazolam','Blutung: dunkle Tücher, Midazolam bei Palliativsituation','Kontakt zu SAPV/Hausarzt, Therapiebegrenzung dokumentieren; Angehörigen begleiten'],meds:['Morphin 2,5–5 mg i.v./s.c.','Midazolam 2,5–5 mg i.v./s.c.','Haloperidol 0,5–2 mg','Butylscopolamin 20 mg'],cave:['Reanimation bei dokumentierter Therapiebegrenzung/DNAR nicht beginnen; Unklarheit: Reanimation beginnen und sofort klären','Keine Verzögerung der Symptomkontrolle wegen Rechtsunsicherheit','Angehörige einbeziehen, aber Patientenwillen entscheidet'],merke:['Symptomkontrolle vor Diagnostik','Therapieziel erfragen und dokumentieren','Morphin gegen Atemnot ist indiziert'],ll:[['S3-Leitlinie Palliativmedizin (AWMF 128-001OL; onkologisch, Symptomkontrolle übertragbar)','https://register.awmf.org/de/leitlinien/detail/128-001OL']]},
{id:'org_system',cat:'Organisation',t:'Rettungsdienstsystem, Leitstelle & Zielklinik',s:'Notarzt-Indikation, Telenotarzt, Netzwerke, IVENA',def:'Rettungsdienst ist Ländersache; Leitstellen disponieren nach standardisierter Notrufabfrage; Zielklinik nach Netzwerken (Trauma, Stroke, Chest Pain Unit).',dx:['Notrufnummer **112**; Krankentransport 116 117 (ärztlicher Bereitschaftsdienst)','Notarzt-Indikationskatalog (BÄK): lebensbedrohliche Situation, Bewusstlosigkeit, schwere Atemnot, Schock etc.','Notfallsanitäter: Heilkundeausübung nach § 2a NotSanG, **SAA/Algorithmen** (Pyramidenprozess) des Ärztlichen Leiters Rettungsdienst (ÄLRD)','Telenotarzt: telemedizinische Unterstützung, Delegation, Medikamentengabe nach Algorithmus','Zielklinik-Auswahl: **TraumaNetzwerk DGU** (überregional/regional/lokal), Stroke Unit, Chest Pain Unit, Verbrennungszentrum, Perinatalzentrum, Schockraum','Hubschrauber: RTH (Tageslicht), ITH für Interhospitaltransfer'],tx:['Voranmeldung nach Schema; **IVENA** zeigt Kapazitäten','**Schockraum-Alarm** nach Kriterien (RR < 90, GCS < 9, Intubation etc.)','Übergabe nach **ISBAR**','Qualitätssicherung: Dokumentation, Einsatznachbesprechung, Fehlerkultur (CIRS)','Rendezvous-System: NEF und RTW treffen sich getrennt'],meds:[],cave:['Nächste geeignete, nicht nächste Klinik','Voranmeldung verbessert Behandlungszeit','Delegation nur im Rahmen der Qualifikation und SAA'],merke:['Richtige Klinik, nicht nächste Klinik','ISBAR für Übergabe','Nach Standard handeln, bei Abweichung begründen'],ll:[['Bundesärztekammer Notarzt-Indikationskatalog','https://www.bundesaerztekammer.de'],['TraumaNetzwerk DGU','https://www.dgu-online.de']]},
{id:'crm_transfer',cat:'Organisation',t:'CRM, Interhospitaltransfer & Hygiene',s:'Crew Resource Management, Verlegung, Infektionsschutz',def:'Nicht-technische Fertigkeiten und Transportorganisation verbessern Sicherheit; Hygiene schützt Patienten und Team.',dx:['**CRM:** Kommunikation (Closed Loop), Situationsbewusstsein, Führung/Teamarbeit, Entscheidungsfindung, Ressourcenmanagement','Interhospitaltransfer: Indikation (höhere Versorgungsstufe), Stabilität, Transportmittel (ITW/ITH), Arzt-zu-Arzt-Übergabe','Hygiene: Händedesinfektion (5 Momente), persönliche Schutzausrüstung, Fahrzeugdesinfektion','Meldepflichtige Erkrankungen (IfSG): z. B. Meningokokken, Tuberkulose, Masern'],tx:['Closed-Loop-Kommunikation, klare Rollenverteilung, „Speak up“','Vor Transfer: Stabilisieren, Zugang/Atemweg sichern, Dokumente/Bildgebung mitgeben, Zielklinik bestätigen','Intensivtransport: ärztliche Begleitung, Monitoring, Beatmungsgerät, Spritzenpumpen, Notfallmedikamente','Isolation: MRSA/ESBL Kontaktisolation, Tröpfchen bei Meningokokken/Influenza, Aerosol bei Tbc/Masern (FFP2)','Nadelstichverletzung: ausbluten lassen, desinfizieren, Meldung D-Arzt, PEP prüfen','Nachbesprechung (Debriefing), CIRS-Meldung'],meds:[],cave:['Unkontrollierte Stressbelastung: Einsatznachsorge (PSNV)','Verlegung ohne Stabilisierung vermeiden','Keine Verwechslung bei Übergabe: ISBAR/SBAR'],merke:['CRM: Kommunikation, Führung, Situationsbewusstsein','Interhospitaltransfer: Stabilisieren vor Transport','Nadelstich: sofort melden'],ll:[['DIVI Empfehlungen Interhospitaltransfer','https://www.divi.de']]}

["Fallbeispiele","Fall: 30-J., Status epilepticus, Anfall seit 10 min. Medikamente?","Midazolam i.m. 10 mg (> 40 kg) oder Lorazepam 0,1 mg/kg i.v.; bei Persistenz Levetiracetam/Valproat; BZ prüfen, Atemweg."],
["Fallbeispiele","Fall: Fahrradunfall ohne Helm, GCS 7, Pupille links weit. Maßnahmen?","Schweres SHT: Intubation, Normoxie/Normokapnie, RR syst. > 110, Oberkörper 30°, bei Einklemmung hyperton NaCl, Neurochirurgie/Traumazentrum."],
["Fallbeispiele","Fall: 75-J., Fieber, RR 80/45, Atemfrequenz 28, GCS 13, Hautmottling. Handeln?","Septischer Schock: Sauerstoff, Kristalloide 30 ml/kg, Noradrenalin bei fehlender Stabilisierung, Antibiotikum innerhalb 1 h, Laktat, Intensivklinik."],
["Fallbeispiele","Fall: 8-J. Typ-1-Diabetes, Krampf, BZ 32 mg/dl. Therapie?","Hypoglykämie: Glukose 10 % 2–4 ml/kg i.v. (Erw. G40 25–50 ml), alternativ Glukagon 1 mg i.m.; BZ kontrollieren, Ursache klären."],
["Fallbeispiele","Fall: Verpuffung, 35-J., Verbrennung Rumpf/Arme, Ruß im Mund, Heiserkeit. Vorgehen?","Verbrennung + Inhalationstrauma: Atemweg früh sichern, Kühlen (20 min, nicht Hypothermie), Analgesie, Volumen (Parkland), Brandverletztenzentrum, Zyanid/CO bedenken."],
["Fallbeispiele","Fall: Messerstich Thorax, Dyspnoe, Halsvenenstau, Atemgeräusch rechts aufgehoben, RR 70/40. Maßnahme?","Spannungspneumothorax: sofortige Entlastung (Nadel/Thorakostomie 4./5. ICR vordere/mittlere Axillarlinie), O₂, dann Drainage."],
["Fallbeispiele","Fall: Wanderer, 32 °C Kerntemperatur, Zittern fehlt, schläfrig. Maßnahmen?","Moderate Hypothermie: horizontal, schonend bewegen, warm einpacken, Wärmeluft aktiv; keine intensive Bewegung (Kammerflimmern); Klinik, bei Kreislaufstillstand ECLS."],
["Fallbeispiele","Fall: Marathonläufer, Körpertemperatur 41,5 °C, GCS 9. Therapie?","Hitzschlag: aktive Kühlung (Kaltwasserimmersion, Eispacks), Volumen, Atemweg/Krampf behandeln, Klinik; Antipyretika wirkungslos."],
["Fallbeispiele","Fall: 28-J., 34. SSW, RR 175/110, Kopfschmerz, Sehstörung. Maßnahmen?","Präeklampsie schwer: Magnesium 4–6 g i.v. über 15–20 min, dann 1–2 g/h; Blutdruck senken (Urapidil, Nifedipin), Geburtshilfe-Klinik, Antikonvulsiva bei Eklampsie."],
["Fallbeispiele","Fall: Geburt zu Hause, Plazenta geboren, starker Blutverlust. Therapie?","Postpartale Blutung: Uterusmassage, Oxytocin 3–5 IE langsam i.v., TXA 1 g, Volumen/Blutprodukte, Klinik; bei Atonie Prostaglandin in der Klinik."],
["Fallbeispiele","Fall: 22-J. mit Suizidabsicht, wirkt ruhig, verweigert Klinik. Vorgehen?","Einwilligungsfähigkeit prüfen; bei akuter Eigengefährdung Unterbringung nach PsychKG (Polizei/Ordnungsamt/Amtsarzt), Begleitung nicht allein lassen, dokumentieren."],
["Fallbeispiele","Fall: Polytrauma, GCS 6, Aspirationsgefahr, RR 85/50. Wie narkotisieren?","Prähospitale RSI: Präoxygenierung, Etomidat oder Ketamin (dosisreduziert bei Schock), Rocuronium 1 mg/kg, in-line Stabilisierung, Videolaryngoskopie, Notfallalgorithmus (Cormack/Bougie)."],
["Fallbeispiele","Fall: Busunfall, 20 Verletzte, 3 Rettungsmittel. Erste Maßnahmen?","MANV: Lagemeldung, Einsatzleitung, Sichtung (z. B. mSTaRT), Behandlungsplatz, Transportprioritäten; zuerst Atemweg/Blutungskontrolle bei Rot."],
["Fallbeispiele","Fall: 4-J., bewusstlos, keine normale Atmung. Reanimation?","PLS: 5 initiale Beatmungen, dann 15:2, Frequenz 100–120/min, Kompressionstiefe 1/3 Thoraxdurchmesser; Adrenalin 10 µg/kg alle 3–5 min, Defibrillation 4 J/kg."],
["Fallbeispiele","Fall: Neugeborenes nach Geburt blass, Atemantrieb fehlt, HF 70/min. Vorgehen?","NLS: abtrocknen, wärmen, Atemweg öffnen, 5 Beatmungen mit Raumluft/21–30 % O₂; HF < 60 trotz Beatmung: Thoraxkompressionen 3:1, Adrenalin 10–30 µg/kg."],
["Fallbeispiele","Fall: 82-J., Synkope, HF 32/min, RR 70/40, AV-Block III. Therapie?","Instabile Bradykardie: Atropin 0,5 mg (kann bei infranodalem Block versagen), dann transkutanes Pacing oder Adrenalin/Noradrenalin-Perfusor; Klinik mit Schrittmacher."],
["Fallbeispiele","Fall: 55-J., Palpitationen, HF 180 breit, RR 75/40, Bewusstseinstrübung. Therapie?","Instabile Tachykardie: synchronisierte Kardioversion (120–150 J biphasisch), Analgosedierung; bei Rezidiv Amiodaron 300 mg."],
["Fallbeispiele","Fall: 68-J., Dyspnoe, Schaum vor dem Mund, RR 180/100, Rasselgeräusche. Therapie?","Kardiales Lungenödem: Oberkörper hoch, Nitro 0,8 mg s.l./Spray (bei RR > 100), Furosemid 40 mg, CPAP/NIV, O₂, Monitoring, Klinik."],
["Fallbeispiele","Fall: 50-J., Rückenschmerz reißend zwischen Schulterblättern, RR-Differenz Arme. Verdacht?","Aortendissektion: Schmerz- und Blutdrucktherapie (Zielwert systolisch 100–120, Herzfrequenz 60–80) mit Betablocker/Urapidil, schnellste Klinikanmeldung (Gefäßchirurgie/CT)."],
["Fallbeispiele","Fall: Taucher nach schnellem Aufstieg, Schwindel, Parästhesien, Atemnot. Verdacht?","Dekompressionskrankheit/Gasembolie: 100 % O₂, flach lagern, Flüssigkeit, Kontakt Druckkammer/Giftnotruf, keine Rekompression im Wasser; Transport zur Druckkammer."],
["Fallbeispiele","Fall: Leiche mit Totenflecken, Totenstarre, Fäulnis. Was ist zu tun?","Todesfeststellung (sichere Todeszeichen), vollständige Leichenschau (unbekleidet), Todesart natürlich/nicht natürlich/ungeklärt, bei nicht natürlich Polizei; Dokumentation."]
]);

<script>/* Typische Prüfungsfragen je Thema: window.EXAMQ[topicId] = [[Frage, Antwort], ...] */
window.EXAMQ={
als:[
["Wie läuft der ALS-Algorithmus bei VF/pulsloser VT ab?","Rhythmusanalyse → Schock (1×) → sofort 2 min CPR → nach 3. Schock Adrenalin 1 mg + Amiodaron 300 mg; Adrenalin danach alle 3–5 min, Amiodaron 150 mg nach 5. Schock; 4H/4T behandeln."],
["Qualitätsmerkmale der Thoraxkompression nach ERC?","Mitte Brustkorb, 5–6 cm Tiefe, 100–120/min, vollständige Entlastung, Unterbrechungen minimal (< 5 s), Kompression:Beatmung 30:2 ohne Atemweg."],
["Wann Adrenalin bei nicht schockbarem Rhythmus?","So früh wie möglich (sofort nach Gefäßzugang), dann alle 3–5 min."]],
spezial:[
["Welche Besonderheiten gelten bei Reanimation nach Ertrinken?","Initial 5 Beatmungen, Hypoxie ist Ursache; sonst Standard-ALS; Hypothermie bedenken, Wasser nicht ablaufen lassen."],
["Wann ECLS/eCPR erwägen?","Therapierefraktärer Kreislaufstillstand mit potenziell reversibler Ursache (Hypothermie, Lungenembolie, Intoxikation) in geeigneten Zentren/Programmen."]],
postrea:[
["Zielwerte in der Postreanimationsbehandlung?","SpO₂ 94–98 %, PaCO₂ normal (35–45 mmHg), MAP ≥ 65 mmHg, Normoglykämie, Temperaturkontrolle (Fieber vermeiden, ≤ 37,5 °C)."],
["Welche Diagnostik nach ROSC?","12-Kanal-EKG (STEMI → PCI), BGA, Echo, Zielklinik mit Herzkatheter und Intensivstation, Ursache suchen."]],
plsrea:[
["Reanimationsablauf beim Kind (PLS)?","5 initiale Beatmungen, dann 15:2; Frequenz 100–120/min; Tiefe ca. 1/3 Thorax; Adrenalin 10 µg/kg alle 3–5 min; Schock 4 J/kg."],
["Häufigste Ursache eines Kreislaufstillstands beim Kind?","Hypoxie (respiratorisch/Asphyxie), seltener primär kardial."]],
nls:[
["Erste Schritte der Neugeborenenversorgung?","Abtrocknen, wärmen, Atemweg frei, Stimulation; bei Apnoe/HF < 100: 5 Beatmungen mit Raumluft/21–30 % O₂; HF < 60 → Thoraxkompressionen 3:1."],
["Wann Adrenalin beim Neugeborenen?","HF < 60/min trotz effektiver Beatmung und Thoraxkompression: 10–30 µg/kg i.v./i.o."]],
acs:[
["Therapie beim STEMI?","ASS 150–300 mg, Heparin, Analgesie, Reperfusion: primäre PCI (Ziel Door-to-Balloon/FMC-to-Device ≤ 90 min bzw. ≤ 120 min), sonst Lyse (< 10 min Entscheidungsziel)."],
["Warum bei inferiorem STEMI Nitro vorsichtig?","Mögliche RV-Beteiligung: vorlastabhängig, Nitro → Hypotonie; V4R ableiten, Volumen."],
["Ab wann gilt ein STEMI im EKG?","ST-Hebung ≥ 0,1 mV in ≥ 2 benachbarten Ableitungen (V2–V3: ≥ 0,2 mV bei Männern ≥ 40 J.) oder neuer LSB mit Klinik."]],
akutHI:[
["Therapie des kardialen Lungenödems?","Oberkörper hoch, O₂, Nitro (RR > 100 mmHg), Furosemid, CPAP/NIV, ggf. Morphin vorsichtig; kardiogener Schock: Noradrenalin/Dobutamin."],
["Definition kardiogener Schock?","Hypotonie (syst. < 90 mmHg) trotz Volumen mit Zeichen der Hypoperfusion (Laktat, Oligurie, kalte Haut)."]],
tachy:[
["Vorgehen bei instabiler Tachykardie?","Synchronisierte Kardioversion (VT/VHF 120–150 J biphasisch, Vorhofflattern/SVT 70–120 J), Analgosedierung; bei Rezidiv Amiodaron 300 mg."],
["Therapie der stabilen SVT?","Vagale Manöver (modifizierter Valsalva), dann Adenosin 6 mg → 12 mg schnell i.v.; Verapamil/Betablocker alternativ."]],
brady:[
["Stufenschema der instabilen Bradykardie?","Atropin 0,5 mg i.v. (max. 3 mg), dann Adrenalin/Dopamin-Perfusor oder transkutanes Pacing; bei AV-Block III/Mobitz 2 Atropin oft wirkungslos."],
["Wann Atropin kontraindiziert/unwirksam?","Infranodaler Block, nach Herztransplantation (denerviert), Engwinkelglaukom."]],
hypert:[
["Zielwerte bei Aortendissektion?","Systolisch 100–120 mmHg, HF 60–80/min; Betablocker (Esmolol/Metoprolol) + Urapidil/Nitro; Typ A → Herzchirurgie."],
["Was ist hypertensive Krise vs. Notfall?","Notfall: RR-Anstieg mit Endorganschaden (Enzephalopathie, ACS, Lungenödem, Dissektion) → sofort senken; Krise ohne Organschaden: langsame Senkung."]],
lae:[
["Therapie bei hämodynamisch instabiler Lungenembolie?","Systemische Lyse (z. B. Alteplase 100 mg über 2 h bzw. 50 mg Bolus bei Reanimation), Heparin; sonst Katheter/OP."],
["Typische EKG-Zeichen der Lungenembolie?","Sinustachykardie, S1Q3T3, Rechtsschenkelblock, T-Negativierung V1–V4."]],
asthmacopd:[
["Stufentherapie beim schweren Asthmaanfall?","O₂, Salbutamol + Ipratropium inhalativ, Prednisolon 50–100 mg i.v., Magnesium 2 g i.v., ggf. Adrenalin/Terbutalin s.c.; Intubation bei Erschöpfung (Ketamin)."],
["Zeichen eines lebensbedrohlichen Asthmaanfalls?","Silent chest, Zyanose, Bradykardie, Erschöpfung, Bewusstseinstrübung, PEF < 33 %."]],
anaphylaxie:[
["Therapie der Anaphylaxie nach S2k?","Adrenalin i.m. 0,3–0,5 mg (Oberschenkel), O₂, Volumen, Lagerung, H1-/H2-Blocker und Glukokortikoid adjuvant, Salbutamol bei Bronchospasmus."],
["Einteilung nach Ring und Messmer?","Grad I Haut, II Kreislauf/Atemwege mild, III Schock/Bronchospasmus, IV Atem-/Kreislaufstillstand."]],
dyspnoe:[
["Differenzialdiagnosen akute Dyspnoe?","Asthma/COPD, Lungenödem, LE, Pneumothorax, Pneumonie, Anaphylaxie, ACS, Hyperventilation, Azidose."],
["O₂-Zielwerte?","SpO₂ 94–98 %, bei COPD/Hyperkapnie 88–92 %."]],
stroke:[
["Zeitfenster der systemischen Lyse beim Schlaganfall?","Bis 4,5 h nach Symptombeginn (bekannter Zeitpunkt), Thrombektomie bis 24 h bei Großgefäßverschluss und Mismatch; Zeit festhalten (last seen well)."],
["Prähospitale Maßnahmen beim Schlaganfall?","BE-FAST, BZ, RR nur bei > 220/120 mmHg senken, Stroke Unit mit Voranmeldung, O₂ nur bei Hypoxie, kein ASS."]],
krampf:[
["Stufentherapie Status epilepticus?","Benzodiazepin (Midazolam i.m. 10 mg / Lorazepam 0,1 mg/kg i.v. / Diazepam), dann Levetiracetam/Valproat/Lacosamid, dann Narkose."],
["Definition Status epilepticus?","Anfall > 5 min oder Serie ohne Wiedererlangung des Bewusstseins."]],
sht:[
["Therapieziele beim schweren SHT?","Normoxie, Normokapnie (EtCO₂ 35–40), RR syst. > 110 mmHg, Hypotonie/Hypoxie vermeiden, Oberkörper 30°, bei Einklemmung hyperosmolar (NaCl 3–7,5 %/Mannitol)."],
["Klinische Einklemmungszeichen?","Anisokorie/weite lichtstarre Pupille, Streckkrämpfe, Cushing-Reflex (Hypertonie, Bradykardie), GCS-Abfall."]],
bewusstlos:[
["Was ist AEIOU-TIPS bei Bewusstseinsstörung?","Alkohol, Epilepsie, Insulin, Opioide, Urämie; Trauma, Infekt, Psychiatrie, Schlaganfall/Sepsis."],
["Notwendige Basis-Diagnostik?","BZ, EKG, Vitalzeichen, Pupillen, GCS, Temperatur, neurologischer Status."]],
polytrauma:[
["xABCDE im Trauma?","x = exsanguinierende Blutung, A Atemweg mit HWS, B Belüftung, C Kreislauf/Blutung, D Neuro, E Entkleiden/Wärme."],
["Schockraum-Alarm-Kriterien?","Instabile Vitalparameter (RR < 90, GCS < 9, Intubationspflicht), schwere Verletzung/Mechanismus (Sturz > 3 m, Ejektion, Tod im Fahrzeug)."]],
thorax:[
["Entlastung Spannungspneumothorax?","Nadel (großlumig) bzw. besser Minithorakotomie/Drainage im 4./5. ICR vordere/mittlere Axillarlinie (Safe Triangle)."],
["Zeichen Spannungspneumothorax?","Dyspnoe, Hypotonie, einseitig aufgehobenes Atemgeräusch, Halsvenenstau, Trachealverlagerung (spät)."]],
verbrennung:[
["Parkland-Formel und Verbrennungsgrad?","4 ml × kgKG × %VKOF Kristalloide in 24 h (Hälfte in 8 h); Neunerregel; Grad 2b/3 verlangen Verbrennungszentrum bei großer Fläche."],
["Wann Verbrennungszentrum?","VKOF > 10 % bei Kindern/> 20 % Erwachsene, Gesicht/Hände/Genitale, Inhalationstrauma, Verbrühungen mit Begleitverletzungen."]],
sepsis:[
["Hour-1-Bundle?","Laktat, Blutkulturen, Antibiotikum innerhalb 1 h, Kristalloide 30 ml/kg bei Hypotonie/Laktat ≥ 4, Noradrenalin bei MAP < 65."],
["Sepsis-Definition (Sepsis-3)?","Lebensbedrohliche Organdysfunktion durch dysregulierte Wirtsantwort auf Infektion (SOFA ≥ 2); septischer Schock: Vasopressor + Laktat > 2 trotz Volumen."]],
diabetes:[
["Therapie der Hypoglykämie?","Wach: orale Glukose; sonst Glukose 40 % 25–50 ml i.v. (Kinder G10 2–4 ml/kg) oder Glukagon 1 mg i.m."],
["Ketoazidose: Prinzipien?","Volumen (NaCl 0,9 %), Insulin-Perfusor, Kalium kontrollieren/substituieren, Ursache suchen, Klinik/Intensiv."]],
tox:[
["Wichtige Antidote?","Naloxon (Opioide), Flumazenil (Benzodiazepine), Hydroxocobalamin (Zyanid), Physostigmin (Anticholinergika), Acetylcystein (Paracetamol), Atropin/Obidoxim (Alkylphosphate)."],
["Wann Aktivkohle?","Innerhalb 1–2 h, toxische Dosis, wach, Schutzreflexe erhalten; nicht bei Säuren/Laugen/Alkoholen."]],
hypotherm:[
["Stadieneinteilung Hypothermie?","Leicht 32–35 °C (Zittern), moderat 28–32 °C (Schläfrigkeit, Zittern fehlt), schwer < 28 °C (Bewusstlosigkeit, Kammerflimmern)."],
["Besonderheit Reanimation Hypothermie?","Lange CPR, max. 3 Schocks bei < 30 °C, Adrenalin-Intervall verlängert, ECLS in Zentrum; „nobody is dead until warm and dead“."]],
hitze:[
["Hitzschlag: Therapie?","Aktive Kühlung (Kaltwasserimmersion, Eispacks Hals/Axilla/Leiste), Volumen, Krampf/Atemweg beachten; Zielt < 39 °C."],
["Unterschied Hitzeerschöpfung und Hitzschlag?","Hitzschlag: Kerntemperatur > 40 °C + ZNS-Störung; Erschöpfung: Schwäche, Schwitzen, normale Kerntemp., kein ZNS-Ausfall."]],
ertrinken:[
["Wichtigster Unterschied der Reanimation beim Ertrinken?","Beginn mit 5 Beatmungen, hypoxische Ursache; O₂ 100 %, Wärmeerhalt, Aspirationsgefahr."],
["Stromunfall: Besonderheiten?","Eigenschutz, Strom abschalten, Arrhythmien/Rhabdomyolyse, Brandwunden an Ein-/Austritt, 12-Kanal-EKG, Klinikaufnahme bei Hochspannung."]],
eklampsie:[
["Therapie Eklampsie?","Magnesium 4–6 g über 15–20 min, dann 1–2 g/h; Blutdrucksenkung (Urapidil, Nifedipin), Krampf: Benzodiazepine als Alternative; Entbindung in Klinik."],
["HELLP: Definition?","Hämolyse, erhöhte Leberwerte, niedrige Thrombozyten; epigastrische Schmerzen, Klinik/Entbindung."]],
geburt:[
["Therapie der postpartalen Blutung (4 T)?","Tonus (Atonie): Uterusmassage, Oxytocin 3–5 IE; Trauma; Gewebe (Plazentarest); Thrombin/Gerinnung; TXA 1 g, Volumen, Klinik."],
["Vorgehen bei Schulterdystokie?","McRoberts-Manöver, suprapubischer Druck, dann weitere Manöver (Rubin, Woods), Hilfe rufen."]],
psych:[
["Rechtsgrundlagen bei akuter Eigen-/Fremdgefährdung?","PsychKG NRW (öffentlich-rechtliche Unterbringung), alternativ § 1831 BGB (Betreuung); Polizei/Ordnungsamt/Arzt, Dokumentation."],
["Medikamentöse Sedierung bei Erregung?","Haloperidol 5 mg (QTc beachten) ± Benzodiazepin (Lorazepam 1–2 mg/Midazolam), Eigenschutz, Deeskalation zuerst."]],
kinder:[
["Kinder-Vitalwerte (Orientierung)?","Neugeborene HF 120–160, AF 40–60; Kleinkind HF 100–140; Schulkind HF 70–110; RR syst. min. 70 + 2×Alter."],
["Dosierung Adrenalin Kinder bei Reanimation?","10 µg/kg i.v./i.o. (0,1 ml/kg der 1:10.000-Lösung), alle 3–5 min."]],
atemweg:[
["Stufenplan Atemwegsmanagement (S1)?","Maske-Beutel → supraglottisch → Intubation (Videolaryngoskopie) → Notkoniotomie; Plan A–D festlegen."],
["Wann Intubation prähospital?","Bewusstlosigkeit (GCS ≤ 8), respiratorische Erschöpfung, Verlegung, Aspirationsgefahr; Kapnographie zur Lagekontrolle obligat."]],
rsi:[
["Medikamente der prähospitalen RSI?","Hypnotikum (Ketamin/Etomidat), Opioid (Fentanyl), Relaxans (Rocuronium 1 mg/kg oder Succinylcholin 1–1,5 mg/kg), Präoxygenierung, Videolaryngoskopie."],
["Kontraindikationen Succinylcholin?","Maligne Hyperthermie-Anamnese, Hyperkaliämie, Muskelerkrankungen, Verbrennung/Immobilisation > 24 h."]],
analgesie:[
["Analgesie-Stufen im Notfall?","Mild: Paracetamol/Metamizol; stark: Esketamin, Fentanyl, Piritramid; Nitro bei ACS; regional/Lokalanästhesie."],
["Dosierung Esketamin Analgesie?","0,125–0,25 mg/kg i.v. (Analgesie), 0,5–1 mg/kg i.v. Narkose; Cave Hypersalivation, Halluzination (Midazolam)."]],
manv:[
["Sichtungskategorien?","T1 rot (Sofort), T2 gelb (Dringlich), T3 grün (Später/Gehfähig), T4 blau (abwartend), T Schwarz/Tot."],
["Erste Maßnahmen als erstes Rettungsmittel bei MANV?","Lagemeldung (MANV-Stichwort), Eigenschutz, Absicherung, Sichtung beginnen, Einsatzleitung (LNA/OrgL) aufbauen, keine Einzelversorgung."]],
recht:[
["Welche Voraussetzungen für wirksame Einwilligung?","Einwilligungsfähigkeit, Aufklärung, Freiwilligkeit; bei Bewusstlosigkeit mutmaßlicher Wille."],
["Todesfeststellung: Kriterien?","Sichere Todeszeichen: Totenflecke, Totenstarre, Fäulnis, mit dem Leben nicht vereinbare Verletzungen; Leichenschau nach Landesrecht."]],
abdomen:[
["Welche Notfälle immer beim akuten Abdomen bedenken?","Rupturiertes Aortenaneurysma, Mesenterialischämie, Perforation, Extrauteringravidität, Herzinfarkt."],
["Therapie Varizenblutung?","Terlipressin 2 mg, Antibiotika (Ceftriaxon), Volumen restriktiv, Endoskopie < 12 h."]],
elektrolyte:[
["Reihenfolge Hyperkaliämietherapie?","1. Calcium (Kardioprotektion), 2. Insulin+Glukose/Salbutamol (Shift), 3. Elimination (Furosemid/Dialyse), Bicarbonat bei Azidose."],
["Korrekturgeschwindigkeit Natrium bei Hyponatriämie?","Maximal +10 mmol/l in 24 h (Ziel anfangs +5 mmol/l), sonst osmotische Demyelinisierung."]],
blutung:[
["Dosierung Tranexamsäure beim Blutungsschock?","1 g i.v. über 10 min innerhalb 3 h, dann 1 g über 8 h."],
["Antagonisierung Marcumar/Dabigatran?","Phenprocoumon: PPSB + Vitamin K; Dabigatran: Idarucizumab 5 g."]],
niere:[
["Warum Dialysepatient Notfall bei Dialyseversäumnis?","Hyperkaliämie, Überwässerung/Lungenödem, Azidose; EKG und Kalium bestimmen."],
["Shunt-Arm: Regeln?","Kein Zugang, keine RR-Messung, kein Tourniquet, Shuntfunktion (Schwirren) prüfen."]],
tamponade:[
["Beck-Trias?","Hypotonie, Halsvenenstauung, leise Herztöne."],
["Wirkung des Magneten auf ICD und Schrittmacher?","ICD: unterdrückt Schockabgabe; Schrittmacher: asynchrone Stimulation (Fixfrequenz)."]],
co_rauch:[
["Warum Pulsoxymetrie bei CO-Vergiftung unzuverlässig?","CO-Hb wird wie O₂-Hb gelesen: SpO₂ falsch normal; CO-Oximetrie nötig."],
["Antidot bei Rauchgas mit Zyanidverdacht?","Hydroxocobalamin 5 g i.v. über 15 min (Kinder 70 mg/kg)."]],
alkohol_drogen:[
["Dosierung und Steuerung Naloxon?","0,04–0,1 mg i.v. fraktioniert nach Atmung titrieren; Wirkdauer kürzer als Opioid."],
["Entzugsdelir: Therapie?","Benzodiazepine, Thiamin vor Glukose, Flüssigkeit, Klinik."]],
paracetamol_pilze:[
["Schema Acetylcystein bei Paracetamol?","150 mg/kg über 1 h, 50 mg/kg über 4 h, 100 mg/kg über 16 h; Nomogramm ab 4 h."],
["Knollenblätterpilz: Verlauf?","Latenz 6–24 h, Gastroenteritis, scheinbare Besserung, Leberversagen; Silibinin, Aktivkohle, Zentrum."]],
wirbelsaeule:[
["Beckenschlinge: Position und Regel?","Auf Trochanterhöhe, nur einmal Stabilität prüfen, bei Beckenverdacht frühzeitig anlegen."],
["Amputat: Lagerung?","Steriles Tuch, trockener Beutel, Beutel in Eiswasser (nicht direkt auf Eis)."]],
urologie:[
["Zeitfenster bei Hodentorsion?","Ca. 6 h bis zur Rettung des Hodens; sofort Klinik."],
["Wann Nierenkolik Notfall?","Mit Fieber/Sepsiszeichen, Anurie, Einzelniere: urologische Entlastung dringend."]],
hno_auge:[
["Erste Maßnahme bei Augenverätzung?","Sofortige Spülung 15–30 min (Wasser/Ringer), pH kontrollieren, Augenklinik."],

function newLimit(){return store.get('newLimit',20);}
function newToday(){const o=store.get('newToday',{});return o.k===todayKey()?o.n:0;}
function bumpNew(){const o=store.get('newToday',{});store.set('newToday',{k:todayKey(),n:(o.k===todayKey()?o.n:0)+1});}
function stats(cat){
  const pool=CARDS.filter(c=>!cat||cat==='Alle'||c.cat===cat), now=Date.now();
  let nw=0,due=0,mas=0;
  pool.forEach(c=>{const s=srs[c.id]; if(!s) nw++; else {if(s.d<=now) due++; if(s.b>=4) mas++;}});
  return {total:pool.length,nw,due,mas,seen:pool.length-nw};
}

/* Englische Abkürzungen: beim ersten Auftreten je Ansicht deutsche Erklärung in Klammern */
const ABK_RX=(window.ABK||[]).map(a=>[a[0],a[1],new RegExp('(^|[^\\wÄÖÜäöüß/\\-])('+a[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![\\wÄÖÜäöüß₂\\-])')]);
function expandAbk(root){
  const skip='.noabk,h1,.h1,.h2,.eyebrow,script,style,textarea,input,svg,.syr,.timer,.chip,.tab,.tabs,.seg,.tst,.favb,.btn,.top,.brand,.mono,.qt,.stats,.stat';
  const done={}; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null); const nodes=[]; let n;
  while((n=w.nextNode())) nodes.push(n);
  nodes.forEach(t=>{
    if(!t.nodeValue||t.nodeValue.length<2) return;
    if(t.parentElement&&t.parentElement.closest(skip)) return;
    let v=t.nodeValue, ch=false;
    ABK_RX.forEach(a=>{
      if(done[a[0]]) return;
      const m=a[2].exec(v); if(!m) return;
      const end=m.index+m[1].length+a[0].length;
      done[a[0]]=1;
      if(/^\s*\(/.test(v.slice(end))) return;
      v=v.slice(0,end)+' ('+a[1]+')'+v.slice(end); ch=true;
    });
    if(ch) t.nodeValue=v;
  });
}

  app.innerHTML='<div class="fade">'+html+'</div>';

  if(S.tab==='tools'&&S.tool==='timer') updateTimer();
}

function weakCat(){
  const now=Date.now(); let best=null;
  CARD_CATS.forEach(c=>{
    const pool=CARDS.filter(x=>x.cat===c); if(!pool.length) return;
    let seen=0,weak=0; pool.forEach(x=>{const r=srs[x.id]; if(r){seen++; if((r.b||0)<=1) weak++;}});
    const sc=weak>0?{k:'weak',v:weak/Math.max(1,seen)+weak/1000}:{k:'few',v:1-seen/pool.length};
    const cand={c,seen,weak,total:pool.length,kind:sc.k,v:sc.v};
    if(!best||(cand.kind==='weak'&&best.kind!=='weak')||(cand.kind===best.kind&&cand.v>best.v)) best=cand;
  });
  return best;
}
function planBuf(){return store.get('planBuf',0);}
function planOut(){
  const st=stats(), exam=store.get('exam',''), goal=newLimit(), nw=st.nw, buf=planBuf();
  const fmtD=d=>d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  const fin=Math.ceil(nw/Math.max(1,goal)), finDate=new Date(Date.now()+fin*DAY);
  let h=`<div class="plan-r"><b>${nw}</b> Karten noch ungelernt. Mit <b>${goal}</b> neuen Karten/Tag bist du in <b>${fin}</b> ${fin===1?'Tag':'Tagen'} durch (${fmtD(finDate)}).</div>`;
  if(!exam) return h+'<div class="small muted" style="margin-top:6px">Prüfungsdatum eintragen, dann berechne ich, wie viele neue Karten pro Tag nötig sind.</div>';
  const d=Math.ceil((new Date(exam+'T08:00:00')-new Date())/DAY);
  if(d<0) return h+'<div class="small muted" style="margin-top:6px">Das Prüfungsdatum liegt in der Vergangenheit.</div>';
  const usable=Math.max(1,d-buf), need=Math.ceil(nw/usable);
  const late=fin-usable;
  const min=Math.round(need*0.5);
  h+=`<div class="plan-need"><span>Bis zur Prüfung nötig</span><b>${need}</b><span>neue Karten/Tag</span></div>
  <div class="small muted">${d} ${d===1?'Tag':'Tage'} bis zur Prüfung${buf?`, davon ${buf} nur zum Wiederholen → ${usable} Lerntage`:''}. Reine Lernzeit für neue Karten ca. ${min} Min/Tag (bei ~30 s pro Karte), dazu kommen die Wiederholungen.</div>`;
  h+=late>0?`<div class="plan-bad">Mit deinem Ziel reichst du nicht: ca. ${late} ${late===1?'Tag':'Tage'} zu spät. Erhöhe auf mindestens ${need}/Tag.</div>`:`<div class="plan-ok">Dein Ziel reicht: du bist ca. ${-late} ${-late===1?'Tag':'Tage'} vor Ende der Lernphase fertig.</div>`;
  if(goal!==need) h+=`<div style="margin-top:8px"><button class="btn small primary" data-a="planapply" data-v="${need}">Empfehlung übernehmen (${need}/Tag)</button></div>`;
  return h;
}

const IV=[0,1,2,5,10,21,45];
function ivLabel(d){return d===0?'<10 min':(d===1?'1 Tag':d+' Tage');}
function buildQueue(){
  const now=Date.now();
  let pool=L.folder?folderCards(L.folder):CARDS.filter(c=>L.cat==='Alle'||c.cat===L.cat), q=[];
  if(L.mode==='due'){
    const due=pool.filter(c=>srs[c.id]&&srs[c.id].d<=now);
    const nw=shuffle(pool.filter(c=>!srs[c.id])).slice(0,Math.max(0,newLimit()-newToday()));
    q=shuffle(due).concat(nw);
  } else if(L.mode==='new') q=shuffle(pool.filter(c=>!srs[c.id])).slice(0,20);
  else if(L.mode==='weak') q=shuffle(pool.filter(c=>srs[c.id]&&srs[c.id].b<=1));
  else if(L.mode==='exam') q=shuffle(pool).slice(0,30);
  else q=shuffle(pool).slice(0,40);
  if(L.folder) q=shuffle(pool);
  L.noteOpen=false;
  L.res=[];
  L.queue=q;L.i=0;L.shown=false;L.done=0;L.active=true;
}

function rate(r){
  const c=L.queue[L.i]; if(!c) return;
  const isNew=!srs[c.id]; const s=srs[c.id]||{b:0,n:0,l:0};
  if(isNew) bumpNew();
  s.n=(s.n||0)+1;
  if(r===0){ s.b=0; s.l=(s.l||0)+1; s.d=Date.now()+10*60000; L.queue.push(c); }
  else { s.b= r===1? Math.max(1,s.b||0) : Math.min(6,(s.b||0)+(r===2?1:2)); s.d=Date.now()+Math.max(1,IV[s.b])*DAY; }
  srs[c.id]=s; store.set('srs',srs);
  L.done++; L.i++; L.shown=false; L.noteOpen=false; render();
}

function updateTimer(){

  const cl=120000-((ms-T.cyc)%120000+120000)%120000;
  if(T.run&&ms-T.cyc>=120000){T.cyc+=120000;tlog('Rhythmuscheck (2 min)');beep(1000,.4);const lg=$('#t-log');if(lg)lg.innerHTML=T.log.map(l=>`<div>${esc(l)}</div>`).join('');}
  $('#t-cyc').textContent=mmss(120000-(ms-T.cyc));
  $('#t-sh').textContent=T.shocks;$('#t-ad').textContent=T.adr;$('#t-am').textContent=T.amio;
  $('#t-adt').textContent=T.lastAdr!=null?'(vor '+mmss(ms-T.lastAdr)+')':'';
  const h=$('#t-hint'); let msg='';
  if(T.lastAdr!=null&&ms-T.lastAdr>=180000) msg='Adrenalin fällig (alle 3–5 min)';
  if(T.shocks>=3&&T.amio===0) msg='≥3 Schocks: Adrenalin 1 mg + Amiodaron 300 mg';
  else if(T.shocks>=5&&T.amio===1) msg='≥5 Schocks: Amiodaron 150 mg';

}
setInterval(()=>{ if(S.tab==='tools'&&S.tool==='timer') updateTimer(); },250);
function tAct(a,v){
  if(a==='t-run'){ if(T.run){T.acc+=Date.now()-T.t0;T.run=false;tlog('Stopp');} else {T.t0=Date.now();T.run=true;tlog(T.acc?'Weiter':'Start');} }
  else if(a==='t-shock'){T.shocks++;tlog('Schock #'+T.shocks);}
  else if(a==='t-adr'){T.adr++;T.lastAdr=tNow();tlog('Adrenalin 1 mg (#'+T.adr+')'+(v==='ns'?' · nicht schockbar':''));}
  else if(a==='t-amio'){T.amio++;tlog('Amiodaron '+(T.amio===1?'300':'150')+' mg');}
  else if(a==='t-rosc'){tlog('ROSC');if(T.run){T.acc+=Date.now()-T.t0;T.run=false;}}
  else if(a==='t-metro'){T.metro=!T.metro; if(T.metro){beep(700,.05);T.mi=setInterval(()=>beep(700,.05),60000/110);} else {clearInterval(T.mi);T.mi=null;}}

}

const PI2=Math.PI*2;
function rngf(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const Gs=(t,m,s,a)=>a*Math.exp(-((t-m)*(t-m))/(2*s*s));
function qrsw(t,c,o){o=o||{};const w=o.w||1;return Gs(t,c-.028*w,.008*w,o.q==null?-.09:o.q)+Gs(t,c,.011*w,o.r==null?1.1:o.r)+Gs(t,c+.03*w,.011*w,o.s==null?-.22:o.s)+Gs(t,c+.14*w,o.sts||.05,o.st||0)+Gs(t,c+.28*w,o.ts||.05,o.t==null?.3:o.t);}
const pwv=(t,c,a)=>Gs(t,c,.022,a==null?.13:a);
function train(times,fn){return t=>{let v=0;for(let i=0;i<times.length;i++){const c=times[i];if(c<t-.8)continue;if(c>t+.8)break;v+=fn(t,c);}return v;};}
function reg(T,s,n){const a=[];for(let k=0;k<n;k++)a.push(s+k*T);return a;}
function sum(...fs){return t=>fs.reduce((v,f)=>v+f(t),0);}

 tx:'Keine akute Therapie; Medikamente prüfen.',
 mk:()=>train(reg(.95,.4,30),(t,c)=>pwv(t,c-.34)+qrsw(t,c))},
{id:'wenck',g:'AV-Blockierungen',n:'AV-Block II° Typ 1 (Wenckebach)',rate:'variabel',topic:'brady',
 key:['PQ-Zeit nimmt von Schlag zu Schlag zu, bis ein QRS ausfällt','Gruppierte Schläge, RR-Abstände werden kürzer','Block im AV-Knoten, meist gutartig (inferiorer Infarkt, Vagotonie)'],
 tx:'Meist Beobachtung; bei Symptomen Atropin.',
 mk:()=>{const p=[],q=[];for(let g=0;g<10;g++){const b=.3+g*3.8;for(let j=0;j<4;j++){const tp=b+j*.95;p.push(tp);if(j<3)q.push(tp+[.16,.27,.38][j]);}}
  return sum(train(p,(t,c)=>pwv(t,c)),train(q,(t,c)=>qrsw(t,c)));}},
{id:'mob2',g:'AV-Blockierungen',n:'AV-Block II° Typ 2 (Mobitz)',rate:'langsam, wechselnde Überleitung',topic:'brady',
 key:['Konstante PQ-Zeit, plötzlicher Ausfall des QRS (hier 3:2)','Block meist infranodal, QRS oft verbreitert','Gefahr der Progression zum AV-Block III°'],
 tx:'Atropin oft wirkungslos; transkutanes Pacing vorbereiten, Klinik mit Schrittmacherversorgung.',
 mk:()=>{const p=[],q=[];for(let k=0;k<30;k++){const tp=.3+k*.8;p.push(tp);if(k%3!==2)q.push(tp+.2);}return sum(train(p,(t,c)=>pwv(t,c)),train(q,(t,c)=>qrsw(t,c,{w:1.5,r:1})));}},
{id:'av3',g:'AV-Blockierungen',n:'AV-Block III° (kompletter AV-Block)',rate:'Kammer 20–40/min',topic:'brady',
 key:['P-Wellen und QRS-Komplexe völlig unabhängig (AV-Dissoziation)','P-Frequenz höher als QRS-Frequenz','Kammerersatzrhythmus, breit bei tiefem Ursprung → Adams-Stokes-Anfälle'],
 tx:'Atropin 0,5 mg versuchen, Adrenalin 2–10 µg/min, transkutanes Pacing (Analgosedierung), Klinik.',
 mk:()=>sum(train(reg(.72,.2,40),(t,c)=>pwv(t,c)),train(reg(1.75,.9,15),(t,c)=>qrsw(t,c,WIDE)))},
{id:'vf',g:'Kreislaufstillstand',n:'Kammerflimmern',rate:'—',topic:'als',
 key:['Chaotische, unregelmäßige Wellen ohne erkennbare QRS-Komplexe','Kein Auswurf – Kreislaufstillstand','Schockbarer Rhythmus'],
 tx:'Sofort CPR und Defibrillation, danach 2 min CPR; Adrenalin 1 mg + Amiodaron 300 mg nach dem 3. Schock; 4H/4T.',
 mk:()=>{const r=rngf(11);const F=[],A=[],P=[];for(let i=0;i<7;i++){F.push(3.3+r()*4.2);A.push(.12+r()*.2);P.push(r()*6.28);}return t=>{const e=.7+.3*Math.sin(PI2*.35*t);let v=0;for(let i=0;i<7;i++)v+=A[i]*Math.sin(PI2*F[i]*t+P[i]);return v*e;};}},
{id:'asys',g:'Kreislaufstillstand',n:'Asystolie',rate:'—',topic:'als',
 key:['Nulllinie ohne elektrische Aktivität','Immer Ableitung, Elektroden und Verstärkung prüfen (Feinflimmern ausschließen)','Nicht schockbar'],
 tx:'CPR, Adrenalin 1 mg so früh wie möglich, 4H/4T suchen; nicht defibrillieren.',
 mk:()=>t=>.012*Math.sin(PI2*.4*t)+.006*Math.sin(PI2*3.1*t)},
{id:'stemi',g:'Weitere',n:'ST-Hebungsinfarkt (STEMI)',rate:'meist normal',topic:'acs',
 key:['ST-Hebung unmittelbar nach dem QRS („Tombstone“, monophasisch)','≥0,1 mV in ≥2 benachbarten Ableitungen','Typisch mit Klinik: Brustschmerz, Dyspnoe, Schweiß'],
 tx:'ASS 150–300 mg, Heparin, Analgesie, Katheterlabor anmelden (FMC → Draht ≤120 min), Defi-Pads.',
 mk:()=>train(reg(.8,.35,30),(t,c)=>pwv(t,c-.16)+qrsw(t,c,{s:-.05,st:.6,sts:.075,t:.3,ts:.06}))},
{id:'hyperk',g:'Weitere',n:'Hyperkaliämie',rate:'häufig bradykard',topic:'spezial',
 key:['Hohe, schmale, spitze (zeltförmige) T-Wellen','Flache oder fehlende P-Wellen, verbreiterter QRS','Später Sinuswellenmuster, Kammerflimmern/Asystolie'],
 tx:'Calciumchlorid 10 % 10 ml langsam i.v., Glukose 25 g + Insulin 10 IE, Salbutamol inhalativ, ggf. Natriumbikarbonat, Dialyse.',
 mk:()=>train(reg(.8,.35,30),(t,c)=>pwv(t,c-.17,.04)+qrsw(t,c,{w:1.5,r:.9,t:0})+Gs(t,c+.26,.032,.95))},
{id:'ves',g:'Weitere',n:'Ventrikuläre Extrasystolen (Bigeminus)',rate:'abhängig vom Grundrhythmus',topic:'tachy',
 key:['Vorzeitiger, breiter, bizarrer QRS ohne vorangehende P-Welle','Kompensatorische Pause danach','Bigeminus: jeder zweite Schlag ist eine VES'],
 tx:'Meist keine Therapie; Auslöser behandeln (Ischämie, Hypokaliämie, Hypomagnesiämie, Medikamente). Gefährlich: R-auf-T, Salven, gehäuft bei ACS.',
 mk:()=>{const n=[],v=[];for(let k=0;k<14;k++){n.push(.4+k*1.6);v.push(.4+k*1.6+.62);}return sum(train(n,(t,c)=>pwv(t,c-.16)+qrsw(t,c)),train(v,(t,c)=>Gs(t,c,.07,.95)+Gs(t,c+.15,.09,-.55)));}}
];
const EKG_GRPS=['Alle','Normal','Bradykardien','Tachykardien','AV-Blockierungen','Kreislaufstillstand','Weitere'];
const EK={mode:'learn',grp:'Alle',sel:null,q:null,ans:null,score:0,total:0,streak:0};
EKG.forEach(r=>CARDS.push({id:'e'+hash('ekg'+r.id),cat:'EKG',q:'EKG-Streifen: Welcher Rhythmus ist das?',a:r.n+' ('+r.rate+')',ekg:r.id,off:parseInt(hash('o'+r.id),36)%300/100}));
function ekgSvg(r,off){
  const f=r.mk(),W=600,H=170,BASE=105,SC=48,span=5;let d='';
  for(let i=0;i<=1000;i++){const x=i*W/1000,t=off+i*span/1000,y=Math.max(4,Math.min(H-4,BASE-f(t)*SC));d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);}
  return `<svg viewBox="0 0 ${W} ${H}" class="ecg" role="img" aria-label="EKG-Streifen, 25 mm/s"><defs><pattern id="g1" width="4.8" height="4.8" patternUnits="userSpaceOnUse"><path d="M4.8 0V4.8H0" fill="none" stroke="#F3C9C5" stroke-width=".5"/></pattern><pattern id="g2" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0V24H0" fill="none" stroke="#E9A19B" stroke-width=".9"/></pattern></defs><rect width="${W}" height="${H}" fill="#FFF7F6"/><rect width="${W}" height="${H}" fill="url(#g1)"/><rect width="${W}" height="${H}" fill="url(#g2)"/><path d="${d}" fill="none" stroke="#111" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg><p class="small muted" style="margin:4px 0 0">Streifen 5 s · 25 mm/s · 10 mm/mV (schematisch)</p>`;
}
function ekgInfo(r){
  return `<div class="box def"><h3>${esc(r.n)}</h3><div class="small muted" style="margin-bottom:6px">Frequenz: ${esc(r.rate)}</div>${ul(r.key)}</div>
  <div class="box merke"><h3>Vorgehen</h3><p style="margin:0">${fmt(r.tx)}</p></div>
  ${r.topic?`<div><button class="btn" data-a="topic" data-v="${r.topic}">Thema öffnen</button></div>`:''}`;
}
function toolEkg(){
  const seg=`<div class="seg"><button data-a="e-mode" data-v="learn" aria-selected="${EK.mode==='learn'}">Rhythmen</button><button data-a="e-mode" data-v="quiz" aria-selected="${EK.mode==='quiz'}">Quiz</button></div>`;
  if(EK.mode==='quiz') return seg+ekgQuiz();
  if(EK.sel){const r=EKG.find(x=>x.id===EK.sel);return `<button class="back" data-a="e-list">‹ Alle Rhythmen</button>${ekgSvg(r,EK.off||0)}${ekgInfo(r)}`;}
  const list=EKG.filter(r=>EK.grp==='Alle'||r.g===EK.grp);
  return seg+`<div class="chips wrapchips">${EKG_GRPS.map(g=>`<button class="chip" data-a="e-grp" data-v="${g}" aria-pressed="${EK.grp===g}">${g}</button>`).join('')}</div>
  <div class="list">${list.map(r=>`<button class="item" data-a="e-open" data-v="${r.id}"><b>${esc(r.n)}</b><span class="chev">›</span><span class="sub">${esc(r.g)} · ${esc(r.rate)}</span></button>`).join('')}</div>`;
}
function newEkgQ(){
  const r=EKG[Math.floor(Math.random()*EKG.length)];
  const others=shuffle(EKG.filter(x=>x.id!==r.id)).slice(0,3);
  EK.q={r,off:Math.random()*3,opts:shuffle([r].concat(others))};EK.ans=null;
}
function ekgQuiz(){
  if(!EK.q) newEkgQ();
  const q=EK.q;
  const opts=q.opts.map(o=>{let cls='';if(EK.ans){if(o.id===q.r.id)cls='right';else if(o.id===EK.ans)cls='wrong';}return `<button class="opt ${cls}" data-a="e-ans" data-v="${o.id}" ${EK.ans?'disabled':''}>${esc(o.n)}</button>`;}).join('');
  return `<div class="row" style="justify-content:space-between"><span class="small muted">Richtig: <b>${EK.score}</b> / ${EK.total}</span><span class="small muted">Serie: <b>${EK.streak}</b></span></div>
  ${ekgSvg(q.r,q.off)}<h3>Welche Rhythmusstörung ist das?</h3><div class="stack" style="gap:8px">${opts}</div>
  ${EK.ans?`<div class="alert" style="background:${EK.ans===q.r.id?'var(--ok)':'var(--accent)'}">${EK.ans===q.r.id?'Richtig!':'Leider falsch – richtig ist: '+esc(q.r.n)}</div>${ekgInfo(q.r)}<button class="btn primary" style="width:100%;justify-content:center" data-a="e-next">Nächster Streifen</button>`:''}`;
}
function eAct(a,v){
  if(a==='e-mode'){EK.mode=v;EK.sel=null;}
  else if(a==='e-grp'){EK.grp=v;}
  else if(a==='e-open'){EK.sel=v;EK.off=Math.random()*3;window.scrollTo(0,0);}
  else if(a==='e-list'){EK.sel=null;}
  else if(a==='e-ans'){if(!EK.ans){EK.ans=v;EK.total++;if(v===EK.q.r.id){EK.score++;EK.streak++;}else EK.streak=0;}}
  else if(a==='e-next'){newEkgQ();window.scrollTo(0,0);}
  render();
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  if(a==='tab'){ if($('#q').value){$('#q').value='';S.q='';} go(v,null); }
  else if(a==='back') back();
  else if(a==='cat'){S.cat=v;render();}
  else if(a==='dcls'||a==='dgrp'){S.dgrp=v;render();window.scrollTo(0,0);}
  else if(a==='dsort'){S.dsort=v;store.set('dsort',v);render();}
  else if(a==='topic'){ store.set('lastTopic',v); go('themen',{type:'topic',id:v},true); }
  else if(a==='chap'){ S.topOpen=S.topOpen||store.get('topOpen',{}); S.topOpen[v]=!S.topOpen[v]; store.set('topOpen',S.topOpen); render(); }
  else if(a==='chapall'){ S.topOpen={}; if(v==='1') CAT_ORDER.forEach(c=>S.topOpen[c]=true); store.set('topOpen',S.topOpen); render(); }
  else if(a==='goal'||a==='planapply'){ const cur=newLimit(); const nv=a==='planapply'?parseInt(v,10):cur+parseInt(v,10); store.set('newLimit',Math.max(1,Math.min(300,nv||1))); const i=$('#newlim'); if(i) i.value=newLimit(); const o=$('#plan-out'); if(o) o.innerHTML=planOut(); }
  else if(a==='gotool'){ S.tool=v; if(v==='ekg'){EK.mode='learn';EK.sel=null;} go('tools',null); }
  else if(a==='learncat'){ L.cat=v; L.mode='all'; L.folder=null; S.tab='lernen'; S.view=null; buildQueue(); render(); window.scrollTo(0,0); setHash('lernen'); }
  else if(a==='drug') go('med',{type:'drug',id:v},true);
  else if(a==='learned'){learned[v]=!learned[v];store.set('learned',learned);render();}
  else if(a==='topiccards'){L.cat=v;L.active=false;go('lernen',null,true);}
  else if(a==='startlearn'){ if(S.tab!=='lernen'){S.tab='lernen';S.view=null;} buildQueue(); render(); window.scrollTo(0,0); setHash('lernen'); }
  else if(a==='restart'){buildQueue();render();}
  else if(a==='stoplearn'){L.active=false;render();}
  else if(a==='fav'){ if(favs[v]) delete favs[v]; else favs[v]=1; store.set('fav',favs); render(); }
  else if(a==='notetoggle'){L.noteOpen=true;render();const ta=document.querySelector('textarea[data-note]'); if(ta) ta.focus();}
  else if(a==='folder'){L.folder=v;render();window.scrollTo(0,0);}
  else if(a==='folderback'){L.folder=null;render();window.scrollTo(0,0);}
  else if(a==='startfolder'){buildQueue();render();window.scrollTo(0,0);}
  else if(a==='mode'){L.mode=v;render();}
  else if(a==='lcat'){L.cat=v;render();}
  else if(a==='reveal'){L.shown=true;render();}
  else if(a==='rate') rate(parseInt(v,10));
  else if(a==='ex'){ const c=L.queue[L.i]; if(c){L.res.push({cat:c.cat,ok:v==='1'});L.done++;L.i++;L.shown=false;L.noteOpen=false;render();} }
  else if(a==='resetsrs'){ if(!L.confirmReset){L.confirmReset=true;render();} else {L.confirmReset=false;srs={};store.set('srs',srs);store.set('newToday',{});render();} }
  else if(a==='tool'){S.tool=v;render();}
  else if(a==='goekg'){S.tool='ekg';EK.mode='learn';EK.sel=null;go('tools',null);}
  else if(a&&a.indexOf('e-')===0) eAct(a,v);
  else if(a&&a.indexOf('t-')===0) tAct(a,v);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.note){ const v=t.value; if(v.trim()) notes[t.dataset.note]=v; else delete notes[t.dataset.note]; store.set('notes',notes); return; }
  if(t.id==='q'){ S.q=t.value; if(S.q.trim().length>=2){ S.view={type:'search'}; } else if(S.view&&S.view.type==='search'){ S.view=null; } render(); const q=$('#q'); q.focus(); return; }
  if(t.id==='exam'){store.set('exam',t.value);const o=$('#plan-out'); if(o) o.innerHTML=planOut(); return;}
  if(t.id==='newlim'){ const n=parseInt(t.value,10); if(n>=1){ store.set('newLimit',Math.min(300,n)); const o=$('#plan-out'); if(o) o.innerHTML=planOut(); } return; }
  if(t.id==='k-age'||t.id==='k-unit'||t.id==='k-kg'){ const k={age:$('#k-age').value,unit:$('#k-unit').value,kg:$('#k-kg').value}; store.set('kid',k); $('#k-out').innerHTML=kidOut(k); return; }
  if(t.dataset.gcs){ const g=store.get('gcs',{e:4,v:5,m:6}); g[t.dataset.gcs]=parseInt(t.value,10); store.set('gcs',g); render(); return; }
  if(t.dataset.dose){ const d=store.get('dose',{kg:'70',mgkg:'',conc:''}); d[t.dataset.dose]=t.value; store.set('dose',d); $('#dose-out').innerHTML=doseOut(d); return; }
  if(t.dataset.perf){ const p=store.get('perf',{kg:'70',ug:'',mg:'5',ml:'50'}); p[t.dataset.perf]=t.value; store.set('perf',p); $('#perf-out').innerHTML=perfOut(p); return; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='newlim'){ const n=parseInt(e.target.value,10); store.set('newLimit',n>=1?Math.min(300,n):20); e.target.value=newLimit(); }
  if(e.target.id==='buf'){ store.set('planBuf',parseInt(e.target.value,10)||0); const o=$('#plan-out'); if(o) o.innerHTML=planOut(); }
  if(e.target.id==='exam') render();
  if(e.target.id==='k-unit') e.target.dispatchEvent(new Event('input',{bubbles:true}));
});

/* ---------- Wisch-zurück (iOS-Randgeste) ---------- */
function canBack(){return !!(S.view||S.stack.length||(S.tab==='tools'&&S.tool==='ekg'&&EK.mode==='learn'&&EK.sel)||(S.tab==='lernen'&&(L.active||L.folder)));}
function doBack(){
  if(S.view&&S.view.type==='search'){$('#q').value='';S.q='';S.view=null;render();return;}
  if(S.tab==='tools'&&S.tool==='ekg'&&EK.mode==='learn'&&EK.sel){EK.sel=null;render();return;}
  if(S.view||S.stack.length){back();return;}
  if(S.tab==='lernen'&&L.active){L.active=false;render();return;}
  if(S.tab==='lernen'&&L.folder){L.folder=null;render();}
}
(function(){
  const edge=$('#swipe'); let sw=null;
  function reset(){ if(!edge) return; edge.classList.add('rel'); edge.style.opacity='0'; edge.style.transform='translate(-60px,-50%)'; setTimeout(()=>edge.classList.remove('rel'),260); }
  document.addEventListener('touchstart',e=>{ const t=e.touches[0]; sw=(e.touches.length===1&&t.clientX<=28&&canBack())?{x:t.clientX,y:t.clientY,dx:0,on:false}:null; if(sw&&edge) edge.classList.remove('rel'); },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!sw) return; const t=e.touches[0], dx=t.clientX-sw.x, dy=t.clientY-sw.y;
    if(!sw.on){ if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>12){sw=null;return;} if(dx>10) sw.on=true; }
    if(sw.on){ sw.dx=dx; edge.style.opacity=String(Math.min(1,dx/70)); edge.style.transform='translate('+(Math.min(dx,110)-52)+'px,-50%)'; }
  },{passive:true});
  document.addEventListener('touchend',()=>{ if(sw&&sw.on&&sw.dx>75){ try{ if(navigator.vibrate) navigator.vibrate(8);}catch(e){} doBack(); window.scrollTo(0,0);} sw=null; reset(); },{passive:true});
  document.addEventListener('touchcancel',()=>{ sw=null; reset(); },{passive:true});
})();
$('#brand').addEventListener('click',()=>{ $('#q').value='';S.q=''; go('start',null); });
$('#theme').addEventListener('click',()=>{
  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=nx; store.set('theme',nx);
});
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)&&h!==S.tab){S.tab=h;S.view=null;render();} });
window.addEventListener('resize',()=>{ document.documentElement.style.setProperty('--toph',$('#top').offsetHeight+'px'); });
const th=store.get('theme',''); if(th) document.documentElement.dataset.theme=th;
const h0=location.hash.slice(1); if(TABS.some(t=>t[0]===h0)) S.tab=h0;
render();
setTimeout(()=>document.documentElement.style.setProperty('--toph',$('#top').offsetHeight+'px'),300);
})();
</script>
