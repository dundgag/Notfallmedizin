{id:'abdomen',cat:'Internistische Notfälle',t:'Akutes Abdomen & gastrointestinale Blutung',s:'Peritonitis, Ileus, Mesenterialischämie, Varizenblutung',def:'Akut einsetzende Bauchschmerzen mit möglicher Peritonitis oder Kreislaufbeteiligung; zeitkritisch bei Perforation, Ischämie, rupturiertem Aortenaneurysma und Blutung.',dx:['Anamnese: Schmerzbeginn (plötzlich = Perforation/Ischämie/Ruptur), Erbrechen, Stuhlgang, Teerstuhl, Hämatemesis, Antikoagulation, Alkohol, Vor-OPs','Befund: Abwehrspannung/Loslassschmerz (Peritonitis), Darmgeräusche, Schock?','**Frauen im gebärfähigen Alter:** immer Extrauteringravidität bedenken','Plötzlicher Vernichtungsschmerz + Schock → rupturiertes Bauchaortenaneurysma; absolute Arrhythmie + Schmerz → Mesenterialischämie','Differenzial: Herzinfarkt (Hinterwand), Lungenembolie, diabetische Ketoazidose, Basale Pneumonie'],tx:['ABCDE, 2 großlumige Zugänge, O₂ bei Hypoxie, Monitoring','Kristalloide **zurückhaltend** bei Blutung (permissive Hypotension bis OP/Endoskopie), bei Sepsis/Hypovolämie gezielt','Frühe Analgesie nach Bedarf (Metamizol, Paracetamol, Opioid titriert) – verschleiert den Befund nach aktueller Evidenz nicht','Nüchtern lassen; bei Ileus/Erbrechen Antiemetikum, Aspirationsrisiko beachten','Obere GI-Blutung: Pantoprazol 80 mg i.v.; Varizenblutung: Terlipressin 2 mg i.v., Antibiotikaprophylaxe (Ceftriaxon 1–2 g); Endoskopie < 24 h, bei Varizen < 12 h','Zielklinik mit Chirurgie, Endoskopie, Intensivstation (ggf. Voranmeldung)'],meds:['Metamizol 1–2 g Kurzinfusion (Hypotonie bei schneller Gabe)','Butylscopolamin 20 mg i.v. bei Koliken (nicht bei Ileus-Verdacht mit Tachykardie)','Pantoprazol 80 mg i.v.','Terlipressin 2 mg i.v. (Varizenblutung)'],cave:['Kein Dehnen/Abtasten bei Perforationsverdacht wiederholen','Antikoagulierte Patienten: Blutungsrisiko, Antagonisierung klären','Hohe Letalität bei Mesenterialischämie – frühe Bildgebung/Chirurgie'],merke:['Plötzlicher Schmerz + Schock = Gefäßkatastrophe, bis zum Beweis des Gegenteils','Frau im gebärfähigen Alter + Bauchschmerz = Schwangerschaftstest/Extrauteringravidität bedenken','Varizenblutung: Terlipressin + Antibiose + Endoskopie < 12 h'],ll:[['S2k-Leitlinie Gastrointestinale Blutung (AWMF 021-028)','https://register.awmf.org/de/leitlinien/detail/021-028']]},
{id:'elektrolyte',cat:'Internistische Notfälle',t:'Elektrolytentgleisungen (Hyperkaliämie, Hyponatriämie)',s:'Hyperkaliämie-EKG und Therapie, symptomatische Hyponatriämie',def:'Lebensbedrohliche Störungen von Kalium und Natrium, häufig bei Niereninsuffizienz, Dialyse, Diuretika oder Rhabdomyolyse.',dx:['**Hyperkaliämie:** hohe zeltförmige T-Wellen → verbreiterter QRS → PQ-Verlängerung/P-Verlust → Sinuswelle → Kammerflimmern/Asystolie','Symptome: Schwäche, Parästhesien, Bradykardie, Hypotonie; Auslöser: Niereninsuffizienz, Dialyseversäumnis, ACE-Hemmer, K⁺-sparende Diuretika, Rhabdomyolyse','**Hyponatriämie:** Kopfschmerz, Übelkeit, Verwirrtheit, Krampfanfall, Koma (Hirnödem)','Blutgasanalyse mit Elektrolyten prähospital/klinisch bestimmen, Blutzucker prüfen'],tx:['**Hyperkaliämie mit EKG-Veränderungen:** Calciumgluconat 10 % 10–20 ml i.v. über 2–3 min (Kardioprotektion), Wiederholung nach 5–10 min möglich','Shift: 10 IE Normalinsulin + 25 g Glukose (50 ml G50 %) über 15–30 min; Salbutamol 10–20 mg inhalativ; Bicarbonat 50–100 mmol bei Azidose','Elimination: Furosemid bei erhaltener Diurese, Hämodialyse bei Refraktärität/Anurie','Reanimation bei Hyperkaliämie: Calcium, Bicarbonat, Insulin/Glukose zusätzlich zur Standard-CPR (ERC)','**Symptomatische Hyponatriämie (Krampf, Koma):** 150 ml NaCl 3 % über 20 min, ggf. 1–2× wiederholen; Ziel +5 mmol/l, **max. +10 mmol/l in 24 h**','Asymptomatische/chronische Hyponatriämie: langsame Korrektur, Klinikaufnahme'],meds:['Calciumgluconat 10 % 10–20 ml i.v. langsam','Normalinsulin 10 IE + Glukose 25 g','Salbutamol 10–20 mg vernebelt','NaCl 3 % 150 ml über 20 min','Natriumbicarbonat 8,4 % 50–100 ml'],cave:['Calcium nicht in dieselbe Leitung wie Bicarbonat','Hypoglykämie nach Insulin: BZ-Kontrolle über 4–6 h','Zu schnelle Natrium-Korrektur → osmotische Demyelinisierung (zentrale pontine Myelinolyse)'],merke:['Hyperkaliämie mit EKG-Zeichen: zuerst Calcium','Kalium senken ≠ Kalium entfernen: Insulin/Glukose verschiebt nur, Dialyse entfernt','Hyponatriämie: bei Krampf/Koma NaCl 3 % Bolus, sonst langsam korrigieren'],ll:[['ERC Guidelines 2025 – Besondere Umstände','https://www.cprguidelines.eu']]},
{id:'blutung',cat:'Trauma',t:'Blutungsschock & Antikoagulanzien-Notfälle',s:'Hämorrhagischer Schock, Tranexamsäure, Antagonisierung',def:'Akuter Blutverlust mit Gewebehypoperfusion; Letalität steigt mit Blutverlust und Gerinnungsstörung. Antikoagulierte Patienten bluten stärker und länger.',dx:['Schockzeichen: Tachykardie, Hypotonie (spät!), Blässe, kalte Haut, verlängerte Rekap-Zeit, Bewusstseinsstörung','Klassen I–IV (ATLS): < 15 %, 15–30 %, 30–40 %, > 40 % Volumenverlust','Blutungsquelle suchen: extern, Thorax, Abdomen, Becken, Oberschenkel, retroperitoneal','Antikoagulanzien erfragen (Marcumar, DOAK, Heparin, Thrombozytenhemmer)'],tx:['**Kontrolle der Blutungsquelle zuerst:** Druckverband, Tourniquet, Beckenschlinge, Hämostyptika','2 große Zugänge/i.o., **permissive Hypotension** (systolisch ca. 80–90 mmHg, bei SHT höher) bis zur Blutstillung','**Tranexamsäure 1 g i.v. über 10 min** (möglichst < 3 h nach Verletzung), dann 1 g über 8 h','Wärmeerhalt; Kalzium bei Massivtransfusion; Fibrinogen früh (2–4 g), frühe Blutprodukte (Erythrozyten, Plasma)','Zielklinik: Schockraum/Traumazentrum, Voranmeldung, Massivtransfusionsprotokoll','**Antagonisierung:** Phenprocoumon → PPSB 25–50 IE/kg + Vitamin K 10 mg i.v.; Dabigatran → Idarucizumab 5 g; Faktor-Xa-Hemmer → Andexanet alfa oder PPSB 25–50 IE/kg; Heparin → Protamin (1 IE pro 1 IE Heparin)'],meds:['Tranexamsäure 1 g über 10 min, dann 1 g über 8 h','Fibrinogenkonzentrat 2–4 g','PPSB 25–50 IE/kg','Vitamin K 10 mg i.v.','Idarucizumab 5 g (Dabigatran)','Calcium 1–2 g bei Massivtransfusion'],cave:['Hypothermie, Azidose, Hypokalzämie = tödliche Trias, aktiv gegensteuern','Viel Kristalloid verdünnt Gerinnung → zurückhaltend','Tranexamsäure nicht überdosieren (Krampfrisiko bei hohen Dosen), Indikation: Blutung, nicht prophylaktisch'],merke:['Blutung stillen vor Volumen geben','TXA früh (< 3 h), nicht „nachträglich bei Gelegenheit“','Marcumar: PPSB + Vit K; Dabigatran: Idarucizumab'],ll:[['S3-Leitlinie Polytrauma/Schwerverletzten-Behandlung (AWMF 187-023)','https://register.awmf.org/de/leitlinien/detail/187-023']]},
{id:'niere',cat:'Internistische Notfälle',t:'Akutes Nierenversagen & Dialysepatient',s:'Prärenal, renal, postrenal; Hyperkaliämie, Überwässerung',def:'Akuter Abfall der glomerulären Filtration mit Anstieg der Retentionswerte; im Notfall relevant durch Hyperkaliämie, Überwässerung/Lungenödem und Azidose.',dx:['Prärenal (Volumenmangel, Sepsis, Herzinsuffizienz), renal (Tubulusnekrose, Rhabdomyolyse, Kontrastmittel, NSAR), postrenal (Harnverhalt, Steine)','Dialysepatient: Shuntarm schonen (kein Blutdruck/Zugang), Dialyseversäumnis → Hyperkaliämie/Lungenödem','Klinik: Oligo-/Anurie, Ödeme, Dyspnoe, Übelkeit, Verwirrtheit, Bradykardie','EKG und Kalium (BGA) sofort bei Verdacht'],tx:['Hyperkaliämie nach Standard (Calcium, Insulin/Glukose, Salbutamol, Bicarbonat)','Lungenödem bei Anurie: Nitro, CPAP; Furosemid nur bei erhaltener Diurese; Dialyse/Ultrafiltration ist kausal','Postrenal: Blasenkatheter/suprapubische Ableitung','Volumenmangel: Kristalloide gezielt; Nephrotoxine absetzen (NSAR, ACE-Hemmer)','Zielklinik mit Dialyse/Nephrologie'],meds:['Calciumgluconat 10 % 10–20 ml bei EKG-Veränderungen','Furosemid 40–80 mg i.v. (nur bei Restdiurese)','Nitro-Spray 0,4–0,8 mg bei Lungenödem und RR > 100 mmHg'],cave:['Kein Zugang/Blutdruck am Shuntarm','Keine NSAR, Vorsicht bei Gadolinium/Kontrastmittel','Dialysepatient ohne Dialyse > 3 Tage = Hyperkaliämie-Risiko'],merke:['Anurie + Lungenödem: Dialyse, nicht noch mehr Furosemid','Immer EKG und Kalium bei Nierenversagen','Postrenal = Katheter'],ll:[['KDIGO Clinical Practice Guideline Acute Kidney Injury','https://kdigo.org/guidelines/acute-kidney-injury/']]},
{id:'tamponade',cat:'Kardiovaskulär',t:'Herzbeuteltamponade, Schrittmacher- und ICD-Probleme',s:'Beck-Trias, Perikardpunktion, Magnet-Funktion',def:'Obstruktiver Schock durch Perikarderguss; außerdem Fehlfunktionen implantierter Geräte (Schrittmacher, ICD).',dx:['**Beck-Trias:** Hypotonie, Halsvenenstauung, leise Herztöne; Tachykardie, Pulsus paradoxus','Ursachen: Trauma (stumpf/penetrierend), Aortendissektion, Infarktruptur, Tumor, Urämie, Perikarditis','Sono: Perikarderguss, Kompression des rechten Ventrikels','**ICD:** Schockabgabe, „elektrischer Sturm“ (≥ 3 Schocks/24 h); **Schrittmacher:** Synkope, Bradykardie bei Fehlfunktion, Schrittmacherspikes im EKG'],tx:['Tamponade: Volumen überbrücken, Katecholamine; Perikardpunktion (sonografisch, subxiphoidal) oder Notfallthorakotomie bei Trauma; Zielklinik herzchirurgisch','Reanimation Tamponade: Perikardiozentese/Thorakotomie als reversible Ursache (4H/4T)','**ICD-Magnet** auf das Gerät unterdrückt Schockabgabe (Therapie-Pause, keine Änderung des Pacing); Magnet **entfernen** = Therapie wieder aktiv','Schrittmacher-Magnet: asynchrone Stimulation (VOO/AOO) – Fixfrequenz, kann bei Eigenrhythmus konkurrieren','Elektrischer Sturm: Sedierung, Amiodaron, Betablocker, Klinik mit EP-Labor','Defibrillation bei Gerätepatient: Pads ≥ 8 cm vom Aggregat, anterior-posterior'],meds:['Amiodaron 150–300 mg i.v. bei elektrischem Sturm','Noradrenalin zur Kreislaufstabilisierung bei Tamponade','Midazolam zur Sedierung bei wiederholten Schocks'],cave:['Diuretika und Vasodilatatoren verschlimmern die Tamponade (Vorlast!)','Magnet am ICD nicht dauerhaft liegen lassen','Elektrokauter/MRT: Gerät vorher prüfen/umprogrammieren'],merke:['Hypotonie + Halsvenenstau + leise Herztöne = Tamponade','ICD-Magnet stoppt Schocks, aber nicht das Pacing','Vorlast bei Tamponade erhalten, nicht senken'],ll:[['ESC Perikarderkrankungen','https://www.escardio.org']]},
{id:'co_rauch',cat:'Toxikologie',t:'CO- und Rauchgasvergiftung (Zyanid)',s:'CO-Hb, 100 % O₂, Hydroxocobalamin',def:'Inhalation von Kohlenmonoxid und weiteren Rauchgasen (Zyanidwasserstoff); häufig bei Wohnungsbränden, defekten Heizungen und Grillgeräten.',dx:['Symptome: Kopfschmerz, Schwindel, Übelkeit, Verwirrtheit, Synkope, Krampf, Myokardischämie','**Pulsoxymeter falsch normal** (CO-Hb wird als O₂-Hb gelesen) → CO-Oximetrie/BGA (CO-Hb)','Raucher können CO-Hb bis ca. 10 % haben','Zyanidverdacht bei Rauchgas + Koma/Kreislaufstillstand + Laktat > 8 mmol/l','Begleitend: Inhalationstrauma (Ruß, Stridor, Heiserkeit)'],tx:['Eigenschutz, Brandort verlassen, Frischluft','**100 % O₂** über Reservoirmaske (HWZ CO ca. 4–5 h unter Raumluft, ca. 60–90 min unter 100 % O₂)','Intubation bei Bewusstlosigkeit/Inhalationstrauma; Beatmung mit FiO₂ 1,0','**Hydroxocobalamin 5 g i.v.** über 15 min bei Zyanid-Verdacht (Kinder 70 mg/kg), ggf. wiederholen','Hyperbare Oxygenierung (HBO) erwägen bei Bewusstlosigkeit, neurologischen Symptomen, Schwangerschaft, CO-Hb > 25 %','Giftnotruf einbeziehen; Zielklinik mit ggf. HBO-Zugang'],meds:['Sauerstoff 100 %, 10–15 l/min','Hydroxocobalamin 5 g (70 mg/kg bei Kindern)','Beatmung FiO₂ 1,0'],cave:['SpO₂ nicht vertrauen, Zyanose fehlt (kirschrote Haut ist selten)','Verzögerte neurologische Spätschäden bis 4 Wochen','Natriumnitrit/4-DMAP als Zyanid-Antidot verschlechtern den O₂-Transport (Met-Hb) – bei Rauchgas Hydroxocobalamin bevorzugen'],merke:['CO: Pulsoxymeter lügt, 100 % O₂ sofort','Rauchgas + Schock/Koma = Zyanid denken → Hydroxocobalamin','HBO bei neurologischen Zeichen, Schwangeren, hohem CO-Hb'],ll:[['Giftinformationszentrum Nord','https://www.giz-nord.de']]},
{id:'alkohol_drogen',cat:'Toxikologie',t:'Alkohol, Drogen & Opioid-Intoxikation',s:'Toxidrome, Naloxon, Entzugsdelir, Wernicke',def:'Intoxikationen und Entzugssyndrome durch Alkohol, Opioide, Stimulanzien (Kokain, Amphetamine), Cannabinoide, GHB und Benzodiazepine.',dx:['**Opioid-Toxidrom:** Miosis, Atemdepression, Koma; **sympathomimetisch:** Mydriasis, Tachykardie, Hypertonie, Hyperthermie, Schwitzen; **anticholinerg:** Mydriasis, trockene Haut, Delir; **cholinerg:** Miosis, Bronchorrhoe, Speichelfluss','Immer Blutzucker, EKG (QRS, QTc), Temperatur, Trauma ausschließen','Alkohol: Ethanol-Menge klinisch unzuverlässig, Hypoglykämie und Wernicke-Enzephalopathie beachten','Entzugsdelir: Tremor, Halluzinationen, Tachykardie, Krampf (2–4 Tage nach letztem Konsum)'],tx:['ABCDE; Atemwegssicherung bei GCS ≤ 8','**Naloxon** fraktioniert 0,04–0,1 mg i.v. titrieren bis Atmung ausreichend (nicht bis Wachheit), alternativ 0,4 mg i.m./nasal; Wirkdauer kürzer als Opioid → Überwachung','Stimulanzien: Benzodiazepine (Midazolam, Lorazepam) für Erregung, Krampf, Hypertonie; Kühlung','Alkoholentzug/-delir: Benzodiazepine, Flüssigkeit, **Thiamin 100–200 mg i.v. vor Glukose**','Methanol/Ethylenglykol: Fomepizol oder Ethanol als Antidot, Dialyse (Giftnotruf)','GHB: Atemwegsschutz, keine spezifische Antidotgabe','Giftinformationszentrum kontaktieren'],meds:['Naloxon 0,04–0,1 mg i.v. fraktioniert','Midazolam 2–5 mg i.v. / Lorazepam 1–2 mg i.v.','Thiamin 100–200 mg i.v.','Glukose 40 % 20–40 ml bei Hypoglykämie'],cave:['Naloxon-Überdosierung löst akuten Entzug, Lungenödem, Erregung aus','Kein Flumazenil bei Mischintoxikation mit Krampfneigung (Trizyklika)','Wernicke: Thiamin vor Glukose'],merke:['Naloxon titrieren auf Atmung, nicht auf Bewusstsein','Entzugsdelir ist lebensbedrohlich: Benzodiazepine + Thiamin','Immer BZ und EKG bei Intoxikation'],ll:[['Giftinformationszentrum Nord','https://www.giz-nord.de']]},
{id:'paracetamol_pilze',cat:'Toxikologie',t:'Paracetamol-, Pilz- und Medikamentenintoxikation',s:'Acetylcystein, Knollenblätterpilz, Betablocker, Trizyklika',def:'Häufige Vergiftungen mit spezifischer Therapie; Giftinformationszentren (GIZ) beraten rund um die Uhr (z. B. GIZ-Nord Göttingen 0551 19240, Bonn 0228 19240, Berlin 030 19240).',dx:['**Paracetamol:** anfangs symptomlos oder Übelkeit; Leberschaden nach 24–72 h; Rumack-Matthew-Nomogramm ab 4 h nach Ingestion; ab ca. 7,5 g (Erwachsene) / 150 mg/kg toxisch','**Knollenblätterpilz:** Latenz 6–24 h, dann Brechdurchfall, danach Leberversagen','**Betablocker/Ca-Antagonisten:** Bradykardie, Hypotonie, Hypoglykämie (Betablocker)','**Trizyklika:** QRS-Verbreiterung, Krampf, anticholinerges Syndrom','Digitalis: Bradykardie, Rhythmusstörungen, Sehstörungen (Gelbsehen)'],tx:['Aktivkohle 1 g/kg innerhalb 1–2 h bei Ingestion toxischer Dosen und erhaltenen Schutzreflexen','**Paracetamol:** Acetylcystein i.v. 150 mg/kg über 1 h, dann 50 mg/kg über 4 h, dann 100 mg/kg über 16 h','Knollenblätterpilz: Aktivkohle, Silibinin, Intensivstation, Lebertransplant-Zentrum; Pilzreste sichern','Betablocker: Glukagon 3–10 mg i.v., Katecholamine, Insulin-Hochdosis; Calciumantagonisten: Calcium, Insulin','Trizyklika: Natriumbicarbonat 1–2 mmol/kg bei QRS-Verbreiterung; Benzodiazepine bei Krampf','Digitalis: Digitalis-Antidot (Fab-Fragmente), Magnesium','Monitoring, Zugang, Klinikaufnahme zur Überwachung'],meds:['Aktivkohle 1 g/kg','Acetylcystein 150 mg/kg über 1 h','Glukagon 3–10 mg i.v.','Natriumbicarbonat 8,4 % 1–2 mmol/kg','Silibinin 20 mg/kg/Tag (Knollenblätterpilz)'],cave:['Keine induzierte Emesis, kein Salzwasser','Aktivkohle bei Bewusstseinsstörung/Ileus/ätzenden Substanzen kontraindiziert','Paracetamolspiegel nicht vor 4 h sinnvoll interpretierbar'],merke:['Paracetamol: Acetylcystein, je früher desto besser (≤ 8 h nach Einnahme)','Knollenblätterpilz: symptomfreies Intervall täuscht','Giftnotruf anrufen, Verpackung/Reste sichern'],ll:[['Giftinformationszentrum Nord','https://www.giz-nord.de']]},
{id:'wirbelsaeule',cat:'Trauma',t:'Wirbelsäulen-, Becken- und Extremitätentrauma',s:'Immobilisation, neurogener Schock, Beckenschlinge, Amputation',def:'Verletzungen des Stütz- und Bewegungsapparates mit Risiko für Rückenmarksschaden, Blutverlust und Gliedmaßenverlust.',dx:['Wirbelsäule: Schmerz, Fehlstellung, neurologische Ausfälle (Sensibilität, Motorik, Priapismus), **neurogener Schock** (Hypotonie + Bradykardie, warme Haut)','Becken: Instabilität nur **einmal** prüfen; Blutungsquelle (bis > 2 l)','Extremität: **DMS** (Durchblutung, Motorik, Sensibilität) vor und nach Maßnahmen; offene Frakturen; Kompartment-Zeichen (Schmerz, Spannung, Parästhesie)','Amputation: komplett/subtotal'],tx:['Immobilisation: Vakuummatratze, Schaufeltrage, HWS-Immobilisation nach Kriterien (NEXUS/Canadian C-Spine); **Log-Roll**','Becken: **Beckenschlinge** in Höhe der Trochanteren; Blutung kontrollieren, TXA','Grobe Fehlstellung mit fehlender Durchblutung: achsengerechte Reposition, Schienung, DMS-Kontrolle','Offene Fraktur: steriler Verband, Antibiotika (z. B. Cefuroxim 1,5 g), Analgesie','Amputation: Stumpf steril mit Druckverband, ggf. Tourniquet; **Amputat** in steriles Tuch, trockener Beutel, dieser in Eiswasser (nicht direkt auf Eis); Replantationszentrum','Analgesie: Esketamin/Fentanyl titriert; Neurogener Schock: Volumen, Noradrenalin','Zielklinik: Traumazentrum (überregional/regional/lokal nach TraumaNetzwerk DGU)'],meds:['Esketamin 0,125–0,25 mg/kg i.v. (Analgesie)','Fentanyl 0,05–0,1 mg i.v. titriert','Noradrenalin bei neurogenem Schock','Cefuroxim 1,5 g i.v. bei offener Fraktur'],cave:['Methylprednisolon beim Rückenmarkstrauma nicht mehr empfohlen','Becken nicht wiederholt komprimieren („Beckenwackeln“)','Amputat nie direkt auf Eis oder in Flüssigkeit legen','Kompartmentsyndrom: Fasziotomie, kein Hochlagern'],merke:['Neurogener Schock = Hypotonie + Bradykardie + warme Haut','Beckenschlinge auf Trochanterhöhe, nicht auf Beckenkamm','DMS vor und nach jeder Manipulation'],ll:[['S3-Leitlinie Polytrauma (AWMF 187-023)','https://register.awmf.org/de/leitlinien/detail/187-023'],['TraumaNetzwerk DGU','https://www.dgu-online.de']]}
]);

{id:'urologie',cat:'Urologie, HNO & Augen',t:'Urologische Notfälle (Skrotum, Nierenkolik, Harnverhalt)',s:'Hodentorsion, Urosepsis, suprapubischer Katheter',def:'Akute Schmerz- und Obstruktionsnotfälle des Urogenitaltrakts; Hodentorsion ist ein zeitkritischer Notfall.',dx:['**Akutes Skrotum:** Hodentorsion (plötzlicher Schmerz, Hochstand, Kremasterreflex fehlt, Prehn-Zeichen negativ), Epididymitis (langsamer Beginn, Fieber, Prehn positiv)','Nierenkolik: wellenförmiger Flankenschmerz, Hämaturie, Erbrechen','**Fieber + Stein/Obstruktion = Urosepsis-Risiko**, urologischer Notfall','Harnverhalt: Schmerz, Unruhe, tastbare Blase'],tx:['Hodentorsion: sofortige Klinikzuweisung, Rettungsfenster ca. **6 h**; manuelle Detorsion nur als Überbrückung (Rotation nach außen, „Buch öffnen“)','Nierenkolik: NSAR (z. B. Diclofenac) oder Metamizol, ggf. Opioid; Butylscopolamin hat geringen Stellenwert','Obstruktion mit Infektion/Fieber: Antibiose (Ceftriaxon 2 g) und Entlastung (Stent/Nephrostomie) in der Klinik','Harnverhalt: transurethraler oder suprapubischer Katheter, bei Schwierigkeiten Klinik','Analgesie, Antiemese, Flüssigkeit'],meds:['Diclofenac 50–75 mg (NSAR) oder Metamizol 1–2 g i.v.','Fentanyl 0,05–0,1 mg i.v. bei starkem Schmerz','Ceftriaxon 2 g i.v. bei Fieber/Sepsis'],cave:['Hodenschmerz bei Kindern/Jugendlichen = Torsion bis zum Beweis des Gegenteils','Keine NSAR bei Niereninsuffizienz, Schwangerschaft','Kein Katheter bei V.a. Harnröhrenverletzung (Blut am Meatus nach Trauma)'],merke:['Skrotum akut + junger Patient: sofort Klinik, 6-Stunden-Fenster','Fieber + Kolik = Notfall (Urosepsis)'],ll:[['S2k-Leitlinie Urolithiasis (AWMF 043-025)','https://register.awmf.org/de/leitlinien/detail/043-025']]},
{id:'hno_auge',cat:'Urologie, HNO & Augen',t:'HNO-, Augen- und Zahnnotfälle',s:'Epistaxis, Fremdkörper, Verätzung, Zahntrauma',def:'Häufige Notfälle mit Blutung, Atemwegsgefährdung oder Seh-/Funktionsverlust.',dx:['Epistaxis: anterior (Locus Kiesselbach) meist harmlos; posterior mit Blutung in den Rachen','Nachblutung nach Tonsillektomie: kann akut lebensbedrohlich sein (Aspiration, Schock)','Auge: Verätzung/Verbrennung, Perforationsverdacht, Zentralarterienverschluss (schmerzloser Visusverlust), akutes Winkelblockglaukom (rotes, hartes Auge, Übelkeit)','Zahnunfall: Avulsion, Kieferfraktur'],tx:['Epistaxis: Kopf nach vorn, Nasenflügel 10–15 min komprimieren, Kühlung Nacken, ggf. TXA topisch/Nasentampon; posterior → Klinik','Tonsillen-Nachblutung: Atemweg sichern, absaugen, Volumen, Zugang, HNO-Klinik; Tranexamsäure bei Blutung','Ätzmittel-Auge: **sofort spülen** (Wasser/Ringer, 15–30 min), pH kontrollieren, Augenklinik; Kein Druckverband bei Perforation, steriler Schutzverband','Zentralarterienverschluss/Akutes Glaukom: sofort Augenklinik (Zeitfenster Stunden)','Avulsierter Zahn: nicht abwaschen, an der Krone halten, in Zahnrettungsbox/H-Milch, ≤ 30 min replantieren (zahnärztlich)','Fremdkörper Ohr/Nase: Klinik, keine Manipulation im Einsatz'],meds:['Tranexamsäure 1 g i.v. bei starker Blutung','Ringer-Lösung/NaCl 0,9 % zur Augenspülung','Analgesie: Paracetamol, Metamizol'],cave:['Bei Blutung aus dem Mund/Rachen: Atemweg zuerst, Aspirationsgefahr','Kein Druck auf perforiertes Auge','Epistaxis + Antikoagulation: Pausieren/Antagonisierung klären'],merke:['Augenverätzung: spülen, spülen, spülen','Zahn nicht abwaschen, nicht trocken lagern','Nachblutung nach Tonsillektomie = Atemwegsnotfall'],ll:[['Leitlinien im AWMF-Register suchen (HNO)','https://register.awmf.org']]},
{id:'meningitis',cat:'Neurologie',t:'Meningitis, Enzephalitis & ZNS-Infektionen',s:'Trias, Dexamethason, Ceftriaxon, Isolation',def:'Bakterielle Meningitis ist ein hochzeitkritischer Notfall (Letalität unbehandelt nahezu 100 %); Enzephalitis (v. a. HSV) braucht sofortiges Aciclovir.',dx:['Klassische Trias: Fieber, Nackensteifigkeit, Bewusstseinsstörung (nicht immer vollständig)','Kopfschmerz, Photophobie, Krampf, fokale Ausfälle; **Petechien** = Meningokokken-Sepsis (Waterhouse-Friderichsen)','Erwachsene: Pneumokokken, Meningokokken; ältere/immunsupprimierte: Listerien; Neugeborene: B-Streptokokken, E. coli','Liquorpunktion in der Klinik; **Antibiose nicht verzögern**, CT vor LP nur bei Fokal-/Bewusstseinsstörung'],tx:['**Ceftriaxon 2 g i.v.** prähospital/sofort bei Verdacht (Kinder 100 mg/kg)','**Dexamethason 10 mg i.v.** (vor oder mit der ersten Antibiotikagabe) bei bakterieller Meningitis','> 60 Jahre/immunsupprimiert: zusätzlich Ampicillin 2 g (Listerien)','V. a. Enzephalitis: Aciclovir 10 mg/kg i.v.','Sepsis-Therapie (Volumen, Noradrenalin), Krampftherapie','**Isolation** (Tröpfchen) 24 h nach Antibiotikastart bei Meningokokken; Postexpositionsprophylaxe Kontaktpersonen; Meldepflicht (IfSG)'],meds:['Ceftriaxon 2 g i.v. (Kinder 100 mg/kg)','Dexamethason 10 mg i.v.','Ampicillin 2 g i.v. (> 60 J)','Aciclovir 10 mg/kg i.v.'],cave:['Keine Verzögerung für CT/LP','Kind: Fontanelle gespannt, Berührungsempfindlichkeit, Trinkschwäche, Petechien','Eigenschutz: Mundschutz bei Meningokokken-Verdacht'],merke:['Antibiotikum vor Liquor, wenn LP verzögert','Petechien + Fieber = Meningokokken, sofort Ceftriaxon','Dexamethason zeitgleich zur ersten Antibiotikagabe'],ll:[['S2k-Leitlinie Ambulant erworbene bakterielle Meningoenzephalitis (AWMF 030-089)','https://register.awmf.org/de/leitlinien/detail/030-089']]},
{id:'neuromusk',cat:'Neurologie',t:'Guillain-Barré-Syndrom & myasthene Krise',s:'Atemversagen, Succinylcholin, Medikamente vermeiden',def:'Neuromuskuläre Notfälle mit drohendem Atemversagen.',dx:['**Guillain-Barré:** aufsteigende schlaffe Lähmung, Areflexie, nach Infekt; autonome Instabilität (Rhythmusstörungen, RR-Schwankungen)','**Myasthene Krise:** belastungsabhängige Schwäche, Ptosis, Dysphagie, Atemmuskelschwäche; Auslöser: Infekt, Medikamente, OP','Atemfunktion: Vitalkapazität < 20 ml/kg oder Abfall ≥ 30 % = Intubationsschwelle; Schluckstörung; Aspiration','Differenzial cholinerge Krise (Überdosierung Cholinesterasehemmer): Miosis, Hypersalivation, Bradykardie'],tx:['Atemwegssicherung frühzeitig (Intubation bei respiratorischer Insuffizienz, nicht abwarten bis Hyperkapnie)','**Succinylcholin kontraindiziert** (Hyperkaliämie bei Denervierung); bei myasthener Krise Rocuronium **sehr niedrig dosieren** (hohe Empfindlichkeit)','GBS: Immunglobuline i.v. oder Plasmapherese in der Klinik; Intensivstation','Myasthene Krise: Auslöser beseitigen, Immunglobuline oder Plasmapherese, Neurologie/Intensiv','Beobachtung der Atmung, Monitoring EKG (autonome Dysregulation)'],meds:['Rocuronium reduziert dosiert bei MG','Immunglobuline 0,4 g/kg/Tag über 5 Tage (Klinik)'],cave:['Medikamente, die eine MG verschlechtern: Aminoglykoside, Makrolide, Fluorchinolone, Magnesium, Betablocker, Muskelrelaxanzien','Succinylcholin bei GBS: Hyperkaliämie, Herzstillstand','Pulsoxymetrie spät – Atemmuskelschwäche früher klinisch erfassen'],merke:['GBS: aufsteigend + Areflexie + Atemkontrolle','Kein Succinylcholin bei neuromuskulären Erkrankungen','MG-Krise: Intubationsschwelle früh, Relaxanzien vorsichtig'],ll:[['S2e-Leitlinie Therapie immunvermittelter Neuropathien, u. a. GBS (AWMF 030-130)','https://register.awmf.org/de/leitlinien/detail/030-130']]},
{id:'kinder_atemweg',cat:'Pädiatrie',t:'Pseudokrupp, Epiglottitis & Fremdkörperaspiration',s:'Stridor, Steroid, Adrenalin inhalativ, Rückenschläge',def:'Häufigste obere Atemwegsnotfälle im Kindesalter.',dx:['**Pseudokrupp (Laryngotracheitis):** bellender Husten, inspiratorischer Stridor, Heiserkeit, 6 Monate–5 Jahre, nachts; Schweregrad nach Westley (Stridor in Ruhe, Einziehungen)','**Epiglottitis** (selten, Hib-Impfung): hohes Fieber, Speichelfluss, kloßige Sprache, Kind sitzt vornübergebeugt, kein Husten','**Fremdkörperaspiration:** plötzlicher Husten/Würgen beim Essen oder Spielen; Stridor oder Aphonie','Pulsoxymetrie, Atemarbeit, Vigilanz'],tx:['Pseudokrupp: ruhig lassen (Eltern), **Prednison/Prednisolon 100 mg rektal** (oder Dexamethason 0,15 mg/kg p.o./i.v.); bei Stridor in Ruhe **Adrenalin inhalativ** 4–5 ml unverdünnt (Epinephrin 1 mg/ml); O₂','Epiglottitis: **keine Racheninspektion, kein Hinlegen, keine Belastung**; Sauerstoff-Vorlage, Intubation durch erfahrenen Anästhesisten/HNO in Intubationsbereitschaft; Ceftriaxon','Fremdkörper (Kind > 1 Jahr): Husten fördern; bei insuffizientem Husten 5 Rückenschläge, dann Heimlich/Oberbauchkompression; Säugling: 5 Rückenschläge + 5 Thoraxkompressionen','Bewusstlos: CPR, Atemwegsinspektion, Fremdkörper unter Sicht entfernen (Magill-Zange)','Zielklinik mit Kinderintensiv/Bronchoskopie'],meds:['Prednisolon 100 mg rektal oder Dexamethason 0,15 mg/kg','Adrenalin 1 mg/ml inhalativ 4–5 ml','Ceftriaxon 50–100 mg/kg (Epiglottitis)'],cave:['Keine Racheninspektion bei Epiglottitis-Verdacht','Kein Blindes Auswischen des Fremdkörpers','Keine Sedierung bei drohender Atemwegsobstruktion ohne Intubationsbereitschaft'],merke:['Pseudokrupp: Kortikoid + Adrenalin inhalativ bei Ruhestridor','Epiglottitis: Kind nicht anfassen, Atemweg in Bereitschaft','Säugling: 5 Rückenschläge + 5 Thoraxkompressionen'],ll:[['ERC Guidelines 2025 – Paediatric Life Support','https://www.cprguidelines.eu']]},
{id:'fieberkrampf',cat:'Pädiatrie',t:'Fieberkrampf & Säuglingsnotfälle',s:'Midazolam bukkal, Diazepam rektal, SIDS/BRUE',def:'Fieberkrampf: epileptischer Anfall im Rahmen eines Infekts bei Kindern zwischen 6 Monaten und 5 Jahren ohne ZNS-Infektion.',dx:['**Einfacher Fieberkrampf:** generalisiert, < 15 min, einmalig in 24 h','Komplizierter Fieberkrampf: fokal, > 15 min oder Wiederholung → Klinik','Differenzial: Meningitis, Hypoglykämie, Elektrolytstörung, Intoxikation','BRUE (kurzzeitige Atemstörung, Zyanose, Hypotonie) und Fieber < 3 Monate: immer Klinikabklärung'],tx:['Meist selbstlimitierend < 5 min: Schutz vor Verletzung, Seitenlage, Temperatur messen','**Krampf > 5 min:** Midazolam bukkal 0,3–0,5 mg/kg (max. 10 mg) oder nasal 0,2 mg/kg; Diazepam rektal 5 mg (< 15 kg), 10 mg (> 15 kg); i.v.: Midazolam 0,1 mg/kg oder Lorazepam 0,1 mg/kg','Blutzucker kontrollieren, Glukose 10 % 2–4 ml/kg bei Hypoglykämie','Fiebersenkung nicht zur Krampfprophylaxe nötig','Klinik: Alter < 12 Monate, komplizierter Verlauf, V. a. Meningitis, Nackensteife'],meds:['Midazolam bukkal 0,3–0,5 mg/kg','Diazepam rektal 5/10 mg','Lorazepam 0,1 mg/kg i.v.','Glukose 10 % 2–4 ml/kg'],cave:['Atemdepression nach Benzodiazepinen – Monitoring','Fieber < 3 Monate: kein „einfaches“ Fieber, immer Sepsis/Meningitis ausschließen','Elternberatung: Wiederholungsrisiko ca. 30 %'],merke:['Krampf > 5 min = Benzodiazepin','Immer BZ messen','Säugling < 3 Monate mit Fieber = Klinik'],ll:[['S1-Leitlinie Fieberkrämpfe im Kindesalter (AWMF 022-005, in Überarbeitung)','https://register.awmf.org/de/leitlinien/detail/022-005']]},
{id:'gewalt',cat:'Psychiatrie & Recht',t:'Kindesmisshandlung & häusliche Gewalt',s:'Warnzeichen, Dokumentation, KKG, Hilfetelefone',def:'Verdacht auf Gewalt erfordert sensible Beobachtung, sorgfältige Dokumentation und Weiterleitung an geeignete Stellen.',dx:['Kind: Inkonsistente Anamnese, verzögerte Vorstellung, Verletzungen an untypischen Stellen (Rücken, Ohr, Oberarm, Genital), Hämatome verschiedenen Alters, Schütteltrauma','Häusliche Gewalt: wiederholte Verletzungen, Angst, Kontrolle durch Partner, Begründungen passen nicht','Vernachlässigung: Hygiene, Ernährung, Aufsicht','Rechtsmedizinische Dokumentation: Verletzungen, Fotos (mit Einwilligung), Zeitpunkt, Zitate'],tx:['Sicherheit des Patienten zuerst; Kind nicht allein bei Gefahr lassen; wertfrei fragen','**Dokumentation objektiv und detailliert** (Lokalisation, Größe, Farbe, Aussage in Zitaten)','Weitergabe: **KKG § 4** (Befugnis zur Information des Jugendamts); Medizinische Kinderschutzhotline 0800 19 210 00','Hilfetelefon „Gewalt gegen Frauen“ 116 016, Frauenhäuser; Gewaltschutzgesetz; vertrauliche Spurensicherung','Transport in geeignete Klinik (Kinderschutzgruppe); Polizei bei akuter Gefährdung'],meds:[],cave:['Eigene Interpretationen vermeiden, Tatbestände nicht ermitteln','Schweigepflicht nur mit Rechtfertigung durchbrechen (KKG, Notstand)','Schütteltrauma: Atemstörungen, Krampf, Erbrechen bei Säuglingen – bildgebend abklären'],merke:['Beobachten, dokumentieren, weiterleiten – nicht ermitteln','KKG § 4: stufenweises Vorgehen, im Notfall sofort Jugendamt/Polizei','Kinderschutzhotline 0800 19 210 00'],ll:[['Medizinische Kinderschutzhotline','https://www.kinderschutzhotline.de'],['Hilfetelefon Gewalt gegen Frauen','https://www.hilfetelefon.de']]},
{id:'schwanger_trauma',cat:'Geburtshilfe',t:'Trauma und Reanimation in der Schwangerschaft',s:'Linksseitenlage, Uterusverlagerung, Notsectio',def:'Mütterliche Stabilisierung sichert das Überleben des Fetus; ab ca. 20. SSW komprimiert der Uterus die V. cava.',dx:['Vena-cava-Kompressionssyndrom ab ca. 20 SSW: Hypotonie in Rückenlage','Trauma: Plazentaablösung (Schmerz, vaginale Blutung, harter Uterus), Uterusruptur, fetomaternale Transfusion','Hypotonie, Tachykardie erst spät (Blutvolumen +40 %)','Reanimation: reversible Ursachen (Blutung, Eklampsie, Lungenembolie, Fruchtwasserembolie, Anästhesiekomplikationen)'],tx:['**Manuelle Uterusverlagerung nach links** oder 15–30° Linksseitenlage (Keil)','Stabilisierung der Mutter: O₂, Volumen, TXA bei Blutung','**Reanimation:** Standard-CPR, Defibrillation unverändert, Uterusverlagerung; **Notsectio** ab 4 min ohne ROSC (Entbindung ca. 5 min nach Stillstand, Ziel < 5 min)','Rh-negativ: Anti-D-Prophylaxe nach Trauma','Zielklinik mit Geburtshilfe/Neonatologie, frühe Voranmeldung','Neonatale Reanimation vorbereiten (NLS)'],meds:['Tranexamsäure 1 g i.v. bei Blutung','Anti-D-Immunglobulin 300 µg (Rh-neg.)','Magnesium 4–6 g i.v. bei Eklampsie'],cave:['Medikamente und Strahlung: Mutter-Nutzen vor Fetusrisiko','Keine Verzögerung der Reanimation wegen Schwangerschaft','Bauchtrauma: Plazentaablösung auch bei geringem Trauma möglich'],merke:['Mutter zuerst stabilisieren, Uterus nach links','Notsectio nach 4 min ohne ROSC','Anti-D bei Rh-negativen Frauen nach Trauma'],ll:[['ERC Guidelines 2025 – Besondere Umstände','https://www.cprguidelines.eu']]},
{id:'palliativ',cat:'Psychiatrie & Recht',t:'Palliative Notfälle & Therapiezieländerung',s:'Atemnot, Schmerz, terminale Unruhe, Notfallbogen',def:'Krisen bei Patienten mit fortgeschrittener, nicht heilbarer Erkrankung; Ziel ist Symptomkontrolle und Orientierung am Patientenwillen.',dx:['Häufige Krisen: Dyspnoe, Schmerz, Delir, Übelkeit, Blutung, terminales Rasseln','Therapieziel klären: Patientenverfügung, Vorsorgevollmacht, Notfallbogen/ReSPECT, behandelnder Arzt, SAPV-Team','Prognose, Wille, Umfeld (Angehörige) erfassen'],tx:['Dyspnoe: Oberkörper hoch, O₂ nur bei Hypoxie, **Morphin 2,5–5 mg i.v.** (oder s.c.), ggf. Midazolam 2,5 mg','Schmerz: Opioid titriert, Begleitmedikation','Terminales Rasseln: Butylscopolamin 20 mg s.c./i.v., Lagerung','Delir/Unruhe: Haloperidol 0,5–2 mg, Midazolam','Blutung: dunkle Tücher, Midazolam bei Palliativsituation','Kontakt zu SAPV/Hausarzt, Therapiebegrenzung dokumentieren; Angehörigen begleiten'],meds:['Morphin 2,5–5 mg i.v./s.c.','Midazolam 2,5–5 mg i.v./s.c.','Haloperidol 0,5–2 mg','Butylscopolamin 20 mg'],cave:['Reanimation bei dokumentierter Therapiebegrenzung/DNAR nicht beginnen; Unklarheit: Reanimation beginnen und sofort klären','Keine Verzögerung der Symptomkontrolle wegen Rechtsunsicherheit','Angehörige einbeziehen, aber Patientenwillen entscheidet'],merke:['Symptomkontrolle vor Diagnostik','Therapieziel erfragen und dokumentieren','Morphin gegen Atemnot ist indiziert'],ll:[['S3-Leitlinie Palliativmedizin (AWMF 128-001OL; onkologisch, Symptomkontrolle übertragbar)','https://register.awmf.org/de/leitlinien/detail/128-001OL']]},
{id:'org_system',cat:'Organisation',t:'Rettungsdienstsystem, Leitstelle & Zielklinik',s:'Notarzt-Indikation, Telenotarzt, Netzwerke, IVENA',def:'Rettungsdienst ist Ländersache; Leitstellen disponieren nach standardisierter Notrufabfrage; Zielklinik nach Netzwerken (Trauma, Stroke, Chest Pain Unit).',dx:['Notrufnummer **112**; Krankentransport 116 117 (ärztlicher Bereitschaftsdienst)','Notarzt-Indikationskatalog (BÄK): lebensbedrohliche Situation, Bewusstlosigkeit, schwere Atemnot, Schock etc.','Notfallsanitäter: Heilkundeausübung nach § 2a NotSanG, **SAA/Algorithmen** (Pyramidenprozess) des Ärztlichen Leiters Rettungsdienst (ÄLRD)','Telenotarzt: telemedizinische Unterstützung, Delegation, Medikamentengabe nach Algorithmus','Zielklinik-Auswahl: **TraumaNetzwerk DGU** (überregional/regional/lokal), Stroke Unit, Chest Pain Unit, Verbrennungszentrum, Perinatalzentrum, Schockraum','Hubschrauber: RTH (Tageslicht), ITH für Interhospitaltransfer'],tx:['Voranmeldung nach Schema; **IVENA** zeigt Kapazitäten','**Schockraum-Alarm** nach Kriterien (RR < 90, GCS < 9, Intubation etc.)','Übergabe nach **ISBAR**','Qualitätssicherung: Dokumentation, Einsatznachbesprechung, Fehlerkultur (CIRS)','Rendezvous-System: NEF und RTW treffen sich getrennt'],meds:[],cave:['Nächste geeignete, nicht nächste Klinik','Voranmeldung verbessert Behandlungszeit','Delegation nur im Rahmen der Qualifikation und SAA'],merke:['Richtige Klinik, nicht nächste Klinik','ISBAR für Übergabe','Nach Standard handeln, bei Abweichung begründen'],ll:[['Bundesärztekammer Notarzt-Indikationskatalog','https://www.bundesaerztekammer.de'],['TraumaNetzwerk DGU','https://www.dgu-online.de']]},
{id:'crm_transfer',cat:'Organisation',t:'CRM, Interhospitaltransfer & Hygiene',s:'Crew Resource Management, Verlegung, Infektionsschutz',def:'Nicht-technische Fertigkeiten und Transportorganisation verbessern Sicherheit; Hygiene schützt Patienten und Team.',dx:['**CRM:** Kommunikation (Closed Loop), Situationsbewusstsein, Führung/Teamarbeit, Entscheidungsfindung, Ressourcenmanagement','Interhospitaltransfer: Indikation (höhere Versorgungsstufe), Stabilität, Transportmittel (ITW/ITH), Arzt-zu-Arzt-Übergabe','Hygiene: Händedesinfektion (5 Momente), persönliche Schutzausrüstung, Fahrzeugdesinfektion','Meldepflichtige Erkrankungen (IfSG): z. B. Meningokokken, Tuberkulose, Masern'],tx:['Closed-Loop-Kommunikation, klare Rollenverteilung, „Speak up“','Vor Transfer: Stabilisieren, Zugang/Atemweg sichern, Dokumente/Bildgebung mitgeben, Zielklinik bestätigen','Intensivtransport: ärztliche Begleitung, Monitoring, Beatmungsgerät, Spritzenpumpen, Notfallmedikamente','Isolation: MRSA/ESBL Kontaktisolation, Tröpfchen bei Meningokokken/Influenza, Aerosol bei Tbc/Masern (FFP2)','Nadelstichverletzung: ausbluten lassen, desinfizieren, Meldung D-Arzt, PEP prüfen','Nachbesprechung (Debriefing), CIRS-Meldung'],meds:[],cave:['Unkontrollierte Stressbelastung: Einsatznachsorge (PSNV)','Verlegung ohne Stabilisierung vermeiden','Keine Verwechslung bei Übergabe: ISBAR/SBAR'],merke:['CRM: Kommunikation, Führung, Situationsbewusstsein','Interhospitaltransfer: Stabilisieren vor Transport','Nadelstich: sofort melden'],ll:[['DIVI Empfehlungen Interhospitaltransfer','https://www.divi.de']]}

["Fallbeispiele","Fall: 34-J., 36. SSW, Verkehrsunfall, Bauchschmerz, vaginale Blutung, harter Uterus. Verdacht?","Plazentaablösung: Linksseitenlage/Uterusverlagerung, Volumen, TXA, Notfall-Sectio-Klinik (Geburtshilfe), Anti-D bei Rh-negativ."],
["Fallbeispiele","Fall: Schwangere (30. SSW) reanimationspflichtig. Besonderheiten?","Manuelle Uterusverlagerung nach links, Standard-CPR und -Defibrillation, reversible Ursachen, Notsectio ab 4 min ohne ROSC (Entbindung < 5 min)."],
["Fallbeispiele","Fall: 70-J., Karzinom im Endstadium, Atemnot, Patientenverfügung mit Therapiebegrenzung. Maßnahmen?","Palliative Symptomkontrolle: Oberkörper hoch, Morphin 2,5–5 mg, Midazolam bei Angst, SAPV/Hausarzt, Verlegung nicht erzwingen; keine Reanimation gemäß Verfügung."],
["Fallbeispiele","Fall: Kind 18 Monate, Hämatome am Rücken und Ohr, Eltern inkonsistent. Vorgehen?","Kindesmisshandlung-Verdacht: Kind schützen, objektive Dokumentation, KKG § 4/Jugendamt, Kinderschutzhotline 0800 19 210 00, Klinik mit Kinderschutzgruppe."],
["Fallbeispiele","Fall: 18-J., Motorradunfall, Beckenfraktur, RR 80/50, HF 125. Maßnahmen?","Beckenschlinge (Trochanterhöhe), TXA 1 g, permissive Hypotension, Wärmeerhalt, Schockraum/Traumazentrum, Blutprodukte."],
["Fallbeispiele","Fall: Amputation Zeigefinger durch Kreissäge. Versorgung?","Stumpf steril/Druckverband, Amputat in steriles Tuch → trockener Beutel → in Eiswasser (nicht direkt auf Eis), Analgesie, Replantationszentrum."],
["Fallbeispiele","Fall: Epistaxis seit 40 min, Blutverdünner, Hypotonie. Vorgehen?","Kopf nach vorn, Nasenflügel komprimieren, Kühlung, Atemweg beachten, ggf. TXA, Volumen, Klinik; Antikoagulation klären."],
["Fallbeispiele","Fall: 2-J., Fieberkrampf > 5 min. Therapie?","Midazolam bukkal 0,3–0,5 mg/kg (oder Diazepam rektal 5 mg < 15 kg), BZ messen, Klinik bei komplizierter Verlaufsform oder < 12 Monate."],
["Fallbeispiele","Fall: Patient mit ICD, 3 Schocks innerhalb 20 min. Vorgehen?","Elektrischer Sturm: Sedierung, Amiodaron, Betablocker, Monitoring; Magnet stoppt Schockabgabe; Klinik mit EP/Intensiv."],
["Fallbeispiele","Fall: Trauma, Hypotonie, Halsvenenstauung, leise Herztöne. Verdacht?","Herzbeuteltamponade (Beck-Trias): Vorlast erhalten, Perikardpunktion/Thorakotomie in Klinik, keine Diuretika/Vasodilatatoren."],
["Fallbeispiele","Fall: 50-J., Nierenkolik mit Fieber 39 °C. Warum Notfall?","Obstruktion + Infektion = Urosepsis-Risiko: Ceftriaxon, Analgesie, dringende urologische Entlastung (Stent/Nephrostomie)."]
]);

<script>
window.CARDS=(window.CARDS||[]).concat([
["Fallbeispiele","Fall: 58-J., Brustschmerz 40 min, ST-Hebung II, III, aVF, RR 85/50, Bradykardie. Vorgehen?","Inferiorer STEMI mit möglichem RV-Infarkt: rechtsventrikuläre Ableitungen (V4R), Nitro vermeiden, Volumen, Atropin bei Bradykardie, ASS 250–500 mg, Heparin, direkt in PCI-Zentrum (Voranmeldung)."],
["Fallbeispiele","Fall: 32-J., plötzliche Dyspnoe, Pleuraschmerz, Tachykardie, nach Langstreckenflug. Verdacht und Maßnahmen?","Lungenembolie: O₂, Monitoring, Heparin 5000 IE i.v. bei hoher Wahrscheinlichkeit, bei instabiler Hämodynamik Lyse erwägen; Klinik mit Bildgebung/Intensiv."],
["Fallbeispiele","Fall: 12-J., Asthmaanfall, silent chest, SpO₂ 88 %. Therapie?","O₂, Salbutamol + Ipratropium inhalativ, Prednisolon 1–2 mg/kg i.v., Magnesium 25–50 mg/kg, ggf. Adrenalin; bei Erschöpfung Intubation vorbereiten (Ketamin)."],
["Fallbeispiele","Fall: 40-J., nach Wespenstich Urtikaria, Stridor, RR 70/40. Therapie?","Anaphylaxie Grad III: Adrenalin 0,3–0,5 mg i.m. (Oberschenkel), Volumen, O₂, Dimetinden, Prednisolon, bei Bronchospasmus Salbutamol; Beobachtung wegen biphasischem Verlauf."],
["Fallbeispiele","Fall: 70-J., Halbseitenlähmung rechts, Aphasie, Symptombeginn vor 90 min. Maßnahmen?","Schlaganfall: BE-FAST, Zeit festhalten, BZ messen, RR nur bei > 220/120 senken, Stroke Unit mit Voranmeldung, keine ASS prähospital."],
["Fallbeispiele","Fall: 30-J., Status epilepticus, Anfall seit 10 min. Medikamente?","Midazolam i.m. 10 mg (> 40 kg) oder Lorazepam 0,1 mg/kg i.v.; bei Persistenz Levetiracetam/Valproat; BZ prüfen, Atemweg."],
["Fallbeispiele","Fall: Fahrradunfall ohne Helm, GCS 7, Pupille links weit. Maßnahmen?","Schweres SHT: Intubation, Normoxie/Normokapnie, RR syst. > 110, Oberkörper 30°, bei Einklemmung hyperton NaCl, Neurochirurgie/Traumazentrum."],
["Fallbeispiele","Fall: 75-J., Fieber, RR 80/45, Atemfrequenz 28, GCS 13, Hautmottling. Handeln?","Septischer Schock: Sauerstoff, Kristalloide 30 ml/kg, Noradrenalin bei fehlender Stabilisierung, Antibiotikum innerhalb 1 h, Laktat, Intensivklinik."],
["Fallbeispiele","Fall: 8-J. Typ-1-Diabetes, Krampf, BZ 32 mg/dl. Therapie?","Hypoglykämie: Glukose 10 % 2–4 ml/kg i.v. (Erw. G40 25–50 ml), alternativ Glukagon 1 mg i.m.; BZ kontrollieren, Ursache klären."],
["Fallbeispiele","Fall: Verpuffung, 35-J., Verbrennung Rumpf/Arme, Ruß im Mund, Heiserkeit. Vorgehen?","Verbrennung + Inhalationstrauma: Atemweg früh sichern, Kühlen (20 min, nicht Hypothermie), Analgesie, Volumen (Parkland), Brandverletztenzentrum, Zyanid/CO bedenken."],
["Fallbeispiele","Fall: Messerstich Thorax, Dyspnoe, Halsvenenstau, Atemgeräusch rechts aufgehoben, RR 70/40. Maßnahme?","Spannungspneumothorax: sofortige Entlastung (Nadel/Thorakostomie 4./5. ICR vordere/mittlere Axillarlinie), O₂, dann Drainage."],
["Fallbeispiele","Fall: Wanderer, 32 °C Kerntemperatur, Zittern fehlt, schläfrig. Maßnahmen?","Moderate Hypothermie: horizontal, schonend bewegen, warm einpacken, Wärmeluft aktiv; keine intensive Bewegung (Kammerflimmern); Klinik, bei Kreislaufstillstand ECLS."],
["Fallbeispiele","Fall: Marathonläufer, Körpertemperatur 41,5 °C, GCS 9. Therapie?","Hitzschlag: aktive Kühlung (Kaltwasserimmersion, Eispacks), Volumen, Atemweg/Krampf behandeln, Klinik; Antipyretika wirkungslos."],
["Fallbeispiele","Fall: 28-J., 34. SSW, RR 175/110, Kopfschmerz, Sehstörung. Maßnahmen?","Präeklampsie schwer: Magnesium 4–6 g i.v. über 15–20 min, dann 1–2 g/h; Blutdruck senken (Urapidil, Nifedipin), Geburtshilfe-Klinik, Antikonvulsiva bei Eklampsie."],
["Fallbeispiele","Fall: Geburt zu Hause, Plazenta geboren, starker Blutverlust. Therapie?","Postpartale Blutung: Uterusmassage, Oxytocin 3–5 IE langsam i.v., TXA 1 g, Volumen/Blutprodukte, Klinik; bei Atonie Prostaglandin in der Klinik."],
["Fallbeispiele","Fall: 22-J. mit Suizidabsicht, wirkt ruhig, verweigert Klinik. Vorgehen?","Einwilligungsfähigkeit prüfen; bei akuter Eigengefährdung Unterbringung nach PsychKG (Polizei/Ordnungsamt/Amtsarzt), Begleitung nicht allein lassen, dokumentieren."],
["Fallbeispiele","Fall: Polytrauma, GCS 6, Aspirationsgefahr, RR 85/50. Wie narkotisieren?","Prähospitale RSI: Präoxygenierung, Etomidat oder Ketamin (dosisreduziert bei Schock), Rocuronium 1 mg/kg, in-line Stabilisierung, Videolaryngoskopie, Notfallalgorithmus (Cormack/Bougie)."],
["Fallbeispiele","Fall: Busunfall, 20 Verletzte, 3 Rettungsmittel. Erste Maßnahmen?","MANV: Lagemeldung, Einsatzleitung, Sichtung (z. B. mSTaRT), Behandlungsplatz, Transportprioritäten; zuerst Atemweg/Blutungskontrolle bei Rot."],
["Fallbeispiele","Fall: 4-J., bewusstlos, keine normale Atmung. Reanimation?","PLS: 5 initiale Beatmungen, dann 15:2, Frequenz 100–120/min, Kompressionstiefe 1/3 Thoraxdurchmesser; Adrenalin 10 µg/kg alle 3–5 min, Defibrillation 4 J/kg."],
["Fallbeispiele","Fall: Neugeborenes nach Geburt blass, Atemantrieb fehlt, HF 70/min. Vorgehen?","NLS: abtrocknen, wärmen, Atemweg öffnen, 5 Beatmungen mit Raumluft/21–30 % O₂; HF < 60 trotz Beatmung: Thoraxkompressionen 3:1, Adrenalin 10–30 µg/kg."],
["Fallbeispiele","Fall: 82-J., Synkope, HF 32/min, RR 70/40, AV-Block III. Therapie?","Instabile Bradykardie: Atropin 0,5 mg (kann bei infranodalem Block versagen), dann transkutanes Pacing oder Adrenalin/Noradrenalin-Perfusor; Klinik mit Schrittmacher."],
["Fallbeispiele","Fall: 55-J., Palpitationen, HF 180 breit, RR 75/40, Bewusstseinstrübung. Therapie?","Instabile Tachykardie: synchronisierte Kardioversion (120–150 J biphasisch), Analgosedierung; bei Rezidiv Amiodaron 300 mg."],
["Fallbeispiele","Fall: 68-J., Dyspnoe, Schaum vor dem Mund, RR 180/100, Rasselgeräusche. Therapie?","Kardiales Lungenödem: Oberkörper hoch, Nitro 0,8 mg s.l./Spray (bei RR > 100), Furosemid 40 mg, CPAP/NIV, O₂, Monitoring, Klinik."],
["Fallbeispiele","Fall: 50-J., Rückenschmerz reißend zwischen Schulterblättern, RR-Differenz Arme. Verdacht?","Aortendissektion: Schmerz- und Blutdrucktherapie (Zielwert systolisch 100–120, Herzfrequenz 60–80) mit Betablocker/Urapidil, schnellste Klinikanmeldung (Gefäßchirurgie/CT)."],
["Fallbeispiele","Fall: Taucher nach schnellem Aufstieg, Schwindel, Parästhesien, Atemnot. Verdacht?","Dekompressionskrankheit/Gasembolie: 100 % O₂, flach lagern, Flüssigkeit, Kontakt Druckkammer/Giftnotruf, keine Rekompression im Wasser; Transport zur Druckkammer."],
["Fallbeispiele","Fall: Leiche mit Totenflecken, Totenstarre, Fäulnis. Was ist zu tun?","Todesfeststellung (sichere Todeszeichen), vollständige Leichenschau (unbekleidet), Todesart natürlich/nicht natürlich/ungeklärt, bei nicht natürlich Polizei; Dokumentation."]

als:[
["Wie läuft der ALS-Algorithmus bei VF/pulsloser VT ab?","Rhythmusanalyse → Schock (1×) → sofort 2 min CPR → nach 3. Schock Adrenalin 1 mg + Amiodaron 300 mg; Adrenalin danach alle 3–5 min, Amiodaron 150 mg nach 5. Schock; 4H/4T behandeln."],
["Qualitätsmerkmale der Thoraxkompression nach ERC?","Mitte Brustkorb, 5–6 cm Tiefe, 100–120/min, vollständige Entlastung, Unterbrechungen minimal (< 5 s), Kompression:Beatmung 30:2 ohne Atemweg."],

["Wann ECLS/eCPR erwägen?","Therapierefraktärer Kreislaufstillstand mit potenziell reversibler Ursache (Hypothermie, Lungenembolie, Intoxikation) in geeigneten Zentren/Programmen."]],
postrea:[
["Zielwerte in der Postreanimationsbehandlung?","SpO₂ 94–98 %, PaCO₂ normal (35–45 mmHg), MAP ≥ 65 mmHg, Normoglykämie, Temperaturkontrolle (Fieber vermeiden, ≤ 37,5 °C)."],
["Welche Diagnostik nach ROSC?","12-Kanal-EKG (STEMI → PCI), BGA, Echo, Zielklinik mit Herzkatheter und Intensivstation, Ursache suchen."]],
plsrea:[

nls:[
["Erste Schritte der Neugeborenenversorgung?","Abtrocknen, wärmen, Atemweg frei, Stimulation; bei Apnoe/HF < 100: 5 Beatmungen mit Raumluft/21–30 % O₂; HF < 60 → Thoraxkompressionen 3:1."],
["Wann Adrenalin beim Neugeborenen?","HF < 60/min trotz effektiver Beatmung und Thoraxkompression: 10–30 µg/kg i.v./i.o."]],
acs:[
["Therapie beim STEMI?","ASS 150–300 mg, Heparin, Analgesie, Reperfusion: primäre PCI (Ziel Door-to-Balloon/FMC-to-Device ≤ 90 min bzw. ≤ 120 min), sonst Lyse (< 10 min Entscheidungsziel)."],
["Warum bei inferiorem STEMI Nitro vorsichtig?","Mögliche RV-Beteiligung: vorlastabhängig, Nitro → Hypotonie; V4R ableiten, Volumen."],
["Ab wann gilt ein STEMI im EKG?","ST-Hebung ≥ 0,1 mV in ≥ 2 benachbarten Ableitungen (V2–V3: ≥ 0,2 mV bei Männern ≥ 40 J.) oder neuer LSB mit Klinik."]],
akutHI:[
["Therapie des kardialen Lungenödems?","Oberkörper hoch, O₂, Nitro (RR > 100 mmHg), Furosemid, CPAP/NIV, ggf. Morphin vorsichtig; kardiogener Schock: Noradrenalin/Dobutamin."],
["Definition kardiogener Schock?","Hypotonie (syst. < 90 mmHg) trotz Volumen mit Zeichen der Hypoperfusion (Laktat, Oligurie, kalte Haut)."]],
tachy:[
["Vorgehen bei instabiler Tachykardie?","Synchronisierte Kardioversion (VT/VHF 120–150 J biphasisch, Vorhofflattern/SVT 70–120 J), Analgosedierung; bei Rezidiv Amiodaron 300 mg."],
["Therapie der stabilen SVT?","Vagale Manöver (modifizierter Valsalva), dann Adenosin 6 mg → 12 mg schnell i.v.; Verapamil/Betablocker alternativ."]],
brady:[
["Stufenschema der instabilen Bradykardie?","Atropin 0,5 mg i.v. (max. 3 mg), dann Adrenalin/Dopamin-Perfusor oder transkutanes Pacing; bei AV-Block III/Mobitz 2 Atropin oft wirkungslos."],
["Wann Atropin kontraindiziert/unwirksam?","Infranodaler Block, nach Herztransplantation (denerviert), Engwinkelglaukom."]],
hypert:[
["Zielwerte bei Aortendissektion?","Systolisch 100–120 mmHg, HF 60–80/min; Betablocker (Esmolol/Metoprolol) + Urapidil/Nitro; Typ A → Herzchirurgie."],
["Was ist hypertensive Krise vs. Notfall?","Notfall: RR-Anstieg mit Endorganschaden (Enzephalopathie, ACS, Lungenödem, Dissektion) → sofort senken; Krise ohne Organschaden: langsame Senkung."]],
lae:[
["Therapie bei hämodynamisch instabiler Lungenembolie?","Systemische Lyse (z. B. Alteplase 100 mg über 2 h bzw. 50 mg Bolus bei Reanimation), Heparin; sonst Katheter/OP."],
["Typische EKG-Zeichen der Lungenembolie?","Sinustachykardie, S1Q3T3, Rechtsschenkelblock, T-Negativierung V1–V4."]],
asthmacopd:[
["Stufentherapie beim schweren Asthmaanfall?","O₂, Salbutamol + Ipratropium inhalativ, Prednisolon 50–100 mg i.v., Magnesium 2 g i.v., ggf. Adrenalin/Terbutalin s.c.; Intubation bei Erschöpfung (Ketamin)."],
["Zeichen eines lebensbedrohlichen Asthmaanfalls?","Silent chest, Zyanose, Bradykardie, Erschöpfung, Bewusstseinstrübung, PEF < 33 %."]],
anaphylaxie:[
["Therapie der Anaphylaxie nach S2k?","Adrenalin i.m. 0,3–0,5 mg (Oberschenkel), O₂, Volumen, Lagerung, H1-/H2-Blocker und Glukokortikoid adjuvant, Salbutamol bei Bronchospasmus."],
["Einteilung nach Ring und Messmer?","Grad I Haut, II Kreislauf/Atemwege mild, III Schock/Bronchospasmus, IV Atem-/Kreislaufstillstand."]],
dyspnoe:[
["Differenzialdiagnosen akute Dyspnoe?","Asthma/COPD, Lungenödem, LE, Pneumothorax, Pneumonie, Anaphylaxie, ACS, Hyperventilation, Azidose."],
["O₂-Zielwerte?","SpO₂ 94–98 %, bei COPD/Hyperkapnie 88–92 %."]],
stroke:[
["Zeitfenster der systemischen Lyse beim Schlaganfall?","Bis 4,5 h nach Symptombeginn (bekannter Zeitpunkt), Thrombektomie bis 24 h bei Großgefäßverschluss und Mismatch; Zeit festhalten (last seen well)."],
["Prähospitale Maßnahmen beim Schlaganfall?","BE-FAST, BZ, RR nur bei > 220/120 mmHg senken, Stroke Unit mit Voranmeldung, O₂ nur bei Hypoxie, kein ASS."]],
krampf:[
["Stufentherapie Status epilepticus?","Benzodiazepin (Midazolam i.m. 10 mg / Lorazepam 0,1 mg/kg i.v. / Diazepam), dann Levetiracetam/Valproat/Lacosamid, dann Narkose."],
["Definition Status epilepticus?","Anfall > 5 min oder Serie ohne Wiedererlangung des Bewusstseins."]],
sht:[
["Therapieziele beim schweren SHT?","Normoxie, Normokapnie (EtCO₂ 35–40), RR syst. > 110 mmHg, Hypotonie/Hypoxie vermeiden, Oberkörper 30°, bei Einklemmung hyperosmolar (NaCl 3–7,5 %/Mannitol)."],
["Klinische Einklemmungszeichen?","Anisokorie/weite lichtstarre Pupille, Streckkrämpfe, Cushing-Reflex (Hypertonie, Bradykardie), GCS-Abfall."]],
bewusstlos:[
["Was ist AEIOU-TIPS bei Bewusstseinsstörung?","Alkohol, Epilepsie, Insulin, Opioide, Urämie; Trauma, Infekt, Psychiatrie, Schlaganfall/Sepsis."],
["Notwendige Basis-Diagnostik?","BZ, EKG, Vitalzeichen, Pupillen, GCS, Temperatur, neurologischer Status."]],
polytrauma:[
["xABCDE im Trauma?","x = exsanguinierende Blutung, A Atemweg mit HWS, B Belüftung, C Kreislauf/Blutung, D Neuro, E Entkleiden/Wärme."],
["Schockraum-Alarm-Kriterien?","Instabile Vitalparameter (RR < 90, GCS < 9, Intubationspflicht), schwere Verletzung/Mechanismus (Sturz > 3 m, Ejektion, Tod im Fahrzeug)."]],
thorax:[
["Entlastung Spannungspneumothorax?","Nadel (großlumig) bzw. besser Minithorakotomie/Drainage im 4./5. ICR vordere/mittlere Axillarlinie (Safe Triangle)."],
["Zeichen Spannungspneumothorax?","Dyspnoe, Hypotonie, einseitig aufgehobenes Atemgeräusch, Halsvenenstau, Trachealverlagerung (spät)."]],
verbrennung:[
["Parkland-Formel und Verbrennungsgrad?","4 ml × kgKG × %VKOF Kristalloide in 24 h (Hälfte in 8 h); Neunerregel; Grad 2b/3 verlangen Verbrennungszentrum bei großer Fläche."],
["Wann Verbrennungszentrum?","VKOF > 10 % bei Kindern/> 20 % Erwachsene, Gesicht/Hände/Genitale, Inhalationstrauma, Verbrühungen mit Begleitverletzungen."]],
sepsis:[
["Hour-1-Bundle?","Laktat, Blutkulturen, Antibiotikum innerhalb 1 h, Kristalloide 30 ml/kg bei Hypotonie/Laktat ≥ 4, Noradrenalin bei MAP < 65."],
["Sepsis-Definition (Sepsis-3)?","Lebensbedrohliche Organdysfunktion durch dysregulierte Wirtsantwort auf Infektion (SOFA ≥ 2); septischer Schock: Vasopressor + Laktat > 2 trotz Volumen."]],
diabetes:[
["Therapie der Hypoglykämie?","Wach: orale Glukose; sonst Glukose 40 % 25–50 ml i.v. (Kinder G10 2–4 ml/kg) oder Glukagon 1 mg i.m."],
["Ketoazidose: Prinzipien?","Volumen (NaCl 0,9 %), Insulin-Perfusor, Kalium kontrollieren/substituieren, Ursache suchen, Klinik/Intensiv."]],
tox:[
["Wichtige Antidote?","Naloxon (Opioide), Flumazenil (Benzodiazepine), Hydroxocobalamin (Zyanid), Physostigmin (Anticholinergika), Acetylcystein (Paracetamol), Atropin/Obidoxim (Alkylphosphate)."],
["Wann Aktivkohle?","Innerhalb 1–2 h, toxische Dosis, wach, Schutzreflexe erhalten; nicht bei Säuren/Laugen/Alkoholen."]],
hypotherm:[
["Stadieneinteilung Hypothermie?","Leicht 32–35 °C (Zittern), moderat 28–32 °C (Schläfrigkeit, Zittern fehlt), schwer < 28 °C (Bewusstlosigkeit, Kammerflimmern)."],
["Besonderheit Reanimation Hypothermie?","Lange CPR, max. 3 Schocks bei < 30 °C, Adrenalin-Intervall verlängert, ECLS in Zentrum; „nobody is dead until warm and dead“."]],
hitze:[
["Hitzschlag: Therapie?","Aktive Kühlung (Kaltwasserimmersion, Eispacks Hals/Axilla/Leiste), Volumen, Krampf/Atemweg beachten; Zielt < 39 °C."],
["Unterschied Hitzeerschöpfung und Hitzschlag?","Hitzschlag: Kerntemperatur > 40 °C + ZNS-Störung; Erschöpfung: Schwäche, Schwitzen, normale Kerntemp., kein ZNS-Ausfall."]],
ertrinken:[
["Wichtigster Unterschied der Reanimation beim Ertrinken?","Beginn mit 5 Beatmungen, hypoxische Ursache; O₂ 100 %, Wärmeerhalt, Aspirationsgefahr."],
["Stromunfall: Besonderheiten?","Eigenschutz, Strom abschalten, Arrhythmien/Rhabdomyolyse, Brandwunden an Ein-/Austritt, 12-Kanal-EKG, Klinikaufnahme bei Hochspannung."]],
eklampsie:[
["Therapie Eklampsie?","Magnesium 4–6 g über 15–20 min, dann 1–2 g/h; Blutdrucksenkung (Urapidil, Nifedipin), Krampf: Benzodiazepine als Alternative; Entbindung in Klinik."],
["HELLP: Definition?","Hämolyse, erhöhte Leberwerte, niedrige Thrombozyten; epigastrische Schmerzen, Klinik/Entbindung."]],
geburt:[
["Therapie der postpartalen Blutung (4 T)?","Tonus (Atonie): Uterusmassage, Oxytocin 3–5 IE; Trauma; Gewebe (Plazentarest); Thrombin/Gerinnung; TXA 1 g, Volumen, Klinik."],
["Vorgehen bei Schulterdystokie?","McRoberts-Manöver, suprapubischer Druck, dann weitere Manöver (Rubin, Woods), Hilfe rufen."]],
psych:[
["Rechtsgrundlagen bei akuter Eigen-/Fremdgefährdung?","PsychKG NRW (öffentlich-rechtliche Unterbringung), alternativ § 1831 BGB (Betreuung); Polizei/Ordnungsamt/Arzt, Dokumentation."],
["Medikamentöse Sedierung bei Erregung?","Haloperidol 5 mg (QTc beachten) ± Benzodiazepin (Lorazepam 1–2 mg/Midazolam), Eigenschutz, Deeskalation zuerst."]],
kinder:[
["Kinder-Vitalwerte (Orientierung)?","Neugeborene HF 120–160, AF 40–60; Kleinkind HF 100–140; Schulkind HF 70–110; RR syst. min. 70 + 2×Alter."],
["Dosierung Adrenalin Kinder bei Reanimation?","10 µg/kg i.v./i.o. (0,1 ml/kg der 1:10.000-Lösung), alle 3–5 min."]],

<script>
(function(){
'use strict';
/* ---------- Helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const mem={};
const store={
  get(k,d){ if(k in mem) return mem[k]; try{const v=localStorage.getItem('nk_'+k); if(v!==null){mem[k]=JSON.parse(v); return mem[k];}}catch(e){} return d; },
  set(k,v){ mem[k]=v; try{localStorage.setItem('nk_'+k,JSON.stringify(v));}catch(e){} }
};
const hash=s=>{let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return (x>>>0).toString(36);};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const DAY=86400000;
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN;};
const r1=n=>(Math.round(n*10)/10).toString().replace('.',',');
const r2=n=>(Math.round(n*100)/100).toString().replace('.',',');
const mmss=ms=>{ms=Math.max(0,Math.floor(ms/1000));return String(Math.floor(ms/60)).padStart(2,'0')+':'+String(ms%60).padStart(2,'0');};

/* ---------- Daten ---------- */
const TOPICS=window.TOPICS||[], DRUGS=(window.DRUGS||[]).slice().sort((a,b)=>a.n.localeCompare(b.n,'de'));
const CAT_ORDER=['Reanimation','Kardiovaskulär','Atemwege & Atmung','Neurologie','Trauma','Internistische Notfälle','Toxikologie','Umwelt & Thermisch','Geburtshilfe','Pädiatrie','Atemweg, Narkose, Analgesie','Urologie, HNO & Augen','Psychiatrie & Recht','Organisation'];
const CARD_CATS=CAT_ORDER.concat(['Medikamente','Fallbeispiele']);
const CARDS=[];
(window.CARDS||[]).forEach(c=>CARDS.push({id:'m'+hash(c[1]),cat:c[0],q:c[1],a:c[2]}));
DRUGS.forEach(d=>{
  CARDS.push({id:'d'+hash(d.id+'i'),cat:'Medikamente',q:d.n+': Indikationen?',a:d.ind,did:d.id,key:'ind'});
  CARDS.push({id:'d'+hash(d.id+'d'),cat:'Medikamente',q:d.n+': Dosierung (Erwachsene)?',a:d.dose,did:d.id,key:'dose'});
  if(d.kids&&!/^(Nicht|—)/.test(d.kids)) CARDS.push({id:'d'+hash(d.id+'k'),cat:'Medikamente',q:d.n+': Dosierung / Hinweise bei Kindern?',a:d.kids,did:d.id,key:'kids'});
  CARDS.push({id:'d'+hash(d.id+'c'),cat:'Medikamente',q:d.n+': Kontraindikationen / Cave?',a:d.cave,did:d.id,key:'cave'});
});
TOPICS.forEach(t=>{
  if(t.merke&&t.merke.length) CARDS.push({id:'t'+hash(t.id+'m'),cat:t.cat,q:t.t+': Merksätze?',a:t.merke.join('\n'),tid:t.id,key:'merke'});
  if(t.cave&&t.cave.length) CARDS.push({id:'t'+hash(t.id+'c'),cat:t.cat,q:t.t+': Worauf muss man achten (Cave)?',a:t.cave.join('\n'),tid:t.id,key:'cave'});
});

const EXAMQ=window.EXAMQ||{};
Object.keys(EXAMQ).forEach(id=>{const t=TOPICS.find(x=>x.id===id); if(!t) return; EXAMQ[id].forEach(p=>CARDS.push({id:'x'+hash(id+p[0]),cat:t.cat,q:'Prüfungsfrage: '+p[0],a:p[1]}));});

/* ---------- State ---------- */
const TABS=[
 ['start','Start','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
 ['themen','Themen','<path d="M4 5h16M4 12h16M4 19h10"/>'],
 ['med','Medikamente','<rect x="3" y="9" width="18" height="6" rx="3"/><path d="M12 9v6"/>'],
 ['lernen','Lernen','<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 10h8M8 14h5"/>'],
 ['tools','Tools','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>']
];
let S={tab:'start',view:null,stack:[],cat:'Alle',q:'',tool:'timer'};
let srs=store.get('srs',{});
let learned=store.get('learned',{});
let favs=store.get('fav',{}), notes=store.get('notes',{});
function folderCards(k){ return CARDS.filter(c=>k==='fav'?favs[c.id]:(notes[c.id]&&notes[c.id].trim())); }
function noteBox(c){
  const n=notes[c.id]||'';
  if(!n&&!L.noteOpen) return `<button class="btn small" data-a="notetoggle">📝 Notiz hinzufügen</button>`;
  return `<div class="notebox"><div class="more-h">📝 Meine Notiz</div><textarea data-note="${c.id}" rows="3" placeholder="Eigene Notiz zu dieser Karte …">${esc(n)}</textarea></div>`;
}
function folderTiles(){
  return `<div class="folders"><button class="fold" data-a="folder" data-v="fav"><span>★</span><b>Favoriten</b><small>${folderCards('fav').length} Karten</small></button><button class="fold" data-a="folder" data-v="notes"><span>📝</span><b>Notizen</b><small>${folderCards('notes').length} Karten</small></button></div>`;
}
function vFolder(){
  const k=L.folder, list=folderCards(k), title=k==='fav'?'★ Favoriten':'📝 Notizen';
  return `<button class="back" data-a="folderback">‹ Zurück</button>
  <h2 class="h1" style="font-size:1.7rem">${title} <span class="muted small">(${list.length})</span></h2>
  ${list.length?`<button class="btn primary" data-a="startfolder">Alle ${list.length} Karten lernen</button>`:`<p class="lead">Noch leer. ${k==='fav'?'Tippe beim Lernen auf ☆, um eine Karte als Favorit zu speichern.':'Füge beim Lernen über „Notiz hinzufügen“ eine Notiz hinzu.'}</p>`}
  <div class="stack">${list.map(c=>`<details class="fcard"><summary><span class="pill">${dot(c.cat)}${esc(c.cat)}</span><b>${esc(c.q)}</b></summary><div class="ans"><div class="ans-h">✓ Antwort</div>${fmt(c.a)}</div>${moreInfo(c)}<div class="notebox"><div class="more-h">📝 Notiz</div><textarea data-note="${c.id}" rows="3" placeholder="Eigene Notiz …">${esc(notes[c.id]||'')}</textarea></div><div class="row"><button class="btn small" data-a="fav" data-v="${c.id}">${favs[c.id]?'★ Favorit entfernen':'☆ Als Favorit speichern'}</button></div></details>`).join('')}</div>`;
}
let L={mode:'due',cat:'Alle',queue:[],i:0,shown:false,done:0,active:false,folder:null,noteOpen:false};

const CAT_COL={'Reanimation':'#D4231C','Kardiovaskulär':'#E4572E','Atemwege & Atmung':'#1E88E5','Neurologie':'#7E57C2','Trauma':'#F57C00','Internistische Notfälle':'#00897B','Toxikologie':'#6D4C41','Umwelt & Thermisch':'#039BE5','Geburtshilfe':'#D81B60','Pädiatrie':'#F9A825','Atemweg, Narkose, Analgesie':'#3949AB','Psychiatrie & Recht':'#546E7A','Organisation':'#43A047','Urologie, HNO & Augen':'#00ACC1','Medikamente':'#8E24AA','Fallbeispiele':'#5D4037'};
const dot=c=>`<i class="dot" style="background:${CAT_COL[c]||'#888'}"></i>`;
function ico(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
function setHash(t){try{history.replaceState(null,'','#'+t);}catch(e){}}
function go(tab,view,push){
  if(push&&(S.view||S.tab!==tab)) S.stack.push({tab:S.tab,view:S.view});
  if(!push) S.stack=[];
  S.tab=tab; S.view=view||null; render(); window.scrollTo(0,0); setHash(tab);
}
function back(){ const p=S.stack.pop(); if(p){S.tab=p.tab;S.view=p.view;render();window.scrollTo(0,0);} else go(S.tab,null); }

/* ---------- Lern-Statistik ---------- */
function newLimit(){return store.get('newLimit',20);}
function newToday(){const o=store.get('newToday',{});return o.k===todayKey()?o.n:0;}
function bumpNew(){const o=store.get('newToday',{});store.set('newToday',{k:todayKey(),n:(o.k===todayKey()?o.n:0)+1});}
function stats(cat){
  const pool=CARDS.filter(c=>!cat||cat==='Alle'||c.cat===cat), now=Date.now();
  let nw=0,due=0,mas=0;
  pool.forEach(c=>{const s=srs[c.id]; if(!s) nw++; else {if(s.d<=now) due++; if(s.b>=4) mas++;}});
  return {total:pool.length,nw,due,mas,seen:pool.length-nw};
}

/* ---------- Render ---------- */
function render(){
  $('#tabrow').innerHTML=TABS.map(t=>`<button class="tab" data-a="tab" data-v="${t[0]}" aria-current="${S.tab===t[0]}">${ico(t[2])}<span>${t[1]}</span></button>`).join('');
  const app=$('#app'); let html='';
  if(S.view&&S.view.type==='search') html=vSearch();
  else if(S.tab==='start') html=vStart();
  else if(S.tab==='themen') html=S.view&&S.view.type==='topic'?vTopic(S.view.id):vTopics();
  else if(S.tab==='med') html=S.view&&S.view.type==='drug'?vDrug(S.view.id):vDrugs();
  else if(S.tab==='lernen') html=vLearn();
  else html=vTools();
  app.dataset.tab=S.tab; app.dataset.v=S.view?S.view.type:'';
  app.innerHTML='<div class="fade">'+html+'</div>';
  const th=$('#top').offsetHeight; document.documentElement.style.setProperty('--toph',th+'px');
  if(S.tab==='tools'&&S.tool==='timer') updateTimer();
}

function backBtn(){return '<button class="back" data-a="back">‹ Zurück</button>';}
function disc(){return '<p class="disclaimer">Lernhilfe zur Prüfungsvorbereitung (nicht zur Anwendung am Patienten). Inhalte orientieren sich an deutschen/europäischen Leitlinien (AWMF, DGN, DGU, ERC/GRC, ESC, NVL); Dosierungen und Leitlinienstände vor Anwendung immer mit Fachinformation, aktueller Leitlinie und lokalen SOPs abgleichen. Keine Gewähr.</p>';}

/* ---------- Start ---------- */
const QUICK=[['als','Reanimation','#D4231C','ERC 2025 ALS'],['acs','ACS / STEMI','#E4572E','EKG, Reperfusion'],['anaphylaxie','Anaphylaxie','#1E88E5','Adrenalin i.m.'],['polytrauma','Polytrauma','#F57C00','xABCDE, TXA'],['stroke','Schlaganfall','#7E57C2','BE-FAST, Lyse'],['krampf','Status epilepticus','#00897B','Benzodiazepine'],['tachy','Tachykardie','#8E24AA','Instabil → Kardioversion'],['_ekg','EKG-Training','#111827','17 Rhythmen + Quiz']];
function vStart(){
  const st=stats(), exam=store.get('exam','');
  let cdHero='';
  if(exam){
    const d=Math.ceil((new Date(exam+'T08:00:00')-new Date())/DAY);
    if(d>=0){ const per=Math.ceil(st.nw/Math.max(1,d)); cdHero=`<div class="cd"><span>Prüfung in</span><b>${d}</b><span>${d===1?'Tag':'Tagen'} · ${per} neue Karten/Tag</span></div>`; }
  }
  const done=Object.keys(learned).filter(k=>learned[k]).length;
  const cats=CARD_CATS.map(c=>{const s=stats(c);return `<div class="catrow"><span>${esc(c)}</span><span class="mono small muted">${s.seen}/${s.total}</span><div class="bar"><i style="width:${s.total?Math.round(100*s.seen/s.total):0}%"></i></div></div>`;}).join('');
  return `<div class="stack">
  <div class="hero"><div class="eyebrow">Zusatz-Weiterbildung</div><h1>Notfallmedizin</h1>
  <p>${TOPICS.length} Themen nach Leitlinien, ${DRUGS.length} Medikamente, ${CARDS.length} Lernkarten und Tools für den Rettungsdienst.</p>${cdHero}</div>
  <div><div class="grp-h" style="margin-top:2px">Schnellzugriff</div><div class="quick">${QUICK.map(q=>`<button class="qt" style="--c:${q[2]}" data-a="${q[0]==='_ekg'?'goekg':'topic'}" data-v="${q[0]}"><b>${q[1]}</b><span>${q[3]}</span></button>`).join('')}</div></div>
  <div class="stats"><div class="stat"><b>${st.due}</b><span>fällig heute</span></div><div class="stat"><b>${st.nw}</b><span>neu</span></div><div class="stat"><b>${st.mas}</b><span>sicher gelernt</span></div><div class="stat"><b>${done}/${TOPICS.length}</b><span>Themen gelesen</span></div></div>
  <div class="row"><button class="btn primary" data-a="startlearn">Jetzt lernen</button><button class="btn" data-a="tab" data-v="themen">Themen</button><button class="btn" data-a="tab" data-v="tools">CPR-Timer</button></div>
  <div class="card"><h3>Prüfungsdatum</h3><div class="row" style="margin-top:8px"><input type="date" id="exam" value="${esc(exam)}" style="border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px"><label class="small muted">Neue Karten/Tag
  <select id="newlim" style="border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px">${[10,20,30,50].map(n=>`<option ${newLimit()===n?'selected':''}>${n}</option>`).join('')}</select></label></div></div>
  <div><div class="grp-h">Fortschritt nach Bereich</div><div class="list">${cats}</div></div>
  ${disc()}</div>`;
}

/* ---------- Themen ---------- */
function vTopics(){
  const cats=['Alle'].concat(CAT_ORDER.filter(c=>TOPICS.some(t=>t.cat===c)));
  const list=TOPICS.filter(t=>S.cat==='Alle'||t.cat===S.cat);
  let html='';
  CAT_ORDER.forEach(c=>{
    const items=list.filter(t=>t.cat===c); if(!items.length) return;
    html+=`<div class="grp-h">${dot(c)}${esc(c)}</div><div class="list">`+items.map(t=>`<button class="item" data-a="topic" data-v="${t.id}"><b>${esc(t.t)}</b><span class="chev">${learned[t.id]?'<span class="pill ok">gelesen</span>':'›'}</span><span class="sub">${esc(t.s)}</span></button>`).join('')+'</div>';
  });
  return `<div class="stack"><div><div class="eyebrow">Erkrankungen & Vorgehen</div><h1 class="h1">Themen</h1><p class="lead">Nach deutschen und europäischen Leitlinien aufgebaut: Definition, Vorgehen, Medikamente, Cave, Merksätze.</p></div>
  <div class="chips">${cats.map(c=>`<button class="chip" data-a="cat" data-v="${esc(c)}" aria-pressed="${S.cat===c}">${esc(c)}</button>`).join('')}</div>${html}${disc()}</div>`;
}
function sec(title,cls,inner){return inner?`<div class="box ${cls||''}"><h3>${title}</h3>${inner}</div>`:'';}

/* ---------- Lernen ---------- */
const IV=[0,1,2,5,10,21,45];
function ivLabel(d){return d===0?'<10 min':(d===1?'1 Tag':d+' Tage');}
function buildQueue(){
  const now=Date.now();
  let pool=L.folder?folderCards(L.folder):CARDS.filter(c=>L.cat==='Alle'||c.cat===L.cat), q=[];
  if(L.mode==='due'){
    const due=pool.filter(c=>srs[c.id]&&srs[c.id].d<=now);
    const nw=shuffle(pool.filter(c=>!srs[c.id])).slice(0,Math.max(0,newLimit()-newToday()));
    q=shuffle(due).concat(nw);
  } else if(L.mode==='new') q=shuffle(pool.filter(c=>!srs[c.id])).slice(0,20);
  else if(L.mode==='weak') q=shuffle(pool.filter(c=>srs[c.id]&&srs[c.id].b<=1));
  else if(L.mode==='exam') q=shuffle(pool).slice(0,30);
  else q=shuffle(pool).slice(0,40);
  if(L.folder) q=shuffle(pool);
  L.noteOpen=false;
  L.res=[];
  L.queue=q;L.i=0;L.shown=false;L.done=0;L.active=true;
}
function moreInfo(c){
  if(c.did){
    const d=DRUGS.find(x=>x.id===c.did); if(!d) return '';
    const F=[['ind','Indikation',d.ind],['dose','Dosierung Erwachsene',d.dose],['kids','Kinder',d.kids],['cave','Kontraindikationen / Cave',d.cave]].filter(r=>r[0]!==c.key&&r[2]);
    const cl=dcls(d).map(k=>syr(k,CLS[k].n.split(' / ')[0].replace('Muskelrelaxans','Relaxans').replace('Nicht klassifiziert','Sonstige'))).join('');
    return `<div class="more"><div class="more-h">Alle Infos zu ${esc(d.n)} ${cl}</div><div class="more-g">${esc(d.g||'')}</div>${F.map(r=>`<div class="more-r"><b>${r[1]}</b><div>${fmt(r[2])}</div></div>`).join('')}</div>`;
  }
  if(c.tid){
    const t=TOPICS.find(x=>x.id===c.tid); if(!t) return '';
    const L=a=>a&&a.length?a.map(x=>'• '+x).join('\n'):'';
    const F=[['def','Definition',t.def],['merke','Merke',L(t.merke)],['cave','Cave',L(t.cave)],['meds','Medikamente',L(t.meds)]].filter(r=>r[0]!==c.key&&r[2]);
    return `<div class="more"><div class="more-h">Mehr zu „${esc(t.t)}“</div>${F.map(r=>`<div class="more-r"><b>${r[1]}</b><div>${fmt(r[2])}</div></div>`).join('')}</div>`;
  }
  return '';
}

      ${noteBox(c)}

    }
  } else if(L.folder){
    body=vFolder();
  } else {
    body=`<div class="stats"><div class="stat"><b>${st.due}</b><span>fällig</span></div><div class="stat"><b>${st.nw}</b><span>neu</span></div><div class="stat"><b>${st.mas}</b><span>sicher</span></div><div class="stat"><b>${st.total}</b><span>Karten</span></div></div>
    <div class="modes">${modes.map(m=>`<button class="mode" data-a="mode" data-v="${m[0]}" aria-pressed="${L.mode===m[0]}"><b>${m[1]}</b><span>${m[2]}</span></button>`).join('')}</div>
    <button class="btn primary" style="width:100%;justify-content:center;padding:14px" data-a="startlearn">Starten</button>
    <p class="small muted">Heute neu: ${newToday()} von ${newLimit()}. Fortschritt wird in diesem Browser gespeichert (auf iPhone und PC getrennt).</p>
    <div class="row"><button class="btn small" data-a="resetsrs">${L.confirmReset?'Wirklich alles löschen? Nochmal tippen':'Fortschritt zurücksetzen'}</button></div>`;
  }
  return `<div class="stack"><div><div class="eyebrow">Wiederholung mit Intervallen</div><h1 class="h1">Lernkarten</h1></div>
  ${L.active||L.folder?'':folderTiles()}
  ${L.active||L.folder?'':`<div class="chips wrapchips">${cats.map(c=>`<button class="chip" data-a="lcat" data-v="${esc(c)}" aria-pressed="${L.cat===c}">${esc(c)}</button>`).join('')}</div>`}
  ${body}</div>`;
}
function rate(r){
  const c=L.queue[L.i]; if(!c) return;
  const isNew=!srs[c.id]; const s=srs[c.id]||{b:0,n:0,l:0};
  if(isNew) bumpNew();
  s.n=(s.n||0)+1;
  if(r===0){ s.b=0; s.l=(s.l||0)+1; s.d=Date.now()+10*60000; L.queue.push(c); }
  else { s.b= r===1? Math.max(1,s.b||0) : Math.min(6,(s.b||0)+(r===2?1:2)); s.d=Date.now()+Math.max(1,IV[s.b])*DAY; }
  srs[c.id]=s; store.set('srs',srs);
  L.done++; L.i++; L.shown=false; L.noteOpen=false; render();
}

/* CPR-Timer */
const T={run:false,t0:0,acc:0,cyc:0,shocks:0,adr:0,amio:0,lastAdr:null,log:[],metro:false,mi:null,ac:null,beeped:false};
function tNow(){return T.acc+(T.run?Date.now()-T.t0:0);}
function tlog(s){T.log.unshift(mmss(tNow())+'  '+s);}
function beep(f,d){try{if(!T.ac)T.ac=new (window.AudioContext||window.webkitAudioContext)();const o=T.ac.createOscillator(),g=T.ac.createGain();o.frequency.value=f||880;o.connect(g);g.connect(T.ac.destination);g.gain.value=.15;o.start();o.stop(T.ac.currentTime+(d||.12));}catch(e){}}
function toolTimer(){
  return `<div class="card stack"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">Gesamtzeit</div><div class="timer" id="t-el">00:00</div></div><div><div class="eyebrow">Zyklus (2 min)</div><div class="timer" id="t-cyc">02:00</div></div></div>
  <div id="t-hint" class="alert" hidden></div>
  <div class="row small"><span>Schocks: <b id="t-sh">0</b></span><span>Adrenalin: <b id="t-ad">0</b> <span class="muted" id="t-adt"></span></span><span>Amiodaron: <b id="t-am">0</b></span></div>
  <div class="cpr"><button class="btn primary big" data-a="t-run" id="t-runb">${T.run?'Pause':(T.acc?'Weiter':'Start')}</button><button class="btn big" data-a="t-shock">⚡ Schock</button><button class="btn big" data-a="t-adr">Adrenalin 1 mg</button><button class="btn big" data-a="t-amio">Amiodaron</button><button class="btn big" data-a="t-metro" aria-pressed="${T.metro}">Metronom ${T.metro?'an':'aus'} (110/min)</button><button class="btn big ok" data-a="t-rosc">ROSC</button></div>
  <div class="row"><button class="btn small" data-a="t-reset">Zurücksetzen</button></div>
  <div class="log" id="t-log">${T.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div>
  <p class="small muted">Erinnerung: Rhythmuscheck alle 2 min · Adrenalin bei schockbar nach 3. Schock, bei nicht schockbar sofort, danach alle 3–5 min · Amiodaron 300 mg nach 3. Schock, 150 mg nach 5. Schock · 4H/4T.</p></div>`;
}
function updateTimer(){
  const el=$('#t-el'); if(!el) return;
  const ms=tNow(); el.textContent=mmss(ms);
  const cl=120000-((ms-T.cyc)%120000+120000)%120000;
  if(T.run&&ms-T.cyc>=120000){T.cyc+=120000;tlog('Rhythmuscheck (2 min)');beep(1000,.4);const lg=$('#t-log');if(lg)lg.innerHTML=T.log.map(l=>`<div>${esc(l)}</div>`).join('');}
  $('#t-cyc').textContent=mmss(120000-(ms-T.cyc));
  $('#t-sh').textContent=T.shocks;$('#t-ad').textContent=T.adr;$('#t-am').textContent=T.amio;
  $('#t-adt').textContent=T.lastAdr!=null?'(vor '+mmss(ms-T.lastAdr)+')':'';
  const h=$('#t-hint'); let msg='';
  if(T.lastAdr!=null&&ms-T.lastAdr>=180000) msg='Adrenalin fällig (alle 3–5 min)';
  if(T.shocks>=3&&T.amio===0) msg='≥3 Schocks: Adrenalin 1 mg + Amiodaron 300 mg';
  else if(T.shocks>=5&&T.amio===1) msg='≥5 Schocks: Amiodaron 150 mg';
  if(h){h.hidden=!msg;h.textContent=msg;}
}

function tAct(a){
  if(a==='t-run'){ if(T.run){T.acc+=Date.now()-T.t0;T.run=false;tlog('Pause');} else {T.t0=Date.now();T.run=true;tlog(T.acc?'Weiter':'Start');} }
  else if(a==='t-shock'){T.shocks++;tlog('Schock #'+T.shocks);}
  else if(a==='t-adr'){T.adr++;T.lastAdr=tNow();tlog('Adrenalin 1 mg (#'+T.adr+')');}
  else if(a==='t-amio'){T.amio++;tlog('Amiodaron '+(T.amio===1?'300':'150')+' mg');}
  else if(a==='t-rosc'){tlog('ROSC');if(T.run){T.acc+=Date.now()-T.t0;T.run=false;}}
  else if(a==='t-metro'){T.metro=!T.metro; if(T.metro){beep(700,.05);T.mi=setInterval(()=>beep(700,.05),60000/110);} else {clearInterval(T.mi);T.mi=null;}}
  else if(a==='t-reset'){clearInterval(T.mi);Object.assign(T,{run:false,t0:0,acc:0,cyc:0,shocks:0,adr:0,amio:0,lastAdr:null,log:[],metro:false,mi:null});}
  render();
}

const PI2=Math.PI*2;
function rngf(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const Gs=(t,m,s,a)=>a*Math.exp(-((t-m)*(t-m))/(2*s*s));
function qrsw(t,c,o){o=o||{};const w=o.w||1;return Gs(t,c-.028*w,.008*w,o.q==null?-.09:o.q)+Gs(t,c,.011*w,o.r==null?1.1:o.r)+Gs(t,c+.03*w,.011*w,o.s==null?-.22:o.s)+Gs(t,c+.14*w,o.sts||.05,o.st||0)+Gs(t,c+.28*w,o.ts||.05,o.t==null?.3:o.t);}
const pwv=(t,c,a)=>Gs(t,c,.022,a==null?.13:a);
function train(times,fn){return t=>{let v=0;for(let i=0;i<times.length;i++){const c=times[i];if(c<t-.8)continue;if(c>t+.8)break;v+=fn(t,c);}return v;};}
function reg(T,s,n){const a=[];for(let k=0;k<n;k++)a.push(s+k*T);return a;}
function sum(...fs){return t=>fs.reduce((v,f)=>v+f(t),0);}
